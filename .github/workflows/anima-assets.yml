name: Anima approved sprite asset pack
on:
  pull_request:
    paths:
      - 'anima-sprite-engine.js'
      - 'data/anima-rigs.js'
      - 'anima-motion-lab.js'
      - 'data/anima-approval.json'
      - 'mon/starter-v2/**'
      - 'mon/route1/**'
      - 'route1-data.js'
      - 'mon/route2/**'
      - 'route2-data.js'
      - 'mon/tribel/**'
      - 'tribel-data.js'
      - 'mon/route3/**'
      - 'route3-data.js'
      - 'tools/bake-anima-sheets.cjs'
      - '.github/workflows/anima-assets.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'compact or full'
        type: choice
        options: [compact, full]
        default: full
      view:
        description: 'front or reverse (real back art where available)'
        type: choice
        options: [front, reverse]
        default: front
      scope:
        description: 'approved species only; legacy all remains provisional'
        type: choice
        options: [approved, legacy-all]
        default: approved
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Generate approved species sheets
        env:
          PROFILE: ${{ inputs.profile || 'full' }}
          VIEW: ${{ inputs.view || 'front' }}
          SCOPE: ${{ inputs.scope || 'approved' }}
        run: |
          flags=()
          if [ "$PROFILE" = compact ]; then flags+=(--compact); fi
          if [ "$VIEW" = reverse ]; then flags+=(--back); fi
          if [ "$SCOPE" = legacy-all ]; then flags+=(--all); else flags+=(--ids=2,18,19,3,20,21,1,16,17,451,452,717,718,719,334,335,336,765,766,1002,1003,711,712,516,517,250,251,252,948,949,950,223,224,981,982,283,284,1179,1180,546,547,265,266,1188,1189,1190,849,850,100,101,190,191,192,484,485,1062,1063,11,36,241,242,376,377,370,371,274,275,61,62,63); fi
          node tools/bake-anima-sheets.cjs "${flags[@]}" --out=anima-sheets
      - uses: actions/upload-artifact@v4
        with:
          name: anima-v113-sprite-sheets
          path: anima-sheets/
          if-no-files-found: error
  runtime-pack:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tools/bake-anima-runtime.cjs --ids=2,18,19,3,20,21,1,16,17,451,452,717,718,719,334,335,336,765,766,1002,1003,711,712,516,517,250,251,252,948,949,950,223,224,981,982,283,284,1179,1180,546,547,265,266,1188,1189,1190,849,850,100,101,190,191,192,484,485,1062,1063,11,36,241,242,376,377,370,371,274,275,61,62,63 --out=anima-runtime-pack
      - uses: actions/upload-artifact@v4
        with:
          name: anima-v113-runtime-atlas-pack
          path: anima-runtime-pack/
          if-no-files-found: error

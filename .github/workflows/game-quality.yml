name: Game quality checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/emerald-core.test.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/momino-browser.cjs
      - run: node tests/browser-smoke.cjs
      - run: node tests/expansion-browser.cjs
      - run: node tests/individual-world-browser.cjs
      - run: node tests/story-clear-browser.cjs
      - run: node tests/mobile-webkit.cjs
      - run: node tests/anima-sprite-browser.cjs
      - run: node tests/starter-trio-browser.cjs
      - run: node tests/starter-selection-ui.cjs
      - run: node tests/battle-art-browser.cjs
      - run: node tests/route1-browser.cjs
      - run: node tests/route2-browser.cjs
      - run: node tests/harusaki-browser.cjs
      - run: node tests/tribel-browser.cjs
      - run: node tests/route3-browser.cjs
      - run: node tools/bake-anima-sheets.cjs --ids=2,18,19,3,20,21,1,16,17,451,452,717,718,719,334,335,336,765,766,1002,1003,711,712,516,517,250,251,252,948,949,950,223,224,981,982,283,284,1179,1180,546,547,265,266,1188,1189,1190,190,191,1062,1063,11,36,241,242,376,377,370,371,274,275,61,62,63 --out=test-results/anima-motion/full-sheets
      - run: node tools/bake-anima-runtime.cjs --ids=2,18,19,3,20,21,1,16,17,451,452,717,718,719,334,335,336,765,766,1002,1003,711,712,516,517,250,251,252,948,949,950,223,224,981,982,283,284,1179,1180,546,547,265,266,1188,1189,1190,190,191,1062,1063,11,36,241,242,376,377,370,371,274,275,61,62,63 --out=test-results/anima-motion/runtime-sample
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v114-momino-reports
          path: test-results/

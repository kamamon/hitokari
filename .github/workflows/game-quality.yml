name: Game quality checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/emerald-core.test.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.cjs
      - run: node tests/expansion-browser.cjs

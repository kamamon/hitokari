name: Game quality checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/emerald-core.test.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/browser-smoke.cjs
      - run: node tests/expansion-browser.cjs
      - run: node tests/individual-world-browser.cjs
      - run: node tests/story-clear-browser.cjs
      - run: node tests/mobile-webkit.cjs
      - run: node tests/anima-sprite-browser.cjs
      - run: node tools/bake-anima-sheets.cjs --out=test-results/anima-motion/full-sheets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-test-reports
          path: test-results/

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="一狩り">
<meta name="theme-color" content="#17120d">
<meta name="description" content="スマホで遊べる狩猟アクション。モンスターを狩り、素材で武具を作って強くなろう。">
<title>一狩り</title>
<style>
:root{--bg:#17120d;--panel:#241b13;--card:#f1e6cc;--card2:#e7d9b8;--ink:#2b2015;--gold:#d8a74a;--gold2:#f0cc7a;--red:#b5372b;--green:#4e8a3a;--dim:#8a7a62;--line:#cbb98f;--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--sans:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;font-family:var(--sans);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#cv,#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
#gl{display:none}
#safe{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hide{display:none!important}

/* ---- 拠点メニュー ---- */
#ui{position:fixed;left:0;top:0;right:0;bottom:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;z-index:5;background:rgba(23,18,13,.95);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#ui.scr-title,#ui.scr-home{background:transparent}
.wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12vh 24px calc(env(safe-area-inset-bottom) + 28px);min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,rgba(23,18,13,0) 30%,rgba(23,18,13,.9) 62%)}
.logo{text-align:center;color:#fff4d6;text-shadow:0 3px 0 #000,0 0 26px rgba(255,150,60,.55)}
.logo h1{font-family:var(--serif);font-weight:900;font-size:76px;letter-spacing:.12em;margin:0;line-height:1;padding-left:.12em}
.logo p{margin:10px 0 0;font-size:14px;letter-spacing:.4em;color:var(--gold2)}
.logo.sm h1{font-size:40px}.logo.sm p{font-size:12px;margin-top:4px}
.tbtn{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.foot{color:#9c8b70;font-size:12px;text-align:center;margin:14px 0}
.town{height:27vh;min-height:150px;display:flex;align-items:flex-start;justify-content:center;padding-top:22px}
.sheet{flex:1;background:var(--panel);border-radius:22px 22px 0 0;border-top:2px solid var(--gold);padding:16px 14px calc(env(safe-area-inset-bottom) + 26px);box-shadow:0 -10px 30px rgba(0,0,0,.5)}
.me{background:var(--card);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hr{font-weight:800;color:#8a5a12;letter-spacing:.04em}
.z{font-weight:800;color:#8a5a12;white-space:nowrap}.z.lg{font-size:22px}
.eqline{margin:6px 0 4px;font-size:14px;line-height:1.6}
.dim{color:var(--dim)}.sm{font-size:12.5px}
.hint{margin:10px 2px;color:var(--gold2);font-size:13px;line-height:1.5}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{background:linear-gradient(180deg,#f4ead2,#e3d3ad);border:1px solid #a98f5c;border-bottom-width:4px;border-radius:14px;padding:12px 10px;text-align:left;display:grid;grid-template-columns:34px 1fr;column-gap:8px;align-items:center;min-height:68px}
.m:active{transform:translateY(2px);border-bottom-width:2px}
.m i{font-style:normal;font-size:26px;grid-row:1/3}.m b{font-size:16px}.m small{color:#6d5c44;font-size:11.5px}
.m.main{grid-column:1/3;background:linear-gradient(180deg,#e9b65a,#c98b2c);border-color:#7a4f12;min-height:76px}
.m.main b{font-size:20px;font-family:var(--serif)}.m.main small{color:#4a3008}
.hdr{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:84px 1fr 84px;align-items:center;padding:10px 12px;background:rgba(23,18,13,.97);border-bottom:2px solid var(--gold)}
.hdr h2{margin:0;text-align:center;color:#fff4d6;font-family:var(--serif);font-size:19px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .z{color:var(--gold2);text-align:right;font-size:14px}
.back{background:none;border:1px solid #6b5636;color:#e8dcc0;border-radius:10px;padding:9px 6px;font-size:14px}
.list{padding:12px 12px calc(env(safe-area-inset-bottom) + 30px);display:flex;flex-direction:column;gap:10px}
.list h3{color:var(--gold2);margin:8px 2px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;font-size:15px;line-height:1.5;display:block}
.card h3{margin:0 0 6px;font-size:15px;color:#6b4a12}.card p{margin:4px 0}.card ul{margin:4px 0;padding-left:20px}.card li{margin:5px 0;font-size:14px}
button.card:active{background:var(--card2)}
.card.slim{padding:9px 12px}.card.sel{border:2px solid #b7791f;background:#f8eccb}.card.own{opacity:.72}.card.rank{background:linear-gradient(180deg,#f6dc8e,#e2b54a);border-color:#8a5a12}
.card.danger b{color:var(--red)}
.card.eq{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.card.eq>div:only-of-type{grid-column:1/3}
.slot{display:inline-block;background:#3a2c1e;color:#f1e6cc;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.chev{color:#a08a62;font-size:22px}
.sub{font-size:13px;color:#5a4a36;margin-top:2px}
.tag{display:inline-block;border-radius:5px;padding:1px 7px;font-size:11.5px;font-weight:700;color:#fff;margin-right:5px;background:#666}
.tag.k-hunt{background:var(--red)}.tag.k-gather{background:var(--green)}.tag.k-small{background:#b7791f}.tag.key{background:#2d5d9a}.tag.vet{background:#5b2a7a}
.done{color:var(--green);font-weight:800;font-size:13px;white-space:nowrap}
.tabs{display:flex;gap:6px;padding:12px 12px 0}
.tab{flex:1;background:#3a2c1e;color:#cdbb93;border:1px solid #5a4630;border-radius:10px 10px 0 0;padding:11px 0;font-weight:800;font-size:15px}
.tab.on{background:var(--gold);color:#2b2015;border-color:var(--gold)}.tab:disabled{opacity:.45}
.chips{display:flex;gap:6px;padding:12px 12px 0;flex-wrap:wrap}
.chipb{background:#3a2c1e;color:#cdbb93;border:1px solid #5a4630;border-radius:18px;padding:8px 13px;font-weight:700;font-size:13.5px}
.chipb.on{background:#f1e6cc;color:#2b2015}
.note{color:#bfae8c;font-size:12.5px;margin:10px 14px 0;line-height:1.6}.list .note{margin:4px 2px}
.mats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mat{background:#fff8e6;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.mat.lack{background:#f6d9d2;border-color:#d59a8c;color:#8a2a1c}.mat.r3{background:#fff0b8;border-color:#d8a74a}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;background:#9a8f7a;transform:rotate(45deg);margin:0 3px 0 2px}
.chip.r1{background:#4e8a3a}.chip.r2{background:#2d6fb5}.chip.r3{background:#d8a74a;box-shadow:0 0 6px #ffd76a}
.sharp{display:inline-block;width:22px;height:9px;border-radius:2px;border:1px solid #2b2015;vertical-align:middle;margin-right:3px}
.el{font-weight:800;text-shadow:0 0 1px #000,0 0 1px #000}
.act{display:block;width:100%;margin-top:6px;background:linear-gradient(180deg,#5c9c44,#3f7a2e);color:#fff;border:1px solid #2a5a1e;border-bottom-width:3px;border-radius:10px;padding:11px;font-weight:800;font-size:15px}
.act.sm{display:inline-block;width:auto;padding:8px 13px;font-size:13.5px;margin:0}
.act.off{background:#b9ad93;border-color:#9a8f7a;color:#f1e6cc}
.act.ghost{background:#fff8e6;color:#5a4a36;border-color:var(--line)}
.big{display:block;width:100%;background:#3a2c1e;color:#f1e6cc;border:1px solid #6b5636;border-bottom-width:4px;border-radius:14px;padding:15px;font-size:17px;font-weight:800;letter-spacing:.06em}
.big:active{transform:translateY(2px);border-bottom-width:2px}
.big.gold{background:linear-gradient(180deg,#eebd62,#c98b2c);color:#2b1a05;border-color:#7a4f12;font-family:var(--serif);font-size:19px}
.big.danger{background:#7a2a20;border-color:#4a1610}
.kv{width:100%;border-collapse:collapse;margin:8px 0 2px;font-size:14px}.kv th{text-align:left;color:#6b5a42;font-weight:700;padding:5px 10px 5px 0;white-space:nowrap;vertical-align:top;width:84px}.kv td{padding:5px 0}
.mon{background:#fff8e6;border-left:4px solid var(--red);border-radius:6px;padding:8px 10px;margin:8px 0}
.skb{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}.skl{margin:3px 0}
.sethd{display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;background:none;border:none;text-align:left;padding:0;font-size:15px}
.piece{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.sw{background:#9a8f7a;color:#fff;border-radius:14px;padding:5px 12px;font-weight:800;font-size:13px}.sw.on{background:var(--green)}
.result{text-align:center;padding:34px 16px 16px;color:#fff4d6}.result h1{font-family:var(--serif);font-size:38px;margin:0;letter-spacing:.1em}.result.ok h1{color:#ffd76a;text-shadow:0 0 22px rgba(255,180,60,.6)}.result.ng h1{color:#ff9a8a}.result p{margin:8px 0 0;color:#cdbb93}
#modal{position:fixed;left:0;top:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.66);display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.mbox h3{margin:0;font-family:var(--serif);font-size:20px;text-align:center}.mbox p{margin:0;line-height:1.6}
.mbox textarea{width:100%;height:110px;font-size:12px;border-radius:8px;border:1px solid var(--line);padding:8px;-webkit-user-select:text;user-select:text}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,20px);background:rgba(20,14,8,.92);color:#fff4d6;border:1px solid var(--gold);border-radius:22px;padding:10px 18px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:all .2s;z-index:30;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- 狩猟中のタッチ操作 ---- */
#ctl{position:fixed;left:0;top:0;right:0;bottom:0;z-index:4;pointer-events:none;touch-action:none}
#ctl>*{pointer-events:auto;touch-action:none}
#stickZone{position:absolute;left:0;top:24%;width:52%;bottom:0}
#lookZone{position:absolute;right:0;top:24%;width:48%;bottom:0}
#ctl.v2d #lookZone,#ctl.v2d #bLock{display:none}
#stick{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(0,0,0,.2);opacity:.4;pointer-events:none!important}
#stick.on{opacity:1}
#stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 2px 6px rgba(0,0,0,.4);transform:translate(-50%,-50%)}
.cb{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(20,14,8,.52);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0;text-shadow:0 1px 2px #000;line-height:1.1}
.cb.on{background:rgba(216,167,74,.8);transform:scale(.93)}
#bAtk{right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 34px);width:90px;height:90px;font-size:18px;border-color:rgba(255,150,120,.95);background:rgba(181,55,43,.6)}
#bDg{right:calc(env(safe-area-inset-right) + 118px);bottom:calc(env(safe-area-inset-bottom) + 20px);width:70px;height:70px;border-color:rgba(150,210,255,.9);background:rgba(40,80,120,.55)}
#bSp{right:calc(env(safe-area-inset-right) + 106px);bottom:calc(env(safe-area-inset-bottom) + 104px);width:68px;height:68px;font-size:13px;border-color:rgba(255,220,120,.9);background:rgba(120,90,20,.55)}
#bAct{right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 136px);width:82px;height:46px;border-radius:23px;background:rgba(78,138,58,.88);border-color:#d9f2bd;font-size:14px}
#itm{position:absolute;right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 196px);display:flex;align-items:center;gap:4px}
#itm .cb{position:static}
#bPrev,#bNext{width:32px;height:44px;border-radius:10px;font-size:13px}
#bItem{width:94px;height:52px;border-radius:14px;display:grid;grid-template-columns:30px 1fr;grid-template-rows:1fr 1fr;column-gap:2px;padding:4px 6px;text-align:left}
#bItem .ic{grid-row:1/3;font-size:22px;align-self:center;text-align:center}#bItem .nm{font-size:11px;align-self:end;white-space:nowrap;overflow:hidden}#bItem .ct{font-size:13px;color:var(--gold2);align-self:start}
#bItem.zero{opacity:.45}
#bPause{top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 118px);width:38px;height:38px;border-radius:10px;font-size:15px}
#bLock{top:calc(env(safe-area-inset-top) + 52px);right:calc(env(safe-area-inset-right) + 118px);width:38px;height:38px;border-radius:10px;font-size:17px;opacity:.55}
#bLock.lk{opacity:1;border-color:#ffd76a;background:rgba(150,100,10,.7)}
#bRet{left:50%;top:17%;transform:translateX(-50%);width:auto;height:auto;border-radius:26px;padding:13px 28px;font-size:17px;background:linear-gradient(180deg,#eebd62,#c98b2c);color:#2b1a05;border-color:#fff4d6;text-shadow:none;font-family:var(--serif)}
#ctl.lefty #stickZone{left:auto;right:0}
#ctl.lefty #lookZone{right:auto;left:0}
#ctl.lefty #bAtk{right:auto;left:calc(env(safe-area-inset-left) + 16px)}
#ctl.lefty #bDg{right:auto;left:calc(env(safe-area-inset-left) + 118px)}
#ctl.lefty #bSp{right:auto;left:calc(env(safe-area-inset-left) + 106px)}
#ctl.lefty #bAct{right:auto;left:calc(env(safe-area-inset-left) + 20px)}
#ctl.lefty #itm{right:auto;left:calc(env(safe-area-inset-left) + 10px)}
@media (max-height:430px){#itm{bottom:auto;top:calc(env(safe-area-inset-top) + 96px)}#stickZone{top:30%}.town{height:120px;min-height:120px}.logo.sm h1{font-size:30px}}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="safe"></div>
<div id="ctl" class="hide">
  <div id="lookZone"></div>
  <div id="stickZone"></div>
  <div id="stick"><i></i></div>
  <button id="bLock" class="cb" aria-label="ロックオン">🎯</button>
  <button id="bPause" class="cb" aria-label="一時停止">Ⅱ</button>
  <div id="itm"><button id="bPrev" class="cb" aria-label="前の道具">◀</button><button id="bItem" class="cb" aria-label="道具を使う"></button><button id="bNext" class="cb" aria-label="次の道具">▶</button></div>
  <button id="bAct" class="cb hide">採取</button>
  <button id="bSp" class="cb">特殊</button>
  <button id="bDg" class="cb">回避</button>
  <button id="bAtk" class="cb">攻撃</button>
  <button id="bRet" class="cb hide">村へ帰還する</button>
</div>
<div id="ui"></div>
<div id="modal" class="hide"></div>
<div id="toast"></div>
<script src="three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   一狩り — スマホで遊べる狩猟アクション (単一HTML / 外部ファイルなし)
   ===================================================================== */
const VER = 1, SAVE_KEY = 'hitokari_save_v1';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const hyp = Math.hypot;
const angN = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
const angD = (a, b) => angN(b - a);
const angTo = (a, b, m) => { const d = angD(a, b); return Math.abs(d) <= m ? b : a + Math.sign(d) * m; };
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wpick(list) { let tot = 0; for (const e of list) tot += e[1]; let r = Math.random() * tot; for (const e of list) { r -= e[1]; if (r <= 0) return e[0]; } return list[0][0]; }

/* ---------- 属性・斬れ味 ---------- */
const EL = {
  fire: { n: '火', c: '#ff7043' }, ice: { n: '氷', c: '#7fd6ff' }, thunder: { n: '雷', c: '#ffe14d' },
  poison: { n: '毒', c: '#b98cff' }, dark: { n: '冥', c: '#ff5fa2' }
};
const SHARP = [
  { n: '赤', c: '#d9412f', m: .5 }, { n: '橙', c: '#e88a2a', m: .75 }, { n: '黄', c: '#e8d22a', m: 1 },
  { n: '緑', c: '#59c245', m: 1.05 }, { n: '青', c: '#3d8bff', m: 1.2 }, { n: '白', c: '#f4f4f4', m: 1.32 }
];

/* ---------- アイテム ---------- */
const IT = {
  potion: { n: '回復薬', ic: '🧪', d: '体力を40回復する', max: 10, buy: 66, sell: 10, use: 1.3, k: 'use' },
  mega: { n: '上回復薬', ic: '🍶', d: '体力を90回復する', max: 10, sell: 40, use: 1.3, k: 'use' },
  antidote: { n: '解毒薬', ic: '💧', d: '毒・火傷・凍えを治す', max: 10, buy: 50, sell: 8, use: 1.0, k: 'use' },
  ration: { n: '携帯食料', ic: '🍖', d: 'スタミナ全回復。3分間スタミナ消費を軽減', max: 10, buy: 80, sell: 10, use: 1.4, k: 'use' },
  whet: { n: '砥石', ic: '🔸', d: '斬れ味を回復する(何度でも使える)', max: 1, inf: 1, use: 2.0, k: 'use' },
  might: { n: '剛力薬', ic: '💪', d: '3分間 攻撃力+12%', max: 5, buy: 320, sell: 40, use: 1.3, k: 'use' },
  guard: { n: '堅守薬', ic: '🛡️', d: '3分間 防御力+25%', max: 5, buy: 280, sell: 40, use: 1.3, k: 'use' },
  flash: { n: '閃光玉', ic: '✨', d: 'こちらを向いた大型モンスターの目をくらませる', max: 5, buy: 200, sell: 30, use: .45, k: 'use' },
  trap: { n: '痺れ罠', ic: '⚡', d: '設置して、踏んだ大型モンスターを痺れさせる', max: 2, buy: 400, sell: 60, use: 1.8, k: 'use' },

    case 'heal': tone(520, .12, 'sine', .14); tone(780, .2, 'sine', .14, 0, .1); break;
    case 'whet': noise(.12, .14, 5000, 4); tone(2000, .1, 'triangle', .06, 2600); break;
    case 'pick': tone(700, .07, 'triangle', .12); tone(1050, .1, 'triangle', .12, 0, .06); break;
    case 'deny': tone(160, .12, 'square', .08); break;
    case 'chg': tone(600, .1, 'sine', .1, 900); break;
    case 'demon': tone(200, .3, 'sawtooth', .14, 500); break;
    case 'bow': noise(.08, .14, 3000, 2, 800); tone(240, .08, 'triangle', .1, 120); break;
    case 'break': noise(.3, .4, 1200, 1, 200); tone(240, .25, 'square', .16, 60); buzz(30); break;
    case 'die': tone(160, 1.3, 'sawtooth', .22, 40); noise(1.0, .2, 400, .7, 100); break;
    case 'flash': noise(.3, .3, 6000, .5); tone(1800, .3, 'sine', .1, 400); break;
    case 'puff': noise(.25, .16, 800, .8, 300); break;
    case 'zap': for (let i = 0; i < 4; i++) tone(900 + i * 300, .06, 'square', .08, 300, i * .05); break;
    case 'ui': tone(660, .05, 'triangle', .07); break;
    case 'buy': tone(880, .06, 'triangle', .1); tone(1320, .1, 'triangle', .1, 0, .07); break;
    case 'forge': tone(1100, .1, 'triangle', .16, 700); noise(.06, .25, 3500, 3); tone(1300, .14, 'triangle', .14, 800, .22); break;
    case 'clear': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .32, 'triangle', .16, 0, i * .12)); break;
    case 'fail': [392, 330, 262, 196].forEach((f, i) => tone(f, .4, 'triangle', .16, 0, i * .22)); break;
  }
}

function vHelp() {
  return hdr('あそびかた', UI.b || 'home') + `<div class="list"><div class="card"><h3>狩りの流れ</h3><p>クエストを受けてフィールドへ。大型モンスターを見つけて狩り、素材を剥ぎ取って村へ戻る。素材で武器や防具を作り、さらに強いモンスターに挑もう。</p></div>
  <div class="card"><h3>操作</h3><table class="kv"><tr><th>移動</th><td>画面の左側に触れてなぞる(触れた場所がスティックになる)</td></tr><tr><th>攻撃</th><td>連打でコンボ。弓は長押しで溜めて離す</td></tr><tr><th>特殊</th><td>武器ごとの技(ガード・溜め・修羅化・強射)</td></tr><tr><th>回避</th><td>転がって避ける。出始めは無敵。スタミナを使う</td></tr><tr><th>道具</th><td>◀▶で選び、中央を押して使う</td></tr><tr><th>採取</th><td>光る場所や倒したモンスターのそばで緑のボタンが出る</td></tr><tr><th>視点</th><td>🎯ロックオン中は標的を自動で正面に捉える。解除すると、画面の右側をなぞって自由に見回せる</td></tr></table><p class="sm dim">キーボード: WASD・矢印=移動　J=攻撃　K=特殊　スペース=回避　E=道具　Q/R=道具切替　F=採取　C/V=視点回転</p></div>
  <div class="card"><h3>狩りのコツ</h3><ul><li>スティックを上に倒すと画面の奥(ロックオン中は標的の方)へ進む。</li><li>地面の赤い範囲は攻撃の予兆。塗りつぶされる前に外へ出るか、回避ですり抜ける。</li><li>頭は弱点のことが多い。数字が橙色なら弱点に当たっている。</li><li>斬れ味が落ちると攻撃が弾かれる。砥石でこまめに研ごう。</li><li>頭や翼を攻め続けると部位破壊、尻尾は斬る武器で切断できる。報酬が増える。</li><li>ハートが赤く速く脈打ったら弱っている合図。痺れ罠にかけて麻酔玉を2発当てれば捕獲できる。</li><li>3回力尽きるとクエスト失敗。回復は早めに。</li></ul></div></div>`;
}
function vResult() {
  const r = UI.res, q = r.q, items = o => Object.keys(o).map(k => `<span class="mat r${IT[k].rar || 0}">${matIcon(k)}${esc(IT[k].n)} <b>×${o[k]}</b></span>`).join('') || '<span class="dim">なし</span>';
  return `<div class="result ${r.ok ? 'ok' : 'ng'}"><h1>${r.ok ? 'クエスト達成' : 'クエスト失敗'}</h1><p>${esc(q.n)}</p></div><div class="list">${r.ok ? `<div class="card"><div class="row"><b>報酬金</b><span class="z lg">${zf(r.z)}</span></div><div class="sm dim">所要時間 ${fmtT(r.time)}　力尽きた回数 ${r.faints}</div></div><div class="card"><h3>クエスト報酬</h3><div class="mats">${items(r.items)}</div></div>` : '<div class="card"><p>報酬は得られなかった。装備と道具を整えて、もう一度挑もう。</p></div>'}<div class="card"><h3>持ち帰った素材</h3><div class="mats">${items(r.bag)}</div></div>${r.rankUp ? `<div class="card rank"><b>ハンターランクが ★${S.hr} に上がった!</b><div class="sub">新しいクエストが受けられる</div></div>` : ''}<button class="big gold" data-a="go" data-s="home">村へ戻る</button>${r.ok ? '' : `<button class="big" data-a="quest" data-q="${q.id}">もう一度挑む</button>`}</div>`;
}
const VIEWS = { title: vTitle, home: vHome, quests: vQuests, quest: vQuest, equip: vEquip, pick: vPick, smith: vSmith, shop: vShop, mix: vMix, meal: vMeal, box: vBox, opt: vOpt, help: vHelp, result: vResult };
function render() {
  const u = $('ui'), keep = UI.prev === UI.scr ? u.scrollTop : 0;
  u.innerHTML = '<div class="wrap">' + VIEWS[UI.scr]() + '</div>'; u.className = 'scr-' + UI.scr; u.scrollTop = keep; UI.prev = UI.scr;
}

/* ---------- ボタンの処理 ---------- */
function forge(k, id) {
  const it = k === 'w' ? WEP[id] : ARM[id], list = k === 'w' ? S.wep : S.arm;
  if (list.includes(id)) return;
  if ((it.from && !S.wep.includes(it.from)) || !canPay(it.mats, it.z)) { sfx('deny'); toast('素材かお金が足りない'); return; }
  pay(it.mats, it.z); list.push(id); save(); sfx('forge'); render();
  modal(`<h3>${esc(it.n)} が完成した!</h3><p class="sm">${k === 'w' ? '攻撃 ' + it.atk + (it.el ? '　' + EL[it.el].n + it.elv : '') : '防御 ' + it.def + '　' + SK[it.sk].n + '+1'}</p><button class="big gold" data-a="eqnow" data-k="${k}" data-id="${id}">いますぐ装備する</button><button class="big" data-a="mclose">あとで</button>`);
}
function act(a, d) {
  switch (a) {
    case 'go': sfx('ui'); if (d.b) UI.b = d.b; go(d.s); break;
    case 'begin': sfx('ui'); go('home'); modal('<h3>ようこそ、ハナモリ村へ</h3><p>あなたは村に来たばかりの新米ハンター。まずは<b>クエスト</b>の★1から始めよう。</p><p class="sm dim">フィールドでは、赤く示される攻撃の予兆をよく見て回避すること。</p><button class="big gold" data-a="mclose">わかった</button>'); break;
    case 'rank': sfx('ui'); UI.rank = +d.r; render(); break;
    case 'quest': sfx('ui'); UI.qid = d.q; go('quest'); break;
    case 'depart': depart(); break;
    case 'pick': sfx('ui'); UI.slot = d.slot; go('pick'); break;
    case 'equip': sfx('buy'); S.eq[UI.slot] = d.id; save(); go('equip'); break;
    case 'stab': sfx('ui'); UI.tab = d.t; render(); break;
    case 'wt': sfx('ui'); UI.wt = d.t; render(); break;
    case 'aset': sfx('ui'); UI.aset = UI.aset === d.id ? null : d.id; render(); break;
    case 'forge': forge(d.k, d.id); break;
    case 'eqnow': if (d.k === 'w') S.eq.w = d.id; else S.eq[ARM[d.id].slot] = d.id; save(); closeModal(); render(); toast('装備した'); sfx('buy'); break;
    case 'buy': { const it = IT[d.id], n = +d.n, cost = it.buy * n; if (S.z < cost) { sfx('deny'); toast('お金が足りない'); break; } S.z -= cost; addBox(d.id, n); save(); sfx('buy'); render(); break; }
    case 'mix': { const r = RECIPES[+d.i], n = Math.min(+d.n, mixMax(r)); if (n <= 0) { sfx('deny'); toast('素材が足りない'); break; } addBox(r.a, -n); addBox(r.b, -n); addBox(r.out, n); save(); sfx('buy'); toast(IT[r.out].n + 'を' + n + '個作った'); render(); break; }
    case 'meal': { const m = mealOf(d.id), cost = m.cost * S.hr; if (S.meal === m.id) break; if (S.z < cost) { sfx('deny'); toast('お金が足りない'); break; } S.z -= cost; S.meal = m.id; save(); sfx('heal'); toast('ごちそうさま! ' + m.d); render(); break; }
    case 'sell': { const n = Math.min(+d.n, have(d.id)); if (n <= 0) break; addBox(d.id, -n); S.z += IT[d.id].sell * n; save(); sfx('buy'); render(); break; }
    case 'sellall': modal(`<h3>${esc(IT[d.id].n)} を全部売る?</h3><p>${have(d.id)}個 → ${zf(IT[d.id].sell * have(d.id))}</p><button class="big gold" data-a="sellyes" data-id="${d.id}">売る</button><button class="big" data-a="mclose">やめる</button>`); break;
    case 'sellyes': { const n = have(d.id); addBox(d.id, -n); S.z += IT[d.id].sell * n; save(); sfx('buy'); closeModal(); render(); break; }
    case 'opt': S.opt[d.k] = S.opt[d.k] ? 0 : 1; save(); applyOpt(); sfx('ui'); if (G) pause(); else render(); break;
    case 'export': { let t = ''; try { t = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); } catch (e) { } modal(`<h3>セーブデータ</h3><p class="sm">下の文字列をすべてコピーして保管してください。</p><textarea id="svt" readonly>${t}</textarea><button class="big gold" data-a="copy">コピーする</button><button class="big" data-a="mclose">閉じる</button>`); break; }
    case 'copy': { const ta = $('svt'); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { } if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast('コピーした'), () => toast(ok ? 'コピーした' : '長押しでコピーしてください')); else toast(ok ? 'コピーした' : '長押しでコピーしてください'); break; }
    case 'import': modal('<h3>セーブデータを読み込む</h3><p class="sm">書き出した文字列を貼り付けてください。今のデータは上書きされます。</p><textarea id="svt"></textarea><button class="big gold" data-a="importgo">読み込む</button><button class="big" data-a="mclose">やめる</button>'); break;
    case 'importgo': { try { const o = JSON.parse(decodeURIComponent(escape(atob($('svt').value.trim())))); if (!o || o.v !== VER || !o.eq || !WEP[o.eq.w]) throw 0; const dft = newSave(); S = Object.assign(dft, o); S.opt = Object.assign(newSave().opt, o.opt || {}); save(); applyOpt(); closeModal(); go('home'); toast('読み込んだ'); } catch (e) { toast('読み込めなかった。文字列を確かめてください'); } break; }
    case 'reset': modal('<h3>データを初期化する?</h3><p>装備・素材・進み具合がすべて消えます。元には戻せません。</p><button class="big danger" data-a="resetyes">初期化する</button><button class="big" data-a="mclose">やめる</button>'); break;
    case 'resetyes': S = newSave(); save(); applyOpt(); closeModal(); go('title'); break;
    case 'mclose': sfx('ui'); closeModal(); break;
    case 'resume': closeModal(); if (G) G.paused = false; break;
    case 'retire': closeModal(); if (G) { G.paused = false; G.done = 'fail'; finishQuest(); } break;
  }
}
function applyOpt() { $('ctl').classList.toggle('lefty', !!S.opt.lefty); $('ctl').classList.toggle('v2d', !!S.opt.view2d); stickHome(); r3Resize(); }
function depart() {
  const q = QBY[UI.qid]; ac(); sfx('clear'); $('ui').classList.add('hide'); $('ctl').classList.remove('hide'); $('bRet').classList.add('hide'); $('bAct').classList.add('hide');
  startQuest(q); r3Build(); $('bSp').textContent = WT[G.st.wt].sp; lastAct = null; lastItemKey = ''; uiItem(); stickHome(); uiLock();
}
function uiLock() { if (G) $('bLock').classList.toggle('lk', !!G.c3.lock); }
function uiResult(res) { $('ctl').classList.add('hide'); closeModal(); r3Clear(); $('ui').classList.remove('hide'); UI.res = res; UI.prev = ''; go('result'); }
function uiQuestState() { if (G && G.done === 'clear' && G.q.k === 'hunt') $('bRet').classList.remove('hide'); }
function uiItem() {
  if (!G) return; const id = G.items[G.p.itemI], b = $('bItem');
  if (!id) { b.innerHTML = '<span class="nm">道具なし</span>'; return; }
  const it = IT[id], n = G.pouch[id] || 0; b.innerHTML = `<span class="ic">${it.ic}</span><span class="nm">${it.n}</span><span class="ct">${it.inf ? '∞' : '×' + n}</span>`; b.classList.toggle('zero', !n);
}
let lastAct = null, lastItemKey = '';
function uiTick() {
  const p = G.p, lab = p.near && p.state === 'idle' ? p.near.label : null;
  if (lab !== lastAct) { lastAct = lab; const b = $('bAct'); if (lab) { b.textContent = lab; b.classList.remove('hide'); } else b.classList.add('hide'); }
  const id = G.items[p.itemI], key = id + ':' + (G.pouch[id] || 0); if (key !== lastItemKey) { lastItemKey = key; uiItem(); }
}
function pause() {
  if (!G || G.done) return; G.paused = true;
  modal(`<h3>一時停止</h3><p class="sm">${esc(G.q.n)}</p><button class="big gold" data-a="resume">狩りに戻る</button><button class="big" data-a="opt" data-k="snd">効果音: ${S.opt.snd ? 'ON' : 'OFF'}</button><button class="big" data-a="opt" data-k="hpbar">体力ゲージ: ${S.opt.hpbar ? 'ON' : 'OFF'}</button><button class="big" data-a="opt" data-k="view2d">視点: ${S.opt.view2d ? '見下ろし(2D)' : '3D'}</button><button class="big danger" data-a="retire">リタイアして村へ戻る</button><p class="sm dim">リタイアしても、集めた素材は持ち帰れる。</p>`);
}

/* ---------- 入力 ---------- */
let stickId = null, sox = 0, soy = 0; const SR = 54, keys = {};
function stickHome() { const sk = $('stick'); if (!sk || stickId !== null) return; const lefty = S && S.opt.lefty; sk.style.left = (lefty ? window.innerWidth - 96 - view.sr : 96 + view.sl) + 'px'; sk.style.top = (window.innerHeight - 122 - view.sb) + 'px'; sk.firstElementChild.style.transform = 'translate(-50%,-50%)'; }
function bindInput() {
  const sz = $('stickZone'), sk = $('stick'), knob = sk.firstElementChild;
  sz.addEventListener('pointerdown', e => { e.preventDefault(); if (stickId !== null) return; stickId = e.pointerId; try { sz.setPointerCapture(stickId); } catch (_) { } sox = e.clientX; soy = e.clientY; sk.style.left = sox + 'px'; sk.style.top = soy + 'px'; sk.classList.add('on'); knob.style.transform = 'translate(-50%,-50%)'; input.rx = input.ry = 0; });
  sz.addEventListener('pointermove', e => {
    if (e.pointerId !== stickId) return; let dx = e.clientX - sox, dy = e.clientY - soy; const d = hyp(dx, dy);
    if (d > SR) { sox += dx / d * (d - SR); soy += dy / d * (d - SR); dx = e.clientX - sox; dy = e.clientY - soy; sk.style.left = sox + 'px'; sk.style.top = soy + 'px'; }
    input.rx = dx / SR; input.ry = dy / SR; knob.style.transform = 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px))';
  });
  const end = e => { if (e.pointerId !== stickId) return; stickId = null; input.rx = input.ry = 0; sk.classList.remove('on'); stickHome(); };
  sz.addEventListener('pointerup', end); sz.addEventListener('pointercancel', end);
  const hold = (id, key) => { const el = $(id); el.addEventListener('pointerdown', e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) { } el.classList.add('on'); input[key] = true; input[key + 'P'] = true; }); const up = () => { el.classList.remove('on'); input[key] = false; }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); };
  const tap = (id, fn) => { const el = $(id); el.addEventListener('pointerdown', e => { e.preventDefault(); el.classList.add('on'); fn(); }); const up = () => el.classList.remove('on'); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up); };
  hold('bAtk', 'at'); hold('bSp', 'sp');
  tap('bDg', () => input.dgP = true); tap('bItem', () => input.itP = true); tap('bAct', () => input.acP = true);
  tap('bPrev', () => { if (G) { cycleItem(-1); sfx('ui'); } }); tap('bNext', () => { if (G) { cycleItem(1); sfx('ui'); } });
  const lz = $('lookZone'); let lookId = null, lookX = 0;
  lz.addEventListener('pointerdown', e => { e.preventDefault(); if (lookId !== null) return; lookId = e.pointerId; lookX = e.clientX; try { lz.setPointerCapture(lookId); } catch (_) { } });
  lz.addEventListener('pointermove', e => { if (e.pointerId !== lookId || !G) return; const dx = e.clientX - lookX; lookX = e.clientX; G.c3.yaw = angN(G.c3.yaw + dx * .0075); G.c3.manT = 1.6; });
  const lend = e => { if (e.pointerId === lookId) lookId = null; }; lz.addEventListener('pointerup', lend); lz.addEventListener('pointercancel', lend);
  tap('bLock', () => { if (!G) return; G.c3.lock = !G.c3.lock; G.c3.manT = 0; uiLock(); msg(G.c3.lock ? 'ロックオン: 標的を自動で正面に捉える' : 'ロックオン解除: 画面の右側をなぞって視点を回す'); sfx('ui'); });
  tap('bPause', pause); tap('bRet', () => { if (G && G.done === 'clear') G.endT = 0; });
  document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; act(b.dataset.a, b.dataset); });
  for (const ev of ['contextmenu', 'gesturestart', 'dblclick']) document.addEventListener(ev, e => e.preventDefault());
  $('cv').addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  $('ctl').addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  addEventListener('keydown', e => {
    if (e.repeat || e.target.tagName === 'TEXTAREA') return; const k = e.key.toLowerCase(); keys[k] = true; if (!G) return;
    if (k === 'j' || k === 'z') { input.at = true; input.atP = true; } else if (k === 'k' || k === 'x') { input.sp = true; input.spP = true; }
    else if (k === ' ' || k === 'l') { input.dgP = true; e.preventDefault(); } else if (k === 'e') input.itP = true; else if (k === 'f') input.acP = true;
    else if (k === 'q') cycleItem(-1); else if (k === 'r') cycleItem(1); else if (k === 'escape') { if (G.paused) act('resume', {}); else pause(); }
  });
  addEventListener('keyup', e => { const k = e.key.toLowerCase(); keys[k] = false; if (k === 'j' || k === 'z') input.at = false; if (k === 'k' || k === 'x') input.sp = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.paused) pause(); });
}
let kbUsed = false;
function pollKeys() {
  const x = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), y = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (x || y) { const d = hyp(x, y); input.rx = x / d; input.ry = y / d; kbUsed = true; } else if (kbUsed) { input.rx = input.ry = 0; kbUsed = false; }
  const cl = (keys.c ? 1 : 0) - (keys.v ? 1 : 0); if (cl && G) { G.c3.yaw = angN(G.c3.yaw - cl * .04); G.c3.manT = 1.2; }
}

// スティックの向きを「カメラから見た向き」に直す (上に倒す = 画面の奥へ進む)
function applyStick() { const yaw = r3Active() ? G.c3.yaw : -Math.PI / 2, fx = Math.cos(yaw), fy = Math.sin(yaw); input.mx = -fy * input.rx - fx * input.ry; input.my = fx * input.rx - fy * input.ry; }

/* ---------- メインループ ---------- */
let lastT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.034, Math.max(0, (now - lastT) / 1000 || 0)); lastT = now;
  if (G && !G.paused) { pollKeys(); camUpdate(dt); applyStick(); update(dt); }
  input.atP = input.spP = input.dgP = input.itP = input.acP = false;
  if (G) uiTick();
  draw();
}
function boot() {
  cv = $('cv'); ctx = cv.getContext('2d'); loadSave(); refreshRank(); resize();
  addEventListener('resize', () => { resize(); r3Resize(); stickHome(); }); addEventListener('orientationchange', () => setTimeout(() => { resize(); r3Resize(); stickHome(); }, 250));
  bindInput(); applyOpt(); go('title'); requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>

    else if((m=/^(self|foe):(atk|def|spa|spd|spe|acc|eva)([+-]\d)(?:@(\d+))?$/.exec(tk)))out.push({k:'stage',who:m[1],stat:m[2],n:+m[3],ch:m[4]?+m[4]:100});
    else if((m=/^fixed(\d+)$/.exec(tk)))out.push({k:'fixed',n:+m[1]});
    else if((m=/^wx:(\w+)$/.exec(tk)))out.push({k:'wx',w:m[1]});
    else if((m=/^wall:(p|s)$/.exec(tk)))out.push({k:'wall',c:m[1]==='s'?1:0});

  }
  return out;
}

function buildLearn(r,t1,t2,ori){   // ori: 0=物理が得意 1=特殊が得意 → その分類の技を おぼえていく
  const L=[],seen=new Set();
  const add=(lv,id)=>{if(id==null||seen.has(id))return;seen.add(id);L.push([lv,id]);};
  const tr=(t,k)=>TYPE_MOVES[t][ori?'spec':'phys'][k];
  add(1,0);add(1,r.pick([5,6]));
  add(r.range(4,6),t1===0?(ori?tr(0,0):1):tr(t1,0));
  add(r.range(9,11),t2>0?tr(t2,0):(t1===0?r.pick([7,8]):1));
  add(r.range(13,16),r.pick(t1===0?[7,8]:TYPE_MOVES[t1].st));
  add(r.range(18,22),tr(t1,1));
  add(r.range(24,27),t2>=0?tr(t2,1):tr(0,1));
  add(r.range(29,32),r.pick([7,8,9]));
  add(r.range(33,37),tr(t1,2));
  add(r.range(40,43),t2>=0?tr(t2,2):tr(0,2));
  add(r.range(48,54),tr(t1,3));
  add(r.range(58,62),t2>=0?tr(t2,3):tr(0,3));
  L.sort((a,b)=>a[0]-b[0]);
  return L;
}
// 技が増えたぶん、系統ごとに ちがう技も覚える（べつの乱数を使い、名前や見た目の乱数は動かさない）
function extendLearn(L,q,t1,t2,ori){
  const seen=new Set(L.map(a=>a[1])),key=ori?'S':'P',tb=t2>=0?t2:0;
  const add=(lv,id)=>{if(id==null||id<0||seen.has(id))return;seen.add(id);L.push([lv,id]);};
  const lvFor=m=>m.pow<=1?q.range(22,34):m.pow<=50?q.range(6,14):m.pow<=70?q.range(15,27):m.pow<=90?q.range(28,41):m.pow<=110?q.range(42,53):q.range(54,68);
  const pk=(arr,n)=>{const a=arr.filter(id=>!seen.has(id));q.shuffle(a);return a.slice(0,n);};
  for(const id of pk(TYPE_MOVES[t1][key],3))add(lvFor(MOVES[id]),id);
  for(const id of pk(TYPE_MOVES[tb][key],t2>=0?2:1))add(lvFor(MOVES[id]),id);
  for(const id of pk(TYPE_MOVES[t1].st,2))add(q.range(8,46),id);
  for(const id of pk(TYPE_MOVES[tb].st,1))add(q.range(12,50),id);
  L.sort((a,b)=>a[0]-b[0]);return L;
}
function statsFor(r,t1,bst,w){
  let s=0;for(const x of w)s+=x;
  return w.map(x=>Math.max(12,Math.round(bst*x/s)));
}
function makeWeights(r,t1){
  const w=r.pick(ARCH).map(x=>x*(0.85+0.3*r()));
  if(PHYS[t1]&&w[3]>w[1]){const t=w[1];w[1]=w[3];w[3]=t;}
  if(!PHYS[t1]&&w[1]>w[3]){const t=w[1];w[1]=w[3];w[3]=t;}
  if(t1===6)w[1]*=1.15;if(t1===16||t1===12)w[2]*=1.2;if(t1===9||t1===3)w[5]*=1.15;if(t1===10)w[3]*=1.1;
  return w;
}

function tuneIV(m,kind){
  const iv=m.iv,sp=SP[m.sp];
  if(kind==='rare'){const idx=[0,1,2,3,4,5];for(let i=5;i>0;i--){const j=ri(i+1),t=idx[i];idx[i]=idx[j];idx[j]=t;}
    for(let k=0;k<6;k++)iv[k]=Math.max(iv[k],10);for(let k=0;k<3;k++)iv[idx[k]]=31;}
  else if(kind==='starter'){for(let k=0;k<6;k++)iv[k]=Math.max(iv[k],16);let b=1;for(let k=2;k<6;k++)if(sp.base[k]>sp.base[b])b=k;iv[b]=31;}
  else{const k=ri(6);iv[k]=Math.max(iv[k],24+ri(8));}
  m.hp=maxHP(m);return m;
}

function biomeAt(p){return p<7?'plain':p<13?'forest':p<19?'coast':p<25?'swamp':p<29?'desert':p<33?'volcano':p<37?'ruin':p<43?'snow':'peak';}

function genMacro(seed,pNew){
  const r=RNG('macro'+seed),N=GW*GH,adj=[],vis=new Uint8Array(N);
  for(let i=0;i<N;i++)adj.push([]);
  const act=[r.int(N)];vis[act[0]]=1;
  while(act.length){
    const ai=r()<pNew?act.length-1:r.int(act.length),c=act[ai],cx=c%GW,cy=(c/GW)|0,opts=[];
    for(let d=0;d<4;d++){const nx=cx+DX[d],ny=cy+DY[d];if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const n=ny*GW+nx;if(!vis[n])opts.push(n);}
    if(!opts.length){act.splice(ai,1);continue;}
    const n=r.pick(opts);vis[n]=1;adj[c].push(n);adj[n].push(c);act.push(n);
  }
  const bfs=s=>{const dist=new Int16Array(N).fill(-1),par=new Int16Array(N).fill(-1);dist[s]=0;const q=[s];
    for(let i=0;i<q.length;i++){const c=q[i];for(const n of adj[c])if(dist[n]<0){dist[n]=dist[c]+1;par[n]=c;q.push(n);}}
    let far=s;for(let i=0;i<N;i++)if(dist[i]>dist[far])far=i;return{par,far};};
  const a=bfs(0).far,b=bfs(a),path=[];
  for(let c=b.far;c>=0;c=b.par[c])path.push(c);
  return{adj,path};
}

(function buildWorld(){

  const adj=mz.adj,path=mz.path,N=GW*GH;
  const main=path.slice(path.length-MAINLEN);
  const mainIdx=new Int16Array(N).fill(-1);main.forEach((n,i)=>{mainIdx[n]=i;});
  const attach=new Int16Array(N).fill(-1),depth=new Int16Array(N),par=new Int16Array(N).fill(-1),need=new Float32Array(N),rootGate=new Array(N).fill('none');
  const q=[];for(const n of main){attach[n]=mainIdx[n];q.push(n);}
  for(let i=0;i<q.length;i++){
    const c=q[i];

        const a=attach[n],r=RNG('br'+n);

        const g=pre?'sea':a<6?r.pick(['shrub','shrub','crack','none']):a<12?r.pick(['crack','crack','sea','none','shrub']):a<27?r.pick(['sea','boulder','crack','none']):r.pick(['boulder','sea','none','none']);

      else if(i===49){c.kind='dung';c.style='shrine';c.nF=3;c.name='原初の神殿';c.pal=c.biome='cave';}
      else if(i===50){c.kind='town';c.size='town';c.name='サミット村';}

      else if(i===52){c.kind='town';c.size='league';c.special=['league'];c.name='栄冠の城';}
      else{
        const k=Math.floor(i/3),rs=RNG('seg'+k),townFirst=k===0?true:rs.chance(0.5);
        if((i%3===1)===townFirst){c.kind='town';c.size=rs.chance(0.5)?'town':'village';}
        else{c.kind='wild';if(k>0&&rs.chance(0.35))c.pal=c.biome='cave';}
      }

    }else{
      const leaf=adj[n].length===1;
      if(leaf||(depth[n]%2===0&&r.chance(0.4))){c.kind='dung';c.style='lair';c.nF=prog>20?3:2;c.pal=c.biome='cave';}
      else if(depth[n]%2===0){c.kind='town';c.size='village';}

    }

  }

  const nodesByProg=nodeCell.slice().sort((a,b)=>a.prog-b.prog);
  for(const c of nodesByProg){
    const r=RNG('nm'+c.key);
    if(c.name)continue;
    if(c.kind==='town'){c.name=TOWN_POOL[poolI++%TOWN_POOL.length]+(c.size==='village'?(r.chance(0.5)?'村':'の村'):'の町');}
    else if(c.kind==='dung')c.name=wildName(r)+'の遺跡';
    else c.name=wildName(r)+BIOME_SUF[c.pal];
  }
  // 道（連結セル）
  let side=1;
  for(let n=0;n<N;n++)for(const m of adj[n]){
    if(m<n)continue;
    const a=nodeCell[n],b=nodeCell[m],vert=a.fx===b.fx;
    const ia=mainIdx[n],ib=mainIdx[m],isMain=ia>=0&&ib>=0&&Math.abs(ia-ib)===1;
    const child=depth[n]>depth[m]?n:m;
    const c=mk((a.fx+b.fx)/2,(a.fy+b.fy)/2,{vert,ex:vert?[1,0,1,0]:[0,1,0,1]});
    if(isMain){
      const e=Math.min(ia,ib);c.main=e+0.5;c.prog=e+0.5;c.pal=c.biome=biomeAt(e+0.5);c.name='第'+(e+1)+'街道';

      if(ri_>=0)c.gate={type:'story',sid:'rival'+(ri_+2)};

      if(depth[child]===1){const g=rootGate[child];if(g==='sea')c.kind='sea';else if(g!=='none')c.gate={type:g,k:0};}
    }
  }
  for(const k in CELLS){const c=CELLS[k];c.lv=Math.round(levelAt(c.prog));}
  WORLD.main=main.map(n=>nodeCell[n]);
  WORLD.towns=nodesByProg.filter(c=>c.kind==='town');
  WORLD.lairs=nodesByProg.filter(c=>c.kind==='dung'&&c.style==='lair');
  WORLD.areas=Object.values(CELLS).filter(c=>c.kind!=='town').sort((a,b)=>a.prog-b.prog);
  // 伝説の配置
  const leg=[12,11,9,6,2,3,4,7,8,1,10,13,5,16,15,14,0].map(t=>SP.findIndex(s=>s&&s.name===GUARDIAN[t]));
  ['アウローラ','ヴェスペラ','ルナリス','コメテス','ソムニア'].forEach(nm=>leg.push(SP.findIndex(s=>s&&s.name===nm)));
  const L=WORLD.lairs;
  if(L.length){leg.forEach((id,i)=>{const lair=L[Math.min(L.length-1,Math.floor(i*L.length/leg.length))];if(lair.legends.length<3)lair.legends.push(id);else L[i%L.length].legends.push(id);});
    L[L.length-1].legends.push(SP_HAJIMARI);}
  WORLD.main[49].legends=[SP_OWARI];
  // 出現テーブル
  const fams=FAMS.filter(f=>!f.legend&&!f.starter);
  const landAreas=WORLD.areas.filter(a=>a.kind!=='sea');
  for(const f of fams){
    const target=f.tier*50,water=f.hab==='water',pool=water?WORLD.areas:landAreas;
    for(let rep=0;rep<2;rep++){
      let best=null,bs=1e9;
      for(const a of pool){
        const list=water?a.water:a.land;if(list.indexOf(f.id)>=0)continue;
        let s=Math.abs(a.prog-target)+list.length*2.5;
        if(!water){const aff=BIOME_AFF[a.biome];s+=aff.indexOf(f.t1)>=0?-6:(f.t2>=0&&aff.indexOf(f.t2)>=0)?-3:4;}
        if(s<bs){bs=s;best=a;}

    }
  }

      const cand=src.filter(f=>list.indexOf(f.id)<0).map(f=>[Math.abs(f.tier-target)+(useAff&&aff.indexOf(f.t1)<0?0.15:0),f]).sort((x,y)=>x[0]-y[0]);

  const late=landAreas.filter(a=>a.prog>=38&&a.prog<=48&&!a.branch);
  for(let i=0;i<5;i++)if(late.length)late[(i*3)%late.length].rare=FAMS[i].id;
})();

const ENC_W=[30,25,20,12,8,5,3,2,2,2];
function wildPick(cell,kind,bonus){
  const list=kind==='water'?cell.water:cell.land;if(!list||!list.length)return null;
  let fam;
  if(kind!=='water'&&cell.rare!=null&&ri(50)===0)fam=FAMS[cell.rare];
  else{const ws=list.map((_,i)=>ENC_W[i]||2);let s=0;for(const w of ws)s+=w;let x=Math.random()*s,i=0;for(;i<ws.length-1;i++){x-=ws[i];if(x<0)break;}fam=FAMS[list[i]];}
  const lv=clamp(cell.lv+(bonus||0)+rr(-1,1),2,90);
  return{sp:formAt(fam,lv,Math.random),lv};
}

function famCand(prog,types){
  const ok=f=>!f.legend&&!f.starter;
  let c=FAMS.filter(f=>ok(f)&&f.tier*50<=prog+8&&(!types||types.indexOf(f.t1)>=0||(f.t2>=0&&f.t2From===0&&types.indexOf(f.t2)>=0)));
  if(c.length<3&&types)c=FAMS.filter(f=>ok(f)&&(types.indexOf(f.t1)>=0||types.indexOf(f.t2)>=0));
  if(c.length<3)c=FAMS.filter(f=>ok(f)&&f.tier*50<=prog+8);
  return c;
}
function trainerTeam(r,prog,lv,n,types){
  const cand=famCand(prog,types),team=[],used=[];
  for(let i=0;i<n;i++){
    let f,tries=0;do{f=r.pick(cand);tries++;}while(used.indexOf(f.id)>=0&&tries<8);used.push(f.id);
    const l=Math.max(2,lv-(n-1-i));team.push({sp:formAt(f,l),lv:l});
  }
  return team;
}
function genTrainer(r,cell,tid,o){

function gymTeam(k){

function itemFor(r,prog,rich){

        late=['fuda3','fuda3','heal3','heal3','heal4','revive','c_all','candy','ppup'];

function gymHint(k){
  const t=GYM_TYPES[k],weak=[];for(let a=0;a<NT;a++)if(typeEff(a,[t])>1)weak.push(TK[a]);
  return GYM_TOWN[k]+'のギルドは 「'+TK[t]+'」タイプの使い手。「'+weak.join('」「')+'」タイプの技が よく効くよ。';
}
function newMap(id,cell,w,h,fill){
  return{id,cell,W:w,H:h,t:new Uint8Array(w*h).fill(fill),objs:[],signs:{},warps:{},blds:[],exits:[0,0,0,0],name:cell?cell.name:'',
    pal:cell?cell.pal:'plain',indoor:false,border:fill,enc:null,blobs:[]};
}
function carver(m,FL,PT,WALL){
  return(x,y)=>{for(let dy=-1;dy<=2;dy++)for(let dx=-1;dx<=2;dx++){
    const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=m.W||yy>=m.H)continue;
    const i=yy*m.W+xx;if(dx>=0&&dx<=1&&dy>=0&&dy<=1)m.t[i]=PT;else if(m.t[i]===WALL)m.t[i]=FL;}};
}
function carveLine(br,x0,y0,x1,y1){let x=x0,y=y0;br(x,y);while(x!==x1||y!==y1){if(x!==x1)x+=Math.sign(x1-x);else y+=Math.sign(y1-y);br(x,y);}}
function blobFill(m,cx,cy,rx,ry,fn){
  for(let y=cy-ry;y<=cy+ry;y++)for(let x=cx-rx;x<=cx+rx;x++){
    if(x<2||y<2||x>m.W-3||y>m.H-3)continue;
    const dx=(x-cx)/(rx+0.5),dy=(y-cy)/(ry+0.5);if(dx*dx+dy*dy<=1)fn(x,y);}
}
function transposeMap(m){
  const t2=new Uint8Array(m.t.length);
  for(let y=0;y<m.H;y++)for(let x=0;x<m.W;x++)t2[x*m.W+y]=m.t[y*m.W+x];
  m.t=t2;const TD=[3,2,1,0];
  for(const o of m.objs){const x=o.x;o.x=o.y;o.y=x;if(o.dir!=null)o.dir=TD[o.dir];}
  const s2={};for(const k in m.signs){const p=k.split(',');s2[p[1]+','+p[0]]=m.signs[k];}m.signs=s2;
}
function neighborCell(cell,d){return cellAt(cell.fx+DX[d],cell.fy+DY[d]);}
function routeSign(cell){
  const dn=['北','東','南','西'];let s=cell.name;
  for(let d=0;d<4;d++)if(cell.ex[d]){const n=neighborCell(cell,d);if(n)s+='\n'+dn[d]+'：'+n.name;}
  return s;
}
function occupied(m,x,y){for(const o of m.objs)if(o.x===x&&o.y===y)return true;return false;}

/* ---------- 街道（連結セル） ---------- */
function genRoute(cell){
  const r=RNG('map'+cell.key),sea=cell.kind==='sea',cave=cell.pal==='cave';
  const WALL=sea?T.WATER:cave?T.ROCK:T.TREE,FL=cave?T.CFLOOR:T.GRASS,PT=cave?T.CFLOOR:T.PATH;
  const m=newMap(cell.key,cell,MW,MH,WALL),t=m.t;
  const set=(x,y,v)=>{if(x>=0&&y>=0&&x<MW&&y<MH)t[y*MW+x]=v;};
  const get=(x,y)=>t[y*MW+x];
  const px=new Int8Array(MH).fill(15);
  let tid=0,iid=0;
  if(sea){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(x<2||x>29)t[y*MW+x]=T.ROCK;
    for(let y=0;y<4;y++)for(let x=12;x<=19;x++){set(x,y,T.SAND);set(x,MH-1-y,T.SAND);}
    for(let i=0;i<10;i++){const cx=r.range(4,27),cy=r.range(6,25);if(cx>=11&&cx<=20)continue;blobFill(m,cx,cy,r.range(1,2),1,(x,y)=>{if(x<11||x>20)set(x,y,T.ROCK);});}
    for(let i=0;i<3;i++){
      const cx=r.chance(0.5)?r.range(5,8):r.range(23,26),cy=r.range(7,24);
      blobFill(m,cx,cy,2,2,(x,y)=>set(x,y,T.SAND));
      m.objs.push({k:'item',iid:iid++,x:cx,y:cy,item:itemFor(r,cell.prog,i===0)});
    }
    for(const y of [r.range(7,10),r.range(14,17),r.range(21,24)]){
      const left=r.chance(0.5),o=genTrainer(r,cell,tid++,{swim:true,los:5});
      o.x=left?12:19;o.y=y;o.dir=left?1:3;set(o.x,o.y,T.WATER);m.objs.push(o);
    }
  }else{
    const jogs=[r.range(5,7),r.range(11,13),r.range(20,22),r.range(26,28)],tg=[r.range(6,24),r.range(6,24),r.range(6,24),15];
    let x=15;
    for(let y=0;y<MH;y++){
      const j=jogs.indexOf(y);
      if(j>=0){
        const nx=tg[j],lo=Math.min(x,nx),hi=Math.max(x,nx);
        for(let xx=lo-1;xx<=hi+2;xx++){if(get(xx,y-1)===WALL)set(xx,y-1,FL);set(xx,y,FL);}
        for(let xx=lo;xx<=hi+1;xx++)set(xx,y,PT);
        x=nx;
      }else{for(let d=-1;d<=2;d++)set(x+d,y,FL);set(x,y,PT);set(x+1,y,PT);}
      px[y]=x;
    }
    // 広場と草むら
    for(let i=0,n=r.range(4,6);i<n;i++){
      const y=r.range(3,28);if(Math.abs(y-16)<4)continue;
      const sd=r.chance(0.5)?-1:1,cx=clamp(px[y]+sd*r.range(3,6)+(sd>0?1:0),4,27),rx=r.range(2,4),ry=r.range(2,3),tall=!cave&&r.chance(0.8);
      for(let xx=Math.min(cx,px[y]);xx<=Math.max(cx,px[y]);xx++)if(get(xx,y)===WALL)set(xx,y,FL);
      blobFill(m,cx,y,rx,ry,(xx,yy)=>{if(Math.abs(yy-16)<2)return;const v=get(xx,yy);if(v===WALL||v===FL)set(xx,yy,tall&&r.chance(0.8)?T.TALL:FL);});
      m.blobs.push([cx,y,rx,ry]);
    }
    if(!cave)for(const y0 of [r.range(2,3),r.range(8,9),r.range(23,24)]){
      for(let yy=y0;yy<y0+3;yy++){if(jogs.indexOf(yy)>=0||jogs.indexOf(yy+1)>=0||Math.abs(yy-16)<2)continue;for(let d=-1;d<=2;d++)set(px[yy]+d,yy,T.TALL);}
    }
    if(!cave)for(let i=0;i<14;i++){const xx=r.range(2,29),yy=r.range(2,29);if(get(xx,yy)===T.GRASS)set(xx,yy,T.FLOWER);}
    // 池
    if(m.blobs.length&&r.chance(0.45)){const b=r.pick(m.blobs);if(Math.abs(b[0]-px[b[1]])>=4){for(let yy=b[1]-1;yy<=b[1];yy++)for(let xx=b[0]-1;xx<=b[0];xx++)if(Math.abs(yy-16)>=2)set(xx,yy,T.WATER);}}
    // 関所
    const g=cell.gate,gx=px[16];
    if(g){
      for(let xx=0;xx<MW;xx++)if(!SOLID[get(xx,16)])set(xx,16,cave?T.ROCK:T.FENCE);
      set(gx,16,PT);
      if(g.type==='guard')m.objs.push({k:'npc',role:'guard',need:g.k,x:gx,y:16,dir:0,spr:20});
      else if(g.type==='story')m.objs.push({k:'npc',role:'story',sid:g.sid,x:gx,y:16,dir:0,spr:g.sid[0]==='r'?21:'k'+g.sid.slice(5)});
      else set(gx,16,g.type==='shrub'?T.SHRUB:g.type==='crack'?T.CRACK:T.BOULDER);
    }
    // トレーナー
    const rows=[];for(let y=4;y<=27;y++)if(px[y-1]===px[y]&&px[y+1]===px[y]&&Math.abs(y-16)>=2&&jogs.indexOf(y+1)<0)rows.push(y);
    r.shuffle(rows);const used=[];
    const nT=cell.prog<1?1:r.range(2,4);
    for(const y of rows){
      if(used.length>=nT)break;if(used.some(u=>Math.abs(u-y)<3))continue;used.push(y);
      const left=r.chance(0.5),o=genTrainer(r,cell,tid++,{});
      o.x=left?px[y]-1:px[y]+2;o.y=y;o.dir=left?1:3;set(o.x,o.y,FL);m.objs.push(o);
    }
    // 道具
    for(const b of m.blobs){
      if(iid>=(cell.branch?3:2))break;
      const xx=b[0]+(b[0]<px[b[1]]?-(b[2]-1):(b[2]-1)),yy=b[1];
      if(Math.abs(xx-px[yy])<3||xx<2||xx>29||get(xx,yy)===T.WATER||occupied(m,xx,yy))continue;
      set(xx,yy,FL);m.objs.push({k:'item',iid:iid++,x:xx,y:yy,item:itemFor(r,cell.prog,false)});
    }
    const sx=px[2]-2;set(sx,2,T.SIGN);m.signs[sx+',2']=routeSign(cell);
  }
  m.exits=[1,0,1,0];
  if(!cell.vert){transposeMap(m);m.exits=[0,1,0,1];}
  m.enc={rate:8};
  return m;
}

/* ---------- 原野・洞くつ・ダンジョンの階 ---------- */
function ladderPos(cell,f){const r=RNG('lad'+cell.key+':'+f);return{x:r.range(4,26),y:r.range(4,26)};}
function downPos(cell,f){
  const u=ladderPos(cell,f),r=RNG('ladd'+cell.key+':'+f);
  let x=clamp(30-u.x+r.range(-3,3),4,26),y=clamp(30-u.y+r.range(-3,3),4,26);
  if(Math.abs(x-u.x)+Math.abs(y-u.y)<9){x=(u.x+11)%23+4;y=(u.y+9)%23+4;}
  return{x,y};
}
const floorType=(cell,f)=>(cell.kind==='dung'&&f===cell.nF-1&&cell.style!=='road')?'hall':'cave';
const floorId=(cell,f)=>cell.key+(f?':f'+f:'');
function genWild(cell,o){
  o=o||{};const f=o.f||0,id=floorId(cell,f),r=RNG('map'+id),cave=cell.pal==='cave';
  const WALL=cave?T.ROCK:T.TREE,FL=cave?T.CFLOOR:T.GRASS,PT=cave?T.CFLOOR:T.PATH;
  const m=newMap(id,cell,MW,MH,WALL),t=m.t,br=carver(m,FL,PT,WALL);
  const exits=o.exits||cell.ex;m.exits=exits.slice();
  let tid=0,iid=0,any=false;const tspots=[];
  for(let d=0;d<4;d++){
    if(!exits[d])continue;any=true;
    const a=r.range(3,5),b=r.range(9,11),nu=r.range(7,23);
    const P=[[15,0],[15,a],[nu,a],[nu,b],[15,b],[15,14]].map(p=>AT[d](p[0],p[1]));
    for(let i=0;i<P.length-1;i++)carveLine(br,P[i][0],P[i][1],P[i+1][0],P[i+1][1]);
    const q=AT[d](nu,(a+b)>>1);tspots.push(d%2===0?{x:q[0]-1,y:q[1],dir:1}:{x:q[0],y:q[1]-1,dir:2});
  }
  if(any)for(let y=12;y<=19;y++)for(let x=12;x<=19;x++)if(t[y*MW+x]===WALL)t[y*MW+x]=FL;
  // はしごをつなぐ
  const lads=o.ladders||[],keys=[];
  if(lads.length>1)keys.push([lads[1].x,lads[1].y]);
  if(any)keys.push([15,15]);
  if(lads.length)keys.push([lads[0].x,lads[0].y]);
  if(!any&&lads.length===1)keys.push([r.range(6,24),r.range(6,24)]);
  for(let i=0;i<keys.length-1;i++){
    const A=keys[i],B=keys[i+1],Wp=[r.range(4,26),r.range(4,26)];
    for(const seg of [[A,Wp],[Wp,B]]){const p=seg[0],q=seg[1];
      if(r.chance(0.5)){carveLine(br,p[0],p[1],q[0],p[1]);carveLine(br,q[0],p[1],q[0],q[1]);}
      else{carveLine(br,p[0],p[1],p[0],q[1]);carveLine(br,p[0],q[1],q[0],q[1]);}
      tspots.push({x:Wp[0],y:Wp[1]-1,dir:2});
    }
  }
  // 広場・草むら・行き止まり
  const fl=[];for(let y=3;y<29;y++)for(let x=3;x<29;x++){const v=t[y*MW+x];if(v===FL||v===PT)fl.push([x,y]);}
  if(fl.length)for(let i=0,n=r.range(5,8);i<n;i++){
    const an=r.pick(fl),cx=clamp(an[0]+r.range(-5,5),4,27),cy=clamp(an[1]+r.range(-5,5),4,27),rx=r.range(2,4),ry=r.range(2,3),tall=!cave&&r.chance(0.85);
    let x=an[0],y=an[1];while(x!==cx||y!==cy){if(x!==cx)x+=Math.sign(cx-x);else y+=Math.sign(cy-y);if(t[y*MW+x]===WALL)t[y*MW+x]=FL;}
    blobFill(m,cx,cy,rx,ry,(xx,yy)=>{const j=yy*MW+xx;if(t[j]===WALL||t[j]===FL)t[j]=tall&&r.chance(0.8)?T.TALL:FL;});
    m.blobs.push([cx,cy,rx,ry]);
  }
  if(!cave){
    for(let i=0;i<5;i++){const an=r.pick(fl);for(let yy=an[1]-1;yy<=an[1]+1;yy++)for(let xx=an[0]-1;xx<=an[0]+2;xx++){
      if(xx<3||yy<3||xx>28||yy>28||(xx>=12&&xx<=19&&yy>=12&&yy<=19))continue;const j=yy*MW+xx;if(t[j]===FL||t[j]===PT)t[j]=T.TALL;}}
    for(let i=0;i<14;i++){const xx=r.range(2,29),yy=r.range(2,29);if(t[yy*MW+xx]===T.GRASS)t[yy*MW+xx]=T.FLOWER;}
    if(m.blobs.length&&r.chance(0.5)){const b=m.blobs[m.blobs.length-1];for(let yy=b[1]-1;yy<=b[1];yy++)for(let xx=b[0]-1;xx<=b[0];xx++){const j=yy*MW+xx;if(t[j]===FL||t[j]===T.TALL)t[j]=T.WATER;}}
  }
  for(const L of lads){t[L.y*MW+L.x]=T.LADDER;m.warps[L.x+','+L.y]=L.to;}
  // トレーナー
  r.shuffle(tspots);
  const nT=Math.min(tspots.length,o.nT!=null?o.nT:r.range(2,3));
  for(let i=0;i<nT;i++){
    const s=tspots[i];if(s.x<1||s.y<1||s.x>30||s.y>30||occupied(m,s.x,s.y))continue;
    const j=s.y*MW+s.x;if(t[j]===T.LADDER||SOLID[t[j]])continue;
    const grunt=o.grunt||(cell.main>=5&&cell.main<49&&cell.kind==='wild'&&i===0);
    const tr=genTrainer(r,cell,tid++,{grunt,elite:o.elite,bonus:(o.bonus||0)});
    tr.x=s.x;tr.y=s.y;tr.dir=s.dir;m.objs.push(tr);
  }
  // 道具
  for(const b of m.blobs){
    if(iid>=(o.nI!=null?o.nI:2))break;
    const j=b[1]*MW+b[0];if(SOLID[t[j]]||t[j]===T.LADDER||occupied(m,b[0],b[1]))continue;
    const rich=cell.kind==='dung'&&iid===0;
    m.objs.push({k:'item',iid:iid++,x:b[0],y:b[1],item:itemFor(r,cell.prog,rich)});
  }
  if(any&&!cave&&f===0){const j=11*MW+11;if(t[j]===WALL||t[j]===FL){t[j]=T.SIGN;m.signs['11,11']=routeSign(cell);}}
  m.enc={rate:cave?14:8,bonus:f};
  return m;
}
function genFloor(cell,f){
  const last=cell.nF-1;
  if(floorType(cell,f)==='hall')return genHall(cell,f);
  const ex=[0,0,0,0];
  for(let d=0;d<4;d++){if(!cell.ex[d])continue;if(cell.onward===d){if(f===last)ex[d]=1;}else if(f===0)ex[d]=1;}
  const lad=[];
  if(f<last){const u=ladderPos(cell,f),dst=floorType(cell,f+1)==='hall'?hallLadder(cell):downPos(cell,f+1);lad.push({x:u.x,y:u.y,to:{map:floorId(cell,f+1),x:dst.x,y:dst.y}});}
  if(f>0){const dn=downPos(cell,f),u=ladderPos(cell,f-1);lad.push({x:dn.x,y:dn.y,to:{map:floorId(cell,f-1),x:u.x,y:u.y}});}
  const road=cell.style==='road';
  return genWild(cell,{f,exits:ex,ladders:lad,elite:road,grunt:cell.style==='shrine',nT:road?3:2,nI:2,bonus:f});
}
const hallLadder=cell=>({x:15,y:cell.onward===2?4:27});
function genHall(cell,f){
  const id=floorId(cell,f),m=newMap(id,cell,MW,MH,T.ROCK),flip=cell.onward===2;
  m.pal='cave';
  const set=(x,y,v)=>{m.t[(flip?MH-1-y:y)*MW+x]=v;};
  const Y=y=>flip?MH-1-y:y;
  for(let y=4;y<=28;y++)for(let x=11;x<=20;x++)set(x,y,T.CFLOOR);
  for(let y=9;y<=26;y++){set(15,y,T.RUG);set(16,y,T.RUG);}
  for(let x=14;x<=17;x++)set(x,5,T.ALTAR);
  set(11,4,T.STATUE);set(20,4,T.STATUE);set(11,28,T.STATUE);set(20,28,T.STATUE);
  set(15,27,T.LADDER);const u=ladderPos(cell,f-1);m.warps['15,'+Y(27)]={map:floorId(cell,f-1),x:u.x,y:u.y};
  const spots=[[15,7],[12,7],[19,7]];
  const lv=clamp(Math.max(30,cell.lv+6),30,70);
  cell.legends.forEach((sp,i)=>{
    const s=spots[i%3];
    m.objs.push({k:'legend',sp,lv:sp===SP_OWARI?60:sp===SP_HAJIMARI?70:lv,x:s[0],y:Y(s[1]),needFlag:sp===SP_OWARI?'s:boss':sp===SP_HAJIMARI?'champ':null});
  });
  if(cell.style==='shrine'){
    for(let x=11;x<=20;x++)set(x,14,T.ROCK);set(15,14,T.RUG);
    m.objs.push({k:'npc',role:'story',sid:'boss',x:15,y:Y(14),dir:flip?0:2,spr:23});
    const d=cell.onward;
    if(d===0||d===2){for(let y=0;y<4;y++)for(let x=14;x<=17;x++)set(x,y,T.CFLOOR);}
    else{
      const X=x=>d===1?x:31-x;
      for(let y=7;y<=8;y++)for(let x=21;x<=25;x++)m.t[y*MW+X(x)]=T.CFLOOR;
      for(let y=7;y<=16;y++)for(let x=24;x<=25;x++)m.t[y*MW+X(x)]=T.CFLOOR;
      for(let y=15;y<=16;y++)for(let x=24;x<=31;x++)m.t[y*MW+X(x)]=T.CFLOOR;
    }
    m.exits[d]=1;
  }else{
    const r=RNG('hall'+id);
    m.objs.push({k:'item',iid:0,x:19,y:Y(24),item:itemFor(r,cell.prog,true)});
    m.objs.push({k:'item',iid:1,x:12,y:Y(24),item:r.pick(['fuda3','heal3','revive','candy'])});
  }
  return m;
}

/* ---------- 町 ---------- */
function townBuildings(cell){
  const r=RNG('bld'+cell.key),kinds=['heal'];
  if(cell.size==='league')kinds.push('shop','league');
  else{
    if(cell.size!=='village'||cell.main===0||r.chance(0.5))kinds.push('shop');
    if(cell.gym)kinds.push('gym');
    if(cell.special)for(const s of cell.special)kinds.push(s);
    const n=cell.size==='village'?r.range(2,3):cell.size==='town'?r.range(4,5):r.range(6,8);

      if(tw>maxW){for(const ch of tok){const c=cw(ch);if(w+c>maxW){out.push(line);line='';w=0;}line+=ch;w+=c;}continue;}
      if(line){line+=' ';w+=0.5;}

}
const MSG_H=56;

// 選択メニュー。戻り値: 選んだ番号 / キャンセルは -1
function menu(items,opt){

    const w={type:'menu',items,i:clamp(opt.idx,0,Math.max(0,items.length-1)),top:0,
      key(k){

function step(){
  G.t++;inputTick();fxTick();if((G.t&31)===0)syncBikeBtn();
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];if(t.step)t.step();if(--t.n<=0){timers.splice(i,1);t.res();}}
  const top=UI[UI.length-1];
  if(top){let k;while((k=pressQ.shift())){const w=UI[UI.length-1];if(w&&w.key)w.key(k);}const w2=UI[UI.length-1];if(w2&&w2.update)w2.update();}
  if(G.scene==='world')worldTick(!top&&!G.busy);
  else if(G.scene==='title'&&!top)pressQ.length=0;
  if(!UI.length&&(G.busy||G.scene==='battle'))pressQ.length=0;
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.globalAlpha=1;ctx.fillStyle='#181420';ctx.fillRect(0,0,LW,LH);
  if(G.scene==='world'){drawWorldPix();drawWorldUI();}
  else if(G.scene==='battle'){drawBattlePix();drawBattleUI();}
  else{drawTitlePix();drawTitleUI();}
  for(const w of UI)w.draw();
  if(G.fade>0){ctx.fillStyle='rgba(16,12,24,'+G.fade+')';ctx.fillRect(0,0,LW,LH);}
}
let lastTs=0,acc=0;
function loop(ts){
  if(!lastTs)lastTs=ts;acc+=Math.min(120,ts-lastTs);lastTs=ts;
  try{
    let n=0;while(acc>=16.6&&n<6){for(let i=0;i<G.turbo;i++)step();acc-=16.67;n++;}
    render();
  }catch(e){console.error(e);ctx.setTransform(K,0,0,K,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  requestAnimationFrame(loop);
}

    for(let k=1;k<n;k++){const m=k===n-1?W[n]:[(W[k][0]+W[k+1][0])/2,(W[k][1]+W[k+1][1])/2];fill.quadraticCurveTo(W[k][0],W[k][1],m[0],m[1]);line.quadraticCurveTo(W[k][0],W[k][1],m[0],m[1]);pts.push([m[0],m[1],s]);}

  else if(B.weather==='rain'){if(mv.type===2)dmg=Math.floor(dmg*1.5);else if(mv.type===1)dmg=Math.floor(dmg/2);}
  if(mv.type>=0){

  if(B.coins&&B.result!=='lose'){S.money+=B.coins;await sayW('ちらばった お金 '+B.coins+'ゴールドを ひろった！');}
  let caught=null;
  if(B.result==='caught')caught=bmon(B,1);
  await fadeTo(1,220);
  G.scene='world';BT=null;fxClear();
  if(caught)await addMon(caught,true);
  if(B.result!=='lose')await checkEvolutions();
  await fadeTo(0,220);
  return B.result;
}

const LIVE={quad:{br:0.022,sw:0.012,hop:1},biped:{br:0.02,sw:0.018,hop:1},bird:{br:0.018,sw:0.01,hop:2},serpent:{br:0.012,wave:1.7,ws:0.5},fish:{br:0.012,fl:2.2,vw:1.6},
  blob:{br:0.05},bug:{br:0.012,jit:0.5,fl:1.2},ghost:{br:0.014,fl:3,wave:1.9,ws:0.45,tail:1},golem:{br:0.014,slow:1},plant:{br:0.012,sw:0.036}};
function drawLive(g,m,x,y,sc,back,al,sx,lit){
  const sp=SP[m.sp],L=LIVE[FAMS[sp.fam].plan]||LIVE.quad,t=G.t+(m.sp*53)%200,w=32*sc,asleep=m.st==='slp',frozen=m.st==='frz',q=asleep?0.45:frozen?0:L.slow?0.6:1;
  const c=monCanvas(m.sp,m.shiny,back,asleep||(!frozen&&(t%(170+(m.sp*37)%80))<7));
  const br=Math.sin(t*0.07*q)*L.br*(frozen?0:1);
  let dy=0,dx=0,shx=0;
  if(L.fl)dy+=Math.sin(t*0.045*q)*L.fl*(frozen?0:1);
  if(L.sw&&q)shx=Math.sin(t*0.05*q)*L.sw;
  if(L.hop&&q===1){const p=t%(L.hop===2?150:230);if(p<14)dy-=Math.sin(p/14*Math.PI)*1.1*sc;else if(L.hop===2&&p>18&&p<30)dy-=Math.sin((p-18)/12*Math.PI)*0.8*sc;}
  if(L.jit&&q===1)dx+=Math.sin(t*0.9)*L.jit*0.3;
  if(m.st==='par'&&(t%90)<10)dx+=Math.sin(t*2.4)*0.8;
  g.save();g.translate(x+w/2+dx,y+w+dy);g.transform((1+(sx||0))*(1-br*0.6),0,shx,(1-(sx||0))*(1+br),0,0);
  const blt=()=>{
    if(L.wave&&q){const N=14,sh=MS/N,dh=w/N;for(let i=0;i<N;i++){const k=L.tail?Math.max(0,(i-5)/(N-6)):1;g.drawImage(c,0,i*sh,MS,sh,-w/2+Math.sin(t*0.09*q-i*L.ws)*L.wave*k*sc*0.5,-w+i*dh,w,dh+0.3);}}
    else if(L.vw&&q){const N=14,sw=MS/N,dw=w/N;for(let i=0;i<N;i++){const k=back?(N-1-i)/(N-1):i/(N-1);g.drawImage(c,i*sw,0,sw,MS,-w/2+i*dw,-w+Math.sin(t*0.12*q-k*3)*L.vw*k*sc*0.5,dw+0.3,w);}}
    else g.drawImage(c,-w/2,-w,w,w);
  };
  g.globalAlpha=al;blt();
  if(lit>0.05){g.globalCompositeOperation='lighter';g.globalAlpha=Math.min(1,lit)*al;blt();}
  g.restore();
}

  }
  const pi=await partyPick({title:it.n+'を だれに 使う？',note:it.k==='tm'?(m=>canLearnTM(m,it.v)?(m.mv.some(v=>v.id===it.v)?'おぼえている':'おぼえられる'):'おぼえられない'):null});
  if(pi<0)return null;
  const m=S.party[pi],n=monName(m);let text=null;
  if(it.k==='heal'){if(m.hp>0&&m.hp<maxHP(m)){const b=m.hp;m.hp=Math.min(maxHP(m),m.hp+it.v);text=n+'の HPが '+(m.hp-b)+' 回復した！';}}
  else if(it.k==='cure'){if(m.hp>0&&m.st&&(it.v==='all'||m.st===it.v)){m.st=null;m.sc=0;text=n+'の 状態異常が 治った！';}}
  else if(it.k==='revive'){if(m.hp<=0){m.hp=Math.floor(maxHP(m)/2);m.st=null;text=n+'は 元気を とりもどした！';}}
  else if(it.k==='pp'){if(m.mv.some(v=>v.pp<MOVES[v.id].pp)){for(const v of m.mv)v.pp=MOVES[v.id].pp;text=n+'の 技の PPが 回復した！';}}
  else if(it.k==='candy'){
    if(m.lv<100){consume();m.exp=Math.max(m.exp,expFor(SP[m.sp],m.lv+1));const oh=maxHP(m);m.lv++;if(m.hp>0)m.hp+=maxHP(m)-oh;sfx('lvup');
      await msg(n+'は レベル'+m.lv+'に 上がった！');await learnMoves(m,m.lv);await checkEvolutions();return true;}
  }else if(it.k==='tm'){
    if(!canLearnTM(m,it.v)){await msg(n+'は この技を おぼえられない。');return null;}
    if(m.mv.some(v=>v.id===it.v)){await msg(n+'は すでに '+MOVES[it.v].name+'を おぼえている。');return null;}
    await teachMove(m,it.v);
    return true;
  }
  if(!text){await msg('使っても 効果が ないよ。');return null;}
  consume();sfx('heal');await msg(text);
  return B?{t:'item'}:true;
}

    const el=document.getElementById('io'),ta=document.getElementById('ioText'),info=document.getElementById('ioInfo');
    el.style.display='flex';
    if(mode==='export'){ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));info.textContent='この文字を すべてコピーして メモなどに 保存してください。';}
    else{ta.value='';info.textContent='保存しておいた文字を はりつけて「読みこむ」を おしてください。';}
    document.getElementById('ioLoad').style.display=mode==='export'?'none':'';
    document.getElementById('ioCopy').style.display=mode==='export'?'':'none';
    const close=v=>{el.style.display='none';res(v);};
    document.getElementById('ioClose').onclick=()=>close(null);
    document.getElementById('ioCopy').onclick=()=>{ta.select();try{navigator.clipboard.writeText(ta.value);}catch(e){try{document.execCommand('copy');}catch(_){}}info.textContent='コピーしました。';};
    document.getElementById('ioLoad').onclick=()=>{try{const d=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));if(!d||!d.party||!d.map)throw 0;close(d);}catch(e){info.textContent='読みこめませんでした。文字が 欠けていないか たしかめてください。';}};
  });
}
async function optionsMenu(){
  let idx=0;
  for(;;){
    const o=S.opts,on=v=>v!==0;
    const c=await menu([{label:'おと',right:o.snd?'あり':'なし'},{label:'文字の速さ',right:o.fast?'はやい':'ふつう'},{label:'連れ歩き',right:on(o.follow)?'あり':'なし'},
      {label:'けいけんち',right:on(o.share)?'みんなに分ける':'戦った子だけ'},{label:'昼と夜',right:on(o.dn)?'時計にあわせる':'いつも昼'},{label:'オートセーブ',right:on(o.auto)?'あり':'なし'},
      {label:'セーブを 書き出す'},{label:'セーブを 読みこむ'},{label:'もどる'}],{x:20,y:20,w:200,title:'せってい',idx});
    idx=Math.max(0,c);
    if(c===0){o.snd=o.snd?0:1;SND=!!o.snd;}
    else if(c===1)o.fast=o.fast?0:1;
    else if(c===2){o.follow=on(o.follow)?0:1;folReset();}
    else if(c===3)o.share=on(o.share)?0:1;
    else if(c===4)o.dn=on(o.dn)?0:1;
    else if(c===5)o.auto=on(o.auto)?0:1;
    else if(c===6){saveGame();await ioPanel('export');}
    else if(c===7){const d=await ioPanel('import');if(d){S=d;localStorage.setItem(SAVE_KEY,JSON.stringify(S));await msg('セーブを 読みこんだ！');startFromSave();return'close';}}
    else return;
  }
}

  let h=G.hour;if(h==null){const d=new Date();h=d.getHours()+d.getMinutes()/60;}

/* ---------- マップの読みこみ ---------- */
function activeObjs(m){
  const out=[];
  for(const o of m.objs){
    if(o.k==='item'&&S.flags['i:'+m.id+':'+o.iid])continue;
    if(o.k==='legend'&&(S.flags['L:'+o.sp]||(o.needFlag&&!S.flags[o.needFlag])||(o.sp===SP_OWARI&&S.flags['s:owari']&&!S.flags.champ)))continue;
    if(o.k==='starter'&&S.starter)continue;
    const a=Object.assign({ox:0,oy:0,alert:0},o);
    if(o.k==='npc'){
      if(o.role==='guard'&&S.badges[o.need])continue;
      if(o.role==='story'&&S.flags['s:'+o.sid])continue;
      if(o.role==='rival0'&&S.flags['s:rival1'])continue;
      if(o.role==='trainer')a.beaten=!!S.flags['t:'+m.id+':'+o.tid];
      if(o.role==='elite'&&S.flags['s:lg'+o.n]){a.x=3;a.y=2;a.dir=1;}
    }
    out.push(a);
  }
  return out;
}
function loadMap(id,x,y,dir){
  let m;try{m=getMap(id);}catch(e){console.error(e);m=null;}
  if(!m){const h=homeSpot();m=getMap(h.map);x=h.x;y=h.y;}
  if(m.cell)for(const L of [m.cell.land,m.cell.water])if(L)for(const fid of L)if(FAMS[fid])FAMS[fid].ids.forEach(monPreload);      // この場所に出る子の 原画を 先に読む
  if(S&&S.party)for(const q of S.party)monPreload(q.sp);
  G.map=m;const p=G.pl;p.x=x;p.y=y;if(dir!=null)p.dir=dir;p.moving=false;p.prog=0;p.turn=0;p.idle=9;
  if(m.t[y*m.W+x]!==T.WATER)p.surf=false;
  G.objs=activeObjs(m);folReset();charCacheTrim();

/* ---------- 移動 ---------- */
function passable(x,y){
  const m=G.map;if(x<0||y<0||x>=m.W||y>=m.H)return false;
  const v=m.t[y*m.W+x];
  if(v===T.WATER)return G.pl.surf;
  if(SOLID[v])return false;
  return!objAt(x,y);
}
let bumpT=0;
function tryMove(d){
  const p=G.pl,m=G.map,nx=p.x+DX[d],ny=p.y+DY[d];
  if(nx<0||ny<0||nx>=m.W||ny>=m.H){
    const lat=d%2===0?p.x:p.y;
    if(!m.indoor&&m.exits[d]&&(lat===15||lat===16))run(()=>edgeMove(d));
    else if(G.t-bumpT>20){bumpT=G.t;sfx('bump');}
    return;
  }
  if(!passable(nx,ny)){if(G.t-bumpT>20){bumpT=G.t;sfx('bump');}return;}

function worldTick(canInput){
  const p=G.pl;
  if(G.banner&&G.banner.t>0)G.banner.t--;
  if(G.t%60===0&&S)S.time++;
  if(p.moving){p.idle=0;p.prog+=p.spd;if(p.prog>=15.99){p.prog=0;p.moving=false;p.x+=DX[p.dir];p.y+=DY[p.dir];p.stepN=(p.stepN||0)+1;onStep();}if(p.moving||!canInput||G.busy)return;}
  else p.idle++;
  if(!canInput)return;
  let k,tap=-1;while((k=pressQ.shift())){if(k==='a'){interact();return;}if(k==='m'){run(openMenu);return;}if(k==='c'){if(S.bag.k_bike)run(toggleBike);return;}const ti=['up','right','down','left'].indexOf(k);if(ti>=0)tap=ti;}
  let d=held.up?0:held.right?1:held.down?2:held.left?3:-1;
  if(d<0&&tap>=0){if(p.dir!==tap){p.dir=tap;return;}d=tap;}
  if(d<0){p.turn=0;return;}
  if(p.dir!==d){p.dir=d;if(p.idle>2){p.turn=5;return;}}
  if(p.turn>0){p.turn--;return;}
  tryMove(d);
}
function clearLine(x,y){const m=G.map;if(x<0||y<0||x>=m.W||y>=m.H)return false;const v=m.t[y*m.W+x];return(v===T.WATER||!SOLID[v])&&!objAt(x,y);}
function seenBy(){
  const p=G.pl;
  for(const o of G.objs){
    if(o.k!=='npc')continue;
    if(o.role==='story'){if(Math.abs(o.x-p.x)+Math.abs(o.y-p.y)===1)return o;continue;}
    if((o.role!=='trainer'&&o.role!=='elite')||o.beaten)continue;
    if(o.role==='elite'&&S.flags['s:lg'+o.n])continue;
    const los=o.role==='trainer'?o.los:6;
    for(let i=1;i<=los;i++){const x=o.x+DX[o.dir]*i,y=o.y+DY[o.dir]*i;if(x===p.x&&y===p.y)return o;if(!clearLine(x,y))break;}
  }
  return null;
}
function onStep(){
  const p=G.pl,m=G.map,v=m.t[p.y*m.W+p.x];
  S.steps++;folArrive();if(p.surf&&v!==T.WATER){p.surf=false;folReset();}
  scnStep(m,p.x,p.y,p.dir,p.spd>2);
  const w=m.warps[p.x+','+p.y];
  if(w&&(v===T.DOOR||v===T.MAT||v===T.LADDER)){run(()=>doWarp(w));return;}
  const tr=seenBy();if(tr){run(()=>trainerEncounter(tr));return;}
  if(S.repel>0){S.repel--;if(S.repel===0)run(()=>msg('まよけのポプリの 効き目が きれた。'));return;}
  if(m.enc&&m.cell&&S.party.length){
    let kind=null,rate=m.enc.rate;
    if(v===T.TALL||(v===T.CFLOOR&&m.pal==='cave'))kind='land';else if(v===T.WATER&&p.surf){kind='water';rate=10;}
    if(kind&&ri(rate)===0){const wp=wildPick(m.cell,kind,m.enc.bonus||0)||(kind==='water'?waterFallback(m.cell):null);if(wp)run(()=>doWild(wp));}
  }
}
function waterFallback(cell){let best=null,bd=1e9;for(const a of WORLD.areas){if(!a.water.length)continue;const d=Math.abs(a.prog-cell.prog);if(d<bd){bd=d;best=a;}}return best?wildPick(best,'water',0):null;}

function interact(){
  const p=G.pl,m=G.map,fx=p.x+DX[p.dir],fy=p.y+DY[p.dir];
  const inb=fx>=0&&fy>=0&&fx<m.W&&fy<m.H,v=inb?m.t[fy*m.W+fx]:-1;
  let o=objAt(fx,fy);
  if(!o&&(v===T.COUNTER||v===T.TABLE))o=objAt(fx+DX[p.dir],fy+DY[p.dir]);
  if(o){run(()=>talk(o));return;}
  if(folVisible()&&FOL.x===fx&&FOL.y===fy){run(folTalk);return;}
  if(v===T.SIGN){const s=m.signs[fx+','+fy];if(s)run(()=>msg(s));return;}
  if(v===T.SHRUB||v===T.CRACK||v===T.BOULDER){run(()=>useTool(v,fx,fy));return;}
  if(v===T.WATER&&!p.surf){run(waterAct);return;}
  if(v===T.PC){run(pcMenu);return;}
  if(v===T.SHELF){run(()=>msg('むずかしそうな 本が ぎっしり ならんでいる。'));return;}
  if(v===T.HEALM){run(()=>msg('ふかふかの 寝床と あたたかい 暖炉。アニマたちが 休む 場所だ。'));return;}
  if(v===T.STATUE){run(()=>msg(m.indoor?'りっぱな アニマの 像だ。':'古い 石像だ。なにかを まもっているようだ。'));return;}
  if(v===T.ALTAR){run(()=>msg(m.id==='lg6'?'歴代の 王者の 名が きざまれている。':'古い 祭壇だ。ふしぎな 気配を 感じる…。'));return;}
}

  await msg(S.name+'は 「'+GYM_TOWN[k]+'の紋章」を 手に入れた！（'+badgeCount()+'／16）');
  const tool=GYM_TOOL[k];
  if(tool){bagAdd(tool);await msg(L+'「'+(tool==='k_bike'?'長い 旅には 足が いる。これを 使いなさい。':'これも 持っていくと いい。')+'」\n'+S.name+'は 「'+ITEMS[tool].n+'」を 手に入れた！');await msg(ITEMS[tool].d);if(tool==='k_bike'){S.bikeOn=0;syncBikeBtn();}}
  const tm='tm'+TYPE_MOVES[t].dmg[k<=8?1:2];bagAdd(tm);await msg(S.name+'は '+ITEMS[tm].n+'を もらった！');
  if(k===16)await msg(L+'「16の紋章が そろったな。原初の神殿を ぬけ、栄冠への道へ 進むがよい。」');
  saveGame();
}
async function eliteBattle(o){
  const n=o.n;
  if(S.flags['s:lg'+n]){await msg(n===5?'レグルス「さあ、奥の 栄光の間へ。」':'「先へ 進むがよい。」');return;}
  let r;
  if(n<=4){
    const e=ELITE[n-1];await msg('四騎士 '+e[0]+'\n「'+ELITE_LINE[n-1]+'」');
    r=await battle({trainer:{name:'四騎士 '+e[0],team:mkTeam(eliteTeam(n-1),31),money:6000,spr:'e'+n}});
  }else{
    await msg('王者 レグルス\n「16の紋章を 集め、四騎士を こえて ここまで 来たか。」');
    await msg('レグルス「わたしは ずっと 待っていた。アニマとの 絆を、ここまで 強く 育てた者を。さあ、きみの 旅の すべてを 見せてくれ！」');
    r=await battle({trainer:{name:'王者 レグルス',team:mkTeam(champTeam(),31),money:12000,spr:29}});
  }
  if(r==='lose'){await blackout();return;}
  S.flags['s:lg'+n]=1;o.x=3;o.y=2;o.dir=1;
  await msg(n===5?'レグルス「…みごとだ。きょうから きみが ルミエール大陸の 王者だ。奥の間へ 進みなさい。」':'「みごと。つぎの 間へ 進むがよい。」');
}
async function legendTalk(o){
  const sp=SP[o.sp],ow=o.sp===SP_OWARI;
  sfx('alert');
  await msg(ow?'ノクス「…………！！」\n大気が ふるえている！':sp.name+'が しずかに こちらを 見ている…。');
  if(!ow&&!(await confirmYN('勝負を いどみますか？')))return;
  const r=await battle({wild:makeMon(o.sp,o.lv,{iv:rr(20,31)}),legend:true,smart:true});
  if(r==='lose'){await blackout();return;}
  if(r==='run')return;
  removeObj(o);
  if(r==='caught')S.flags['L:'+o.sp]=1;
  if(ow){
    S.flags['s:owari']=1;
    await msg(r==='caught'?'ノクスは しずかに '+S.name+'を 見つめている。\n夜の 闇は、灯を 休ませる ためにも あるのだ。':'ノクスは しずかに ねむりに ついた。神殿に おだやかな 風が ふいた。');
    await msg('灰の結社の たくらみは ついえた。さあ、栄冠への道へ！');
  }else if(r==='win')await msg(sp.name+'は すがたを 消した…。（時が たてば また あらわれる）');
  saveGame();
}
async function starterTalk(o){
  if(!S.flags.prof){await msg('机の上に 5つの カンテラが ならんでいる。まずは 博士の 話を 聞こう。');return;}
  const id=STARTERS[o.i],sp=SP[id];
  const bg=pushBG(()=>{win(56,16,128,118,'#e8f0f8');drawMonUI(id,false,88,24,64);tx(sp.name,120,94,'#2a2233',11,'center');typeTag(sp.types[0],113,110);});
  const ok=await confirmYN(TKANA[sp.types[0]]+'（'+TK[sp.types[0]]+'）の アニマ '+sp.name+'。この子と 絆を 結びますか？');
  popW(bg);if(!ok)return;
  const m=tuneIV(makeMon(id,5,{shiny:false}),'starter');
  S.starter=id;S.rival=(o.i+4)%5;await addMon(m,false);sfx('get');refreshObjs();
  await msg(S.name+'は '+sp.name+'と 絆を 結んだ！');
  await msg(RIVAL+'「へえ、それを 選んだのか。じゃあ おれは こいつだ！ さっそく 勝負しようぜ、'+S.name+'！」');
  const r=await battle({trainer:{name:'ライバルの '+RIVAL,team:rivalTeam(1),money:300,spr:21}});
  S.party.forEach(healMon);
  await msg(RIVAL+'「'+(r==='win'?'くそっ、きたえなおしだ！ 次は 負けないからな！':'へへ、おれの 勝ちだな！ もっと 強くなれよ！')+'」');
  S.flags['s:rival1']=1;refreshObjs();
  await msg('博士「ふたりとも よい 勝負じゃった。'+S.name+'、きみに たのみが ある。この「博物誌」を 完成させて ほしいのじゃ。」');
  await msg('博士「ルミエール大陸には 千を こえる アニマが おる。出会った アニマは 博物誌に 記されていくぞ。」');
  S.flags.dex=1;bagAdd('fuda',5);bagAdd('heal1',3);bagAdd('k_map');sfx('get');
  await msg(S.name+'は 博物誌と 大陸の地図、カンテラ5つ、薬草3つを もらった！');
  await msg('博士「各地の ギルドを めぐり 16の紋章を 集めれば、「栄冠の城」への 道が ひらく。」');
  await msg('博士「それと… 近ごろ 「灰の結社」という 者たちが 旅人の カンテラの 灯を 消して まわっておる。気を つけるのじゃぞ。」');
  saveGame();
}
async function profTalk(){
  if(!S.starter){
    S.flags.prof=1;
    await msg('博士「おお '+S.name+'、まっておったぞ。わしは アニマを 研究しておる ウィックじゃ。」');
    await msg('博士「アニマは 灯りに 心を ひらく 生きものじゃ。「カンテラ」を かかげて 絆を 結ぶと、その灯に やどって 仲間に なってくれる。」');
    await msg('博士「机の上の 5つの カンテラに それぞれ アニマが 宿っておる。話しかけて、1匹 えらびなさい。」');return;
  }
  const seen=countKeys(S.seen),got=countKeys(S.caught);
  await msg('博士「博物誌の 調子は どうじゃ？ 見つけた数 '+seen+'、なかまにした数 '+got+'。'+(got<30?'まだまだ これからじゃな！':got<200?'なかなかの ものじゃ！':got<600?'すばらしい！ 大陸に 名が ひびくぞ！':'信じられん…！ きみこそ 真の アニマ博士じゃ！')+'」');
  if(S.flags.champ)await msg('博士「大陸の 果ての 遺跡に 「ルクス」と よばれる アニマが あらわれた そうじゃ。各地の 遺跡の 守護獣たちも、王者の きみを 待っておるぞ。」');
}
async function ending(){
  await msg('ここは 栄光の間。\n'+S.name+'と アニマたちの 名が 永遠に きざまれた！');
  const bg=pushBG(()=>{ctx.fillStyle='#141020';ctx.fillRect(0,0,LW,LH);tx('王者 '+S.name,120,14,'#f6e8b8',14,'center');
    S.party.forEach((m,i)=>{const x=24+i*52;drawMonUI(m.sp,m.shiny,x,50+Math.sin(G.t/14+i)*4,48);tx(monName(m),x+24,104,'#fff',8,'center');tx('Lv'+m.lv,x+24,116,'#c8c0d8',8,'center');});
    win(0,LH-MSG_H,LW,MSG_H);});
  sfx('lvup');
  await msg('こうして '+S.name+'は ルミエール大陸の 新たな 王者と なった。');
  await msg('だが 博物誌は まだ 道の 途中。まだ 見ぬ アニマたちが 大陸の どこかで 待っている。');
  await msg('アニマ クロニクル　― おわり ―\n（旅は つづく… 各地の 遺跡の 守護獣たちに 会いに行こう）');
  popW(bg);
  S.flags.champ=1;S.party.forEach(healMon);
  await warpTo(homeSpot(),0);S.heal=homeSpot();saveGame();
  await msg('かあさん「おかえりなさい！ 王者に なったんですって？ さすが わたしの 子ね！」');
}

/* ---------- フィールドの描画 ---------- */
const BLD_MARK={heal:'宿',shop:'店',gym:'闘',lab:'研',league:'城',home:'家'};
function drawWorldPix(){
  const m=G.map,p=G.pl,g=wctx;if(!m)return;
  const ppx=p.x*16+(p.moving?DX[p.dir]*p.prog:0),ppy=p.y*16+(p.moving?DY[p.dir]*p.prog:0);
  let camx=Math.round((ppx-112)*K)/K,camy=Math.round((ppy-96)*K)/K;
  if(m.W*16<=LW)camx=Math.round((m.W*16-LW)/2);if(m.H*16<=LH)camy=Math.round((m.H*16-LH)/2);
  G.camx=camx;G.camy=camy;
  drawGround(g,m,camx,camy);
  // 人物と置き物を行ごとにまとめ、木や草むらと奥→手前の順で重ねる
  const byRow={},put=e=>{const r=Math.round(e.y/16);(byRow[r]||(byRow[r]=[])).push(e);};
  const skip={};   // 道具が落ちているマスは手前の草をかぶせない（見つけやすく）
  for(const o of G.objs){if(o.hide)continue;put({o,y:o.y*16+(o.oy||0)});if(o.k==='item')skip[(o.y+16)*64+o.x+16]=1;}
  put({pl:1,y:ppy});
  if(folVisible()){const q=folPos();put({fol:1,y:q[1]});}
  drawRows(g,m,camx,camy,byRow,e=>{
    if(e.fol){drawFollower(g,camx,camy);return;}
    if(e.pl){
      const x=ppx-camx,y=ppy-camy;
      if(p.surf){const b=Math.sin(G.t/14)*0.6;   // 小舟：船べりの奥→人→手前の船べり
        drawBoat(g,x+8,y+b,p.dir,false);drawChar(g,'pl',p.dir,0,x,y-9+b);drawBoat(g,x+8,y+b,p.dir,true);return;}
      if(riding()){drawIcon(g,3,x-4,y+3,24,16);drawChar(g,'pl',p.dir,3+(p.moving?((p.stepN||0)&1):0),x,y-6);return;}
      drawIcon(g,3,x,y+2);
      drawChar(g,'pl',p.dir,p.moving?walkFr(((p.stepN||0)&1)*2+(p.prog>=8?1:0)):0,x,y-6);
      return;
    }
    const o=e.o,x=o.x*16+(o.ox||0)-camx,y=o.y*16+(o.oy||0)-camy;
    if(x<-32||y<-32||x>LW+16||y>LH+16)return;
    if(o.k==='item')drawIcon(g,0,x,y);
    else if(o.k==='starter')drawIcon(g,1,x,y-3);
    else if(o.k==='legend'){drawIcon(g,3,x-4,y+2,24,18);g.drawImage(monCanvas(o.sp,false,false),x-8,y-18+Math.sin(G.t/20)*1.5,32,32);}
    else{
      const water=m.t[o.y*m.W+o.x]===T.WATER;
      if(water)drawChar(g,o.spr,o.dir,0,x,y-2+Math.sin(G.t/16+o.x)*0.5,12);
      else{drawIcon(g,3,x,y+2);drawChar(g,o.spr,o.dir,(o.ox||o.oy)?walkFr(G.t>>3):0,x,y-6);}
      if(o.alert)drawIcon(g,2,x,y-35);
    }
  },skip);
  drawAmbient(g,m,camx,camy);drawDayNight(g,m,camx,camy);
}
function drawWorldUI(){
  const m=G.map;if(!m)return;
  for(const b of m.blds){
    if(!BLD_MARK[b.kind])continue;
    const x=(b.x+2)*16-G.camx+8,y=b.y*16-G.camy+9;
    if(x<-20||y<-20||x>LW+20||y>LH+20)continue;
    ctx.fillStyle='rgba(20,16,32,0.55)';ctx.beginPath();ctx.ellipse(x,y+7,9,9,0,0,6.3);ctx.fill();
    tx(BLD_MARK[b.kind],x,y,'#fff',12,'center');
  }
  if(G.banner&&G.banner.t>0&&!UI.length){
    const a=Math.min(1,G.banner.t/20);ctx.globalAlpha=a;
    setFont(10);const w=Math.max(70,ctx.measureText(G.banner.text).width+20);
    win(4,4,w,22);tx(G.banner.text,14,9,'#2a2233',10);ctx.globalAlpha=1;
  }
}

/* ---------- タイトル ---------- */
let titleMons=null;
function drawTitlePix(){
  const g=wctx;g.lineJoin='round';g.lineCap='round';
  g.fillStyle='#3f6fbf';g.fillRect(0,0,LW,LH);g.fillStyle='#5f93d6';g.fillRect(0,70,LW,LH);g.fillStyle='#8fbfea';g.fillRect(0,108,LW,LH);g.fillStyle='#c4e4f8';g.fillRect(0,134,LW,LH);
  const cloud=(x,y,k)=>{g.fillStyle='#ffffff';g.beginPath();g.ellipse(x,y,16*k,5.5*k,0,0,6.3);g.ellipse(x-7*k,y-4*k,8*k,6*k,0,0,6.3);g.ellipse(x+5*k,y-6*k,10*k,7.5*k,0,0,6.3);g.fill();g.fillStyle='rgba(90,120,190,0.3)';g.beginPath();g.ellipse(x+k,y+2.2*k,13*k,2.6*k,0,0,6.3);g.fill();};
  for(let i=0;i<4;i++)cloud((i*83+G.t*0.06)%(LW+90)-40,100+(i*23)%34,0.7+i*0.15);
  const hill=(col,y0,a,b)=>{g.fillStyle=col;g.strokeStyle='#2b3f2f';g.lineWidth=1;g.beginPath();g.moveTo(-10,LH+10);g.lineTo(-10,y0);g.quadraticCurveTo(60,y0-a,130,y0+4);g.quadraticCurveTo(190,y0-b,LW+10,y0+2);g.lineTo(LW+10,LH+10);g.closePath();g.fill();g.stroke();};
  hill('#4c9a5c',170,26,20);hill('#63b36d',184,10,22);
  g.strokeStyle='rgba(30,60,40,0.45)';g.lineWidth=0.6;for(let i=0;i<16;i++){const x=(i*37)%LW,y=188+(i*13)%18;g.beginPath();g.moveTo(x,y);g.lineTo(x+1.4,y-3.4);g.moveTo(x+2.4,y);g.lineTo(x+3.2,y-2.6);g.stroke();}
  if(!titleMons){const r=RNG('title'+((Date.now()/60000)|0));titleMons=STARTERS.map(id=>id);for(let i=0;i<4;i++)titleMons.push(1+r.int(BOOK_SP.length));}
  titleMons.forEach((id,i)=>{const x=(i*46+G.t/3)%(LW+60)-50,y=150+((i*17)%14)+Math.abs(Math.sin(G.t/9+i))*-3;g.drawImage(monCanvas(id,false,true),x,y,40,40);});
}
function drawTitleUI(){
  ctx.lineJoin='round';
  setFont(23);ctx.textAlign='center';ctx.textBaseline='top';ctx.strokeStyle='#22324e';ctx.lineWidth=5;ctx.strokeText('アニマ・クロニクル',120,36);
  tx('アニマ・クロニクル',120,36,'#fff3c4',23,'center');
  tx('― カンテラの旅人 ―',120,68,'#fff',11,'center');
  tx('全'+N_SPECIES+'種のアニマと 絆を結ぶ旅',120,86,'#e8f0ff',8,'center');
  tx('ver '+VERSION,LW-4,LH-10,'rgba(255,255,255,0.6)',7,'right');
}
async function titleFlow(){
  G.scene='title';G.fade=0;
  for(;;){
    const sv=loadSave();
    const opts=sv?['つづきから','はじめから']:['はじめから'];
    const c=await menu(opts,{x:74,y:108,w:92,cancel:false});
    if(opts[c]==='つづきから'){S=sv;if(!S.opts)S.opts={snd:1,fast:0};await fadeTo(1,250);startFromSave();await fadeTo(0,250);return;}
    if(sv&&!(await confirmYN('いまの きろくは 上書きすると 消えます。はじめから 始めますか？')))continue;
    await newGame();return;
  }
}
async function newGame(){
  await fadeTo(1,300);
  S=newSave('ルカ');SND=true;charInvalidate();
  const bg=pushBG(()=>{ctx.fillStyle='#141020';ctx.fillRect(0,0,LW,LH);drawMonUI(STARTERS[(G.t>>7)%5],false,88,40,64);});
  G.fade=0;
  await msg('ここは ルミエール大陸。');
  await msg('人は むかしから カンテラの 灯を わかちあい、ふしぎな 生きもの 「アニマ」と ともに くらしてきた。');
  await msg('きょうは きみが はじめての アニマと 出会う日。…きみの 名前を 教えて ください。');
  let name='ルカ';
  try{const n=window.prompt('あなたの なまえ（6文字まで）','ルカ');if(n&&n.trim())name=n.trim().slice(0,6);}catch(e){}
  S.name=name;
  await msg(name+'。いい 名前だね。つぎは きみの すがたを 教えて。');
  await dressScreen(true);
  await msg('よく にあっているよ。それでは、旅の はじまりだ！');
  await fadeTo(1,300);popW(bg);
  const h=homeSpot();S.heal=h;G.scene='world';loadMap(h.map,h.x,h.y,2);
  await fadeTo(0,300);
  G.busy=true;
  await msg('かあさん「'+name+'、おはよう！ ウィック博士が 研究所で まっているわよ。屋根に 「研」と 書いてある 建物よ。」');
  await msg('（十字パッドか 画面を なぞって 移動。Aで 話す・しらべる。Bを おしながらで 走る。MENUで メニュー）');
  G.busy=false;
  saveGame();
}

/* ---------- 起動 ---------- */
window.addEventListener('load',()=>{
  cv=document.getElementById('cv');ctx=cv.getContext('2d');
  wctx=ctx;
  setupInput();resize();window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.scene==='world'&&!G.busy)saveGame();});
  requestAnimationFrame(loop);
  titleFlow();
});

</script>

    else if((m=/^(self|foe):(atk|def|spa|spd|spe|acc|eva)([+-]\d)(?:@(\d+))?$/.exec(tk)))out.push({k:'stage',who:m[1],stat:m[2],n:+m[3],ch:m[4]?+m[4]:100});
    else if((m=/^fixed(\d+)$/.exec(tk)))out.push({k:'fixed',n:+m[1]});
    else if((m=/^wx:(\w+)$/.exec(tk)))out.push({k:'wx',w:m[1]});
    else if((m=/^wall:(p|s)$/.exec(tk)))out.push({k:'wall',c:m[1]==='s'?1:0});

  }
  return out;
}

function buildLearn(r,t1,t2,ori){   // ori: 0=物理が得意 1=特殊が得意 → その分類の技を おぼえていく
  const L=[],seen=new Set();
  const add=(lv,id)=>{if(id==null||seen.has(id))return;seen.add(id);L.push([lv,id]);};
  const tr=(t,k)=>TYPE_MOVES[t][ori?'spec':'phys'][k];
  add(1,0);add(1,r.pick([5,6]));
  add(r.range(4,6),t1===0?(ori?tr(0,0):1):tr(t1,0));
  add(r.range(9,11),t2>0?tr(t2,0):(t1===0?r.pick([7,8]):1));
  add(r.range(13,16),r.pick(t1===0?[7,8]:TYPE_MOVES[t1].st));
  add(r.range(18,22),tr(t1,1));
  add(r.range(24,27),t2>=0?tr(t2,1):tr(0,1));
  add(r.range(29,32),r.pick([7,8,9]));
  add(r.range(33,37),tr(t1,2));
  add(r.range(40,43),t2>=0?tr(t2,2):tr(0,2));
  add(r.range(48,54),tr(t1,3));
  add(r.range(58,62),t2>=0?tr(t2,3):tr(0,3));
  L.sort((a,b)=>a[0]-b[0]);
  return L;
}
// 技が増えたぶん、系統ごとに ちがう技も覚える（べつの乱数を使い、名前や見た目の乱数は動かさない）
function extendLearn(L,q,t1,t2,ori){
  const seen=new Set(L.map(a=>a[1])),key=ori?'S':'P',tb=t2>=0?t2:0;
  const add=(lv,id)=>{if(id==null||id<0||seen.has(id))return;seen.add(id);L.push([lv,id]);};
  const lvFor=m=>m.pow<=1?q.range(22,34):m.pow<=50?q.range(6,14):m.pow<=70?q.range(15,27):m.pow<=90?q.range(28,41):m.pow<=110?q.range(42,53):q.range(54,68);
  const pk=(arr,n)=>{const a=arr.filter(id=>!seen.has(id));q.shuffle(a);return a.slice(0,n);};
  for(const id of pk(TYPE_MOVES[t1][key],3))add(lvFor(MOVES[id]),id);
  for(const id of pk(TYPE_MOVES[tb][key],t2>=0?2:1))add(lvFor(MOVES[id]),id);
  for(const id of pk(TYPE_MOVES[t1].st,2))add(q.range(8,46),id);
  for(const id of pk(TYPE_MOVES[tb].st,1))add(q.range(12,50),id);
  L.sort((a,b)=>a[0]-b[0]);return L;
}
function statsFor(r,t1,bst,w){
  let s=0;for(const x of w)s+=x;
  return w.map(x=>Math.max(12,Math.round(bst*x/s)));
}
function makeWeights(r,t1){
  const w=r.pick(ARCH).map(x=>x*(0.85+0.3*r()));
  if(PHYS[t1]&&w[3]>w[1]){const t=w[1];w[1]=w[3];w[3]=t;}
  if(!PHYS[t1]&&w[1]>w[3]){const t=w[1];w[1]=w[3];w[3]=t;}
  if(t1===6)w[1]*=1.15;if(t1===16||t1===12)w[2]*=1.2;if(t1===9||t1===3)w[5]*=1.15;if(t1===10)w[3]*=1.1;
  return w;
}

  // 図鑑順：最初の5系統 → 出現が早い順 → 伝説
  const order=FAMS.slice(0,5).concat(FAMS.slice(5).filter(f=>!f.legend).sort((a,b)=>a.tier-b.tier),FAMS.filter(f=>f.legend));

function biomeAt(p){return p<7?'plain':p<13?'forest':p<19?'coast':p<25?'swamp':p<29?'desert':p<33?'volcano':p<37?'ruin':p<43?'snow':'peak';}

function genMacro(seed,pNew){
  const r=RNG('macro'+seed),N=GW*GH,adj=[],vis=new Uint8Array(N);
  for(let i=0;i<N;i++)adj.push([]);
  const act=[r.int(N)];vis[act[0]]=1;
  while(act.length){
    const ai=r()<pNew?act.length-1:r.int(act.length),c=act[ai],cx=c%GW,cy=(c/GW)|0,opts=[];
    for(let d=0;d<4;d++){const nx=cx+DX[d],ny=cy+DY[d];if(nx<0||ny<0||nx>=GW||ny>=GH)continue;const n=ny*GW+nx;if(!vis[n])opts.push(n);}
    if(!opts.length){act.splice(ai,1);continue;}
    const n=r.pick(opts);vis[n]=1;adj[c].push(n);adj[n].push(c);act.push(n);
  }
  const bfs=s=>{const dist=new Int16Array(N).fill(-1),par=new Int16Array(N).fill(-1);dist[s]=0;const q=[s];
    for(let i=0;i<q.length;i++){const c=q[i];for(const n of adj[c])if(dist[n]<0){dist[n]=dist[c]+1;par[n]=c;q.push(n);}}
    let far=s;for(let i=0;i<N;i++)if(dist[i]>dist[far])far=i;return{par,far};};
  const a=bfs(0).far,b=bfs(a),path=[];
  for(let c=b.far;c>=0;c=b.par[c])path.push(c);
  return{adj,path};
}

(function buildWorld(){
  let mz=null;
  for(let s=0;s<6000&&!mz;s++){const m=genMacro(s,0.86);if(m.path.length>=MAINLEN&&m.path.length<=MAINLEN+3){mz=m;WORLD.seed=s;}}
  const adj=mz.adj,path=mz.path,N=GW*GH;
  const main=path.slice(path.length-MAINLEN);
  const mainIdx=new Int16Array(N).fill(-1);main.forEach((n,i)=>{mainIdx[n]=i;});
  const attach=new Int16Array(N).fill(-1),depth=new Int16Array(N),par=new Int16Array(N).fill(-1),need=new Float32Array(N),rootGate=new Array(N).fill('none');
  const q=[];for(const n of main){attach[n]=mainIdx[n];q.push(n);}
  for(let i=0;i<q.length;i++){
    const c=q[i];
    for(const n of adj[c]){
      if(attach[n]>=0)continue;
      attach[n]=attach[c];depth[n]=depth[c]+1;par[n]=c;
      if(depth[n]===1){
        const a=attach[n],r=RNG('br'+n);
        const pre=path.indexOf(n)>=0&&path.indexOf(n)<path.length-MAINLEN;
        const g=pre?'sea':a<6?r.pick(['shrub','shrub','crack','none']):a<12?r.pick(['crack','crack','sea','none','shrub']):a<27?r.pick(['sea','boulder','crack','none']):r.pick(['boulder','sea','none','none']);
        rootGate[n]=g;need[n]=NEEDP[g];
      }else{rootGate[n]=rootGate[c];need[n]=need[c];}
      q.push(n);
    }
  }
  const nodeProg=n=>mainIdx[n]>=0?mainIdx[n]:Math.max(attach[n],need[n])+depth[n]*0.8;
  const usedNames=new Set();
  const wildName=(r,pal)=>{let s;do{s=r.pick(NAME_A)+r.pick(NAME_B);}while(usedNames.has(s));usedNames.add(s);return s;};
  let poolI=0;
  const mk=(fx,fy,o)=>{const c=Object.assign({key:fx+','+fy,fx,fy,node:false,kind:'route',ex:[0,0,0,0],main:-1,gate:null,gym:0,land:[],water:[],legends:[]},o);CELLS[c.key]=c;return c;};
  // ノード
  const nodeCell=[];

    const bp=i>=0?i:attach[n];
    const c=mk(gx*2,gy*2,{node:true,prog,main:i,pal:biomeAt(bp),biome:biomeAt(bp),branch:i<0,depth:depth[n]});
    for(const m of adj[n]){for(let d=0;d<4;d++)if(m===n+DX[d]+DY[d]*GW&&(d%2===0||((n%GW)+DX[d]>=0&&(n%GW)+DX[d]<GW)))c.ex[d]=1;}
    if(i>=0){
      if(i===0){c.kind='town';c.size='village';c.special=['lab','home'];c.name='リトルウィック村';}
      else if(i%3===0&&i<=48){c.kind='town';c.size='city';c.gym=i/3;c.name=GYM_TOWN[c.gym]+'の街';}
      else if(i===49){c.kind='dung';c.style='shrine';c.nF=3;c.name='原初の神殿';c.pal=c.biome='cave';}
      else if(i===50){c.kind='town';c.size='town';c.name='サミット村';}
      else if(i===51){c.kind='dung';c.style='road';c.nF=6;c.name='栄冠への道';c.pal=c.biome='cave';}
      else if(i===52){c.kind='town';c.size='league';c.special=['league'];c.name='栄冠の城';}
      else{
        const k=Math.floor(i/3),rs=RNG('seg'+k),townFirst=k===0?true:rs.chance(0.5);
        if((i%3===1)===townFirst){c.kind='town';c.size=rs.chance(0.5)?'town':'village';}
        else{c.kind='wild';if(k>0&&rs.chance(0.35))c.pal=c.biome='cave';}
      }
      if(i===49||i===51){for(let d=0;d<4;d++){const m=n+DX[d]+DY[d]*GW;if(c.ex[d]&&mainIdx[m]===i+1)c.onward=d;}}
    }else{
      const leaf=adj[n].length===1;
      if(leaf||(depth[n]%2===0&&r.chance(0.4))){c.kind='dung';c.style='lair';c.nF=prog>20?3:2;c.pal=c.biome='cave';}
      else if(depth[n]%2===0){c.kind='town';c.size='village';}
      else{c.kind='wild';if(r.chance(0.3))c.pal=c.biome='cave';}
    }
    nodeCell[n]=c;
  }
  // 名前
  const nodesByProg=nodeCell.slice().sort((a,b)=>a.prog-b.prog);
  for(const c of nodesByProg){
    const r=RNG('nm'+c.key);
    if(c.name)continue;
    if(c.kind==='town'){c.name=TOWN_POOL[poolI++%TOWN_POOL.length]+(c.size==='village'?(r.chance(0.5)?'村':'の村'):'の町');}
    else if(c.kind==='dung')c.name=wildName(r)+'の遺跡';
    else c.name=wildName(r)+BIOME_SUF[c.pal];
  }
  // 道（連結セル）
  let side=1;
  for(let n=0;n<N;n++)for(const m of adj[n]){
    if(m<n)continue;
    const a=nodeCell[n],b=nodeCell[m],vert=a.fx===b.fx;
    const ia=mainIdx[n],ib=mainIdx[m],isMain=ia>=0&&ib>=0&&Math.abs(ia-ib)===1;
    const child=depth[n]>depth[m]?n:m;
    const c=mk((a.fx+b.fx)/2,(a.fy+b.fy)/2,{vert,ex:vert?[1,0,1,0]:[0,1,0,1]});
    if(isMain){
      const e=Math.min(ia,ib);c.main=e+0.5;c.prog=e+0.5;c.pal=c.biome=biomeAt(e+0.5);c.name='第'+(e+1)+'街道';
      if(e%3===0&&e>0&&e<=48){const k=e/3,ty=GATE_AFTER[k]||'guard';if(ty==='sea')c.kind='sea';else c.gate={type:ty,k};}
      const ri_=[7,16,25,34,43,50].indexOf(e),ki=[14,26,38].indexOf(e);
      if(ri_>=0)c.gate={type:'story',sid:'rival'+(ri_+2)};
      if(ki>=0)c.gate={type:'story',sid:'kanbu'+(ki+1)};
    }else{
      c.prog=(a.prog+b.prog)/2;c.pal=c.biome=biomeAt(attach[child]);c.branch=true;c.name=(side++)+'番わき道';
      if(depth[child]===1){const g=rootGate[child];if(g==='sea')c.kind='sea';else if(g!=='none')c.gate={type:g,k:0};}
    }
  }
  for(const k in CELLS){const c=CELLS[k];c.lv=Math.round(levelAt(c.prog));}
  WORLD.main=main.map(n=>nodeCell[n]);
  WORLD.towns=nodesByProg.filter(c=>c.kind==='town');
  WORLD.lairs=nodesByProg.filter(c=>c.kind==='dung'&&c.style==='lair');
  WORLD.areas=Object.values(CELLS).filter(c=>c.kind!=='town').sort((a,b)=>a.prog-b.prog);
  // 伝説の配置
  const leg=[12,11,9,6,2,3,4,7,8,1,10,13,5,16,15,14,0].map(t=>SP.findIndex(s=>s&&s.name===GUARDIAN[t]));
  ['アウローラ','ヴェスペラ','ルナリス','コメテス','ソムニア'].forEach(nm=>leg.push(SP.findIndex(s=>s&&s.name===nm)));
  const L=WORLD.lairs;
  if(L.length){leg.forEach((id,i)=>{const lair=L[Math.min(L.length-1,Math.floor(i*L.length/leg.length))];if(lair.legends.length<3)lair.legends.push(id);else L[i%L.length].legends.push(id);});
    L[L.length-1].legends.push(SP_HAJIMARI);}
  WORLD.main[49].legends=[SP_OWARI];
  // 出現テーブル
  const fams=FAMS.filter(f=>!f.legend&&!f.starter);
  const landAreas=WORLD.areas.filter(a=>a.kind!=='sea');
  for(const f of fams){
    const target=f.tier*50,water=f.hab==='water',pool=water?WORLD.areas:landAreas;
    for(let rep=0;rep<2;rep++){
      let best=null,bs=1e9;
      for(const a of pool){
        const list=water?a.water:a.land;if(list.indexOf(f.id)>=0)continue;
        let s=Math.abs(a.prog-target)+list.length*2.5;
        if(!water){const aff=BIOME_AFF[a.biome];s+=aff.indexOf(f.t1)>=0?-6:(f.t2>=0&&aff.indexOf(f.t2)>=0)?-3:4;}
        if(s<bs){bs=s;best=a;}
      }
      if(best)(water?best.water:best.land).push(f.id);
    }
  }
  const landF=fams.filter(f=>f.hab!=='water'),waterF=fams.filter(f=>f.hab==='water');
  for(const a of WORLD.areas){
    const target=a.prog/50,aff=BIOME_AFF[a.biome];
    const fill=(list,src,n,useAff)=>{
      const cand=src.filter(f=>list.indexOf(f.id)<0).map(f=>[Math.abs(f.tier-target)+(useAff&&aff.indexOf(f.t1)<0?0.15:0),f]).sort((x,y)=>x[0]-y[0]);
      for(let i=0;list.length<n&&i<cand.length;i++)list.push(cand[i][1].id);
    };
    if(a.kind!=='sea')fill(a.land,landF,5,true);
    fill(a.water,waterF,3,false);
    RNG('enc'+a.key).shuffle(a.land);
  }
  // 最初の5系統のうち選ばなかったものは 終盤の草むらにまれに出る
  const late=landAreas.filter(a=>a.prog>=38&&a.prog<=48&&!a.branch);
  for(let i=0;i<5;i++)if(late.length)late[(i*3)%late.length].rare=FAMS[i].id;
})();

const ENC_W=[30,25,20,12,8,5,3,2,2,2];
function wildPick(cell,kind,bonus){
  const list=kind==='water'?cell.water:cell.land;if(!list||!list.length)return null;
  let fam;
  if(kind!=='water'&&cell.rare!=null&&ri(50)===0)fam=FAMS[cell.rare];
  else{const ws=list.map((_,i)=>ENC_W[i]||2);let s=0;for(const w of ws)s+=w;let x=Math.random()*s,i=0;for(;i<ws.length-1;i++){x-=ws[i];if(x<0)break;}fam=FAMS[list[i]];}
  const lv=clamp(cell.lv+(bonus||0)+rr(-1,1),2,90);
  return{sp:formAt(fam,lv,Math.random),lv};
}

const TCLASS=[['見習い騎士',null,0],['森の狩人',[11,4],1],['山の旅人',[12,8,6],2],['釣り人',[2],3],['拳闘士',[6],4],['占い師',[10,13],5],
 ['鷹匠',[9],6],['船乗り',[2,6],7],['学者見習い',[3,16,10],8],['火吹き芸人',[1],9],['雪国の子',[5],10],['墓守',[13,15],11],
 ['竜騎士見習い',[14],12],['鍛冶見習い',[16,1],13],['薬師',[7,4],14],['ならず者',[15,7],15],['旅の剣士',null,16],['令嬢',[0,10,5],17]];
const TNAMES=['トム','アン','ケイト','ジョン','ルーク','エマ','ベン','ミア','ガス','ソフィ','ニック','リリー','テッド','ローズ','ジャック','メグ','サム','ノア','ヒュー','ベル',
 'ヨハン','クララ','カール','エルザ','ハンス','グレタ','オットー','マリー','ピーター','アリス','ロイ','ニーナ','フィン','ドリス','マックス','ルイ','セス','ジーン','ポール','イヴ'];

function famCand(prog,types){
  const ok=f=>!f.legend&&!f.starter;
  let c=FAMS.filter(f=>ok(f)&&f.tier*50<=prog+8&&(!types||types.indexOf(f.t1)>=0||(f.t2>=0&&f.t2From===0&&types.indexOf(f.t2)>=0)));
  if(c.length<3&&types)c=FAMS.filter(f=>ok(f)&&(types.indexOf(f.t1)>=0||types.indexOf(f.t2)>=0));
  if(c.length<3)c=FAMS.filter(f=>ok(f)&&f.tier*50<=prog+8);
  return c;
}
function trainerTeam(r,prog,lv,n,types){
  const cand=famCand(prog,types),team=[],used=[];
  for(let i=0;i<n;i++){
    let f,tries=0;do{f=r.pick(cand);tries++;}while(used.indexOf(f.id)>=0&&tries<8);used.push(f.id);
    const l=Math.max(2,lv-(n-1-i));team.push({sp:formAt(f,l),lv:l});
  }
  return team;
}
function genTrainer(r,cell,tid,o){
  o=o||{};
  let cl;
  if(o.grunt)cl=['灰の結社',[7,15,13],18];
  else if(o.elite)cl=['歴戦の騎士',null,16];
  else if(o.swim)cl=['泳ぎ手',[2],19];
  else{const aff=BIOME_AFF[cell.biome];const opts=TCLASS.filter(c=>!c[1]||c[1].some(t=>aff.indexOf(t)>=0));cl=r.pick(opts);}
  const types=o.types||cl[1];
  const lv=Math.max(2,cell.lv+(o.bonus||0)+r.range(0,2));
  const n=o.n||(cell.prog<6?r.range(1,2):cell.prog<20?r.range(2,3):r.range(2,4));
  const nm=r.pick(TNAMES);
  return{k:'npc',role:'trainer',tid,cls:cl[0],name:nm,spr:cl[2]+(TFEM.indexOf(nm)>=0?'f':'m')+(TNAMES.indexOf(nm)%3),team:trainerTeam(r,cell.prog,lv,n,types),
    money:lv*r.range(20,36),los:o.los||3,x:0,y:0,dir:2};
}
function gymTeam(k){
  const t=GYM_TYPES[k],ace=gymAce(k),n=k<=2?2:k<=5?3:4,r=RNG('gym'+k);
  let cand=FAMS.filter(f=>!f.legend&&!f.starter&&(f.t1===t||(f.t2===t&&f.t2From===0)));
  r.shuffle(cand);cand.sort((a,b)=>b.n-a.n);cand=cand.slice(0,Math.max(n,5));r.shuffle(cand);
  const team=[];for(let i=0;i<n;i++){const l=ace-(n-1-i);team.push({sp:formAt(cand[i%cand.length],l),lv:l});}
  return team;
}
const ELITE=[['エウロス',[14,2],62],['ノトス',[1,9],63],['ゼファー',[5,16],64],['ボレアス',[12,8],65]];
function eliteTeam(i){

  const team=[];for(let j=0;j<4;j++){const l=e[2]-(3-j);team.push({sp:formAt(cand[j%cand.length],l),lv:l});}

}
function champTeam(){
  const r=RNG('champ');const cand=FAMS.filter(f=>!f.legend&&!f.starter&&f.n===6);r.shuffle(cand);
  const seen=[],team=[];for(const f of cand){if(seen.indexOf(f.t1)>=0)continue;seen.push(f.t1);team.push({sp:formAt(f,99),lv:66+team.length});if(team.length===4)break;}
  return team;
}
function itemFor(r,prog,rich){
  const early=['fuda','fuda','heal1','heal1','c_psn','c_par','repel'],mid=['fuda2','fuda2','heal2','heal2','c_all','revive','rope','repel','c_slp','c_brn'],
        late=['fuda3','fuda3','heal3','heal3','heal4','revive','c_all','candy','ppup'];
  if(rich||r.chance(0.12)){const x=r();if(x<0.35)return'candy';if(x<0.5)return'ppup';const tier=prog<14?1:prog<32?2:3;const t=r.int(NT);const d=MOVES.filter(m=>m.type===t&&(m.pow<=1||(tier===1?m.pow<=70:tier===2?(m.pow>=60&&m.pow<=100):m.pow>=90))).map(m=>m.id);return'tm'+d[(prog*7+t*13+Math.floor(x*997))%d.length];}
  return r.pick(prog<12?early:prog<30?mid.concat(early.slice(0,3)):late.concat(mid.slice(0,4)));
}
// 店ごとに ちがう 技の書を5さつ（町の進み具合で 強さが変わる）
function tmStock(key){
  const c=CELLS[key];if(!c)return[];const q=RNG('tmshop'+key),tier=c.prog<14?1:c.prog<32?2:3,out=[];
  for(let n=0;out.length<5&&n<80;n++){const m=MOVES[q.int(MOVES.length)],ok=m.pow<=1||(tier===1?m.pow<=70:tier===2?m.pow<=100:true);if(ok&&out.indexOf('tm'+m.id)<0)out.push('tm'+m.id);}
  return out;
}
function shopStock(badges){
  const s=['fuda','heal1','c_psn','c_par'];
  if(badges>=1)s.push('c_slp','c_brn','c_frz','repel');
  if(badges>=3)s.push('fuda2','heal2','rope');
  if(badges>=6)s.push('revive','c_all');
  if(badges>=9)s.push('fuda3','heal3');
  if(badges>=13)s.push('heal4');

}

function gymHint(k){
  const t=GYM_TYPES[k],weak=[];for(let a=0;a<NT;a++)if(typeEff(a,[t])>1)weak.push(TK[a]);
  return GYM_TOWN[k]+'のギルドは 「'+TK[t]+'」タイプの使い手。「'+weak.join('」「')+'」タイプの技が よく効くよ。';
}
function newMap(id,cell,w,h,fill){
  return{id,cell,W:w,H:h,t:new Uint8Array(w*h).fill(fill),objs:[],signs:{},warps:{},blds:[],exits:[0,0,0,0],name:cell?cell.name:'',
    pal:cell?cell.pal:'plain',indoor:false,border:fill,enc:null,blobs:[]};
}
function carver(m,FL,PT,WALL){
  return(x,y)=>{for(let dy=-1;dy<=2;dy++)for(let dx=-1;dx<=2;dx++){
    const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=m.W||yy>=m.H)continue;
    const i=yy*m.W+xx;if(dx>=0&&dx<=1&&dy>=0&&dy<=1)m.t[i]=PT;else if(m.t[i]===WALL)m.t[i]=FL;}};
}
function carveLine(br,x0,y0,x1,y1){let x=x0,y=y0;br(x,y);while(x!==x1||y!==y1){if(x!==x1)x+=Math.sign(x1-x);else y+=Math.sign(y1-y);br(x,y);}}
function blobFill(m,cx,cy,rx,ry,fn){
  for(let y=cy-ry;y<=cy+ry;y++)for(let x=cx-rx;x<=cx+rx;x++){
    if(x<2||y<2||x>m.W-3||y>m.H-3)continue;
    const dx=(x-cx)/(rx+0.5),dy=(y-cy)/(ry+0.5);if(dx*dx+dy*dy<=1)fn(x,y);}
}
function transposeMap(m){
  const t2=new Uint8Array(m.t.length);
  for(let y=0;y<m.H;y++)for(let x=0;x<m.W;x++)t2[x*m.W+y]=m.t[y*m.W+x];
  m.t=t2;const TD=[3,2,1,0];
  for(const o of m.objs){const x=o.x;o.x=o.y;o.y=x;if(o.dir!=null)o.dir=TD[o.dir];}
  const s2={};for(const k in m.signs){const p=k.split(',');s2[p[1]+','+p[0]]=m.signs[k];}m.signs=s2;
}
function neighborCell(cell,d){return cellAt(cell.fx+DX[d],cell.fy+DY[d]);}
function routeSign(cell){
  const dn=['北','東','南','西'];let s=cell.name;
  for(let d=0;d<4;d++)if(cell.ex[d]){const n=neighborCell(cell,d);if(n)s+='\n'+dn[d]+'：'+n.name;}
  return s;
}
function occupied(m,x,y){for(const o of m.objs)if(o.x===x&&o.y===y)return true;return false;}

/* ---------- 街道（連結セル） ---------- */
function genRoute(cell){
  const r=RNG('map'+cell.key),sea=cell.kind==='sea',cave=cell.pal==='cave';
  const WALL=sea?T.WATER:cave?T.ROCK:T.TREE,FL=cave?T.CFLOOR:T.GRASS,PT=cave?T.CFLOOR:T.PATH;
  const m=newMap(cell.key,cell,MW,MH,WALL),t=m.t;
  const set=(x,y,v)=>{if(x>=0&&y>=0&&x<MW&&y<MH)t[y*MW+x]=v;};
  const get=(x,y)=>t[y*MW+x];
  const px=new Int8Array(MH).fill(15);
  let tid=0,iid=0;
  if(sea){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(x<2||x>29)t[y*MW+x]=T.ROCK;
    for(let y=0;y<4;y++)for(let x=12;x<=19;x++){set(x,y,T.SAND);set(x,MH-1-y,T.SAND);}
    for(let i=0;i<10;i++){const cx=r.range(4,27),cy=r.range(6,25);if(cx>=11&&cx<=20)continue;blobFill(m,cx,cy,r.range(1,2),1,(x,y)=>{if(x<11||x>20)set(x,y,T.ROCK);});}
    for(let i=0;i<3;i++){
      const cx=r.chance(0.5)?r.range(5,8):r.range(23,26),cy=r.range(7,24);
      blobFill(m,cx,cy,2,2,(x,y)=>set(x,y,T.SAND));
      m.objs.push({k:'item',iid:iid++,x:cx,y:cy,item:itemFor(r,cell.prog,i===0)});
    }
    for(const y of [r.range(7,10),r.range(14,17),r.range(21,24)]){
      const left=r.chance(0.5),o=genTrainer(r,cell,tid++,{swim:true,los:5});
      o.x=left?12:19;o.y=y;o.dir=left?1:3;set(o.x,o.y,T.WATER);m.objs.push(o);
    }
  }else{
    const jogs=[r.range(5,7),r.range(11,13),r.range(20,22),r.range(26,28)],tg=[r.range(6,24),r.range(6,24),r.range(6,24),15];
    let x=15;
    for(let y=0;y<MH;y++){
      const j=jogs.indexOf(y);
      if(j>=0){
        const nx=tg[j],lo=Math.min(x,nx),hi=Math.max(x,nx);
        for(let xx=lo-1;xx<=hi+2;xx++){if(get(xx,y-1)===WALL)set(xx,y-1,FL);set(xx,y,FL);}
        for(let xx=lo;xx<=hi+1;xx++)set(xx,y,PT);
        x=nx;
      }else{for(let d=-1;d<=2;d++)set(x+d,y,FL);set(x,y,PT);set(x+1,y,PT);}
      px[y]=x;
    }
    // 広場と草むら
    for(let i=0,n=r.range(4,6);i<n;i++){
      const y=r.range(3,28);if(Math.abs(y-16)<4)continue;
      const sd=r.chance(0.5)?-1:1,cx=clamp(px[y]+sd*r.range(3,6)+(sd>0?1:0),4,27),rx=r.range(2,4),ry=r.range(2,3),tall=!cave&&r.chance(0.8);
      for(let xx=Math.min(cx,px[y]);xx<=Math.max(cx,px[y]);xx++)if(get(xx,y)===WALL)set(xx,y,FL);
      blobFill(m,cx,y,rx,ry,(xx,yy)=>{if(Math.abs(yy-16)<2)return;const v=get(xx,yy);if(v===WALL||v===FL)set(xx,yy,tall&&r.chance(0.8)?T.TALL:FL);});
      m.blobs.push([cx,y,rx,ry]);
    }
    if(!cave)for(const y0 of [r.range(2,3),r.range(8,9),r.range(23,24)]){
      for(let yy=y0;yy<y0+3;yy++){if(jogs.indexOf(yy)>=0||jogs.indexOf(yy+1)>=0||Math.abs(yy-16)<2)continue;for(let d=-1;d<=2;d++)set(px[yy]+d,yy,T.TALL);}
    }
    if(!cave)for(let i=0;i<14;i++){const xx=r.range(2,29),yy=r.range(2,29);if(get(xx,yy)===T.GRASS)set(xx,yy,T.FLOWER);}
    // 池
    if(m.blobs.length&&r.chance(0.45)){const b=r.pick(m.blobs);if(Math.abs(b[0]-px[b[1]])>=4){for(let yy=b[1]-1;yy<=b[1];yy++)for(let xx=b[0]-1;xx<=b[0];xx++)if(Math.abs(yy-16)>=2)set(xx,yy,T.WATER);}}
    // 関所
    const g=cell.gate,gx=px[16];
    if(g){
      for(let xx=0;xx<MW;xx++)if(!SOLID[get(xx,16)])set(xx,16,cave?T.ROCK:T.FENCE);
      set(gx,16,PT);
      if(g.type==='guard')m.objs.push({k:'npc',role:'guard',need:g.k,x:gx,y:16,dir:0,spr:20});
      else if(g.type==='story')m.objs.push({k:'npc',role:'story',sid:g.sid,x:gx,y:16,dir:0,spr:g.sid[0]==='r'?21:'k'+g.sid.slice(5)});
      else set(gx,16,g.type==='shrub'?T.SHRUB:g.type==='crack'?T.CRACK:T.BOULDER);
    }
    // トレーナー
    const rows=[];for(let y=4;y<=27;y++)if(px[y-1]===px[y]&&px[y+1]===px[y]&&Math.abs(y-16)>=2&&jogs.indexOf(y+1)<0)rows.push(y);
    r.shuffle(rows);const used=[];
    const nT=cell.prog<1?1:r.range(2,4);
    for(const y of rows){
      if(used.length>=nT)break;if(used.some(u=>Math.abs(u-y)<3))continue;used.push(y);
      const left=r.chance(0.5),o=genTrainer(r,cell,tid++,{});
      o.x=left?px[y]-1:px[y]+2;o.y=y;o.dir=left?1:3;set(o.x,o.y,FL);m.objs.push(o);
    }
    // 道具
    for(const b of m.blobs){
      if(iid>=(cell.branch?3:2))break;
      const xx=b[0]+(b[0]<px[b[1]]?-(b[2]-1):(b[2]-1)),yy=b[1];
      if(Math.abs(xx-px[yy])<3||xx<2||xx>29||get(xx,yy)===T.WATER||occupied(m,xx,yy))continue;
      set(xx,yy,FL);m.objs.push({k:'item',iid:iid++,x:xx,y:yy,item:itemFor(r,cell.prog,false)});
    }
    const sx=px[2]-2;set(sx,2,T.SIGN);m.signs[sx+',2']=routeSign(cell);
  }
  m.exits=[1,0,1,0];
  if(!cell.vert){transposeMap(m);m.exits=[0,1,0,1];}
  m.enc={rate:8};
  return m;
}

/* ---------- 原野・洞くつ・ダンジョンの階 ---------- */
function ladderPos(cell,f){const r=RNG('lad'+cell.key+':'+f);return{x:r.range(4,26),y:r.range(4,26)};}
function downPos(cell,f){
  const u=ladderPos(cell,f),r=RNG('ladd'+cell.key+':'+f);
  let x=clamp(30-u.x+r.range(-3,3),4,26),y=clamp(30-u.y+r.range(-3,3),4,26);
  if(Math.abs(x-u.x)+Math.abs(y-u.y)<9){x=(u.x+11)%23+4;y=(u.y+9)%23+4;}
  return{x,y};
}
const floorType=(cell,f)=>(cell.kind==='dung'&&f===cell.nF-1&&cell.style!=='road')?'hall':'cave';
const floorId=(cell,f)=>cell.key+(f?':f'+f:'');
function genWild(cell,o){
  o=o||{};const f=o.f||0,id=floorId(cell,f),r=RNG('map'+id),cave=cell.pal==='cave';
  const WALL=cave?T.ROCK:T.TREE,FL=cave?T.CFLOOR:T.GRASS,PT=cave?T.CFLOOR:T.PATH;
  const m=newMap(id,cell,MW,MH,WALL),t=m.t,br=carver(m,FL,PT,WALL);
  const exits=o.exits||cell.ex;m.exits=exits.slice();
  let tid=0,iid=0,any=false;const tspots=[];
  for(let d=0;d<4;d++){
    if(!exits[d])continue;any=true;
    const a=r.range(3,5),b=r.range(9,11),nu=r.range(7,23);
    const P=[[15,0],[15,a],[nu,a],[nu,b],[15,b],[15,14]].map(p=>AT[d](p[0],p[1]));
    for(let i=0;i<P.length-1;i++)carveLine(br,P[i][0],P[i][1],P[i+1][0],P[i+1][1]);
    const q=AT[d](nu,(a+b)>>1);tspots.push(d%2===0?{x:q[0]-1,y:q[1],dir:1}:{x:q[0],y:q[1]-1,dir:2});
  }
  if(any)for(let y=12;y<=19;y++)for(let x=12;x<=19;x++)if(t[y*MW+x]===WALL)t[y*MW+x]=FL;
  // はしごをつなぐ
  const lads=o.ladders||[],keys=[];
  if(lads.length>1)keys.push([lads[1].x,lads[1].y]);
  if(any)keys.push([15,15]);
  if(lads.length)keys.push([lads[0].x,lads[0].y]);
  if(!any&&lads.length===1)keys.push([r.range(6,24),r.range(6,24)]);
  for(let i=0;i<keys.length-1;i++){
    const A=keys[i],B=keys[i+1],Wp=[r.range(4,26),r.range(4,26)];
    for(const seg of [[A,Wp],[Wp,B]]){const p=seg[0],q=seg[1];
      if(r.chance(0.5)){carveLine(br,p[0],p[1],q[0],p[1]);carveLine(br,q[0],p[1],q[0],q[1]);}
      else{carveLine(br,p[0],p[1],p[0],q[1]);carveLine(br,p[0],q[1],q[0],q[1]);}
      tspots.push({x:Wp[0],y:Wp[1]-1,dir:2});
    }
  }
  // 広場・草むら・行き止まり
  const fl=[];for(let y=3;y<29;y++)for(let x=3;x<29;x++){const v=t[y*MW+x];if(v===FL||v===PT)fl.push([x,y]);}
  if(fl.length)for(let i=0,n=r.range(5,8);i<n;i++){
    const an=r.pick(fl),cx=clamp(an[0]+r.range(-5,5),4,27),cy=clamp(an[1]+r.range(-5,5),4,27),rx=r.range(2,4),ry=r.range(2,3),tall=!cave&&r.chance(0.85);
    let x=an[0],y=an[1];while(x!==cx||y!==cy){if(x!==cx)x+=Math.sign(cx-x);else y+=Math.sign(cy-y);if(t[y*MW+x]===WALL)t[y*MW+x]=FL;}
    blobFill(m,cx,cy,rx,ry,(xx,yy)=>{const j=yy*MW+xx;if(t[j]===WALL||t[j]===FL)t[j]=tall&&r.chance(0.8)?T.TALL:FL;});
    m.blobs.push([cx,cy,rx,ry]);
  }
  if(!cave){
    for(let i=0;i<5;i++){const an=r.pick(fl);for(let yy=an[1]-1;yy<=an[1]+1;yy++)for(let xx=an[0]-1;xx<=an[0]+2;xx++){
      if(xx<3||yy<3||xx>28||yy>28||(xx>=12&&xx<=19&&yy>=12&&yy<=19))continue;const j=yy*MW+xx;if(t[j]===FL||t[j]===PT)t[j]=T.TALL;}}
    for(let i=0;i<14;i++){const xx=r.range(2,29),yy=r.range(2,29);if(t[yy*MW+xx]===T.GRASS)t[yy*MW+xx]=T.FLOWER;}
    if(m.blobs.length&&r.chance(0.5)){const b=m.blobs[m.blobs.length-1];for(let yy=b[1]-1;yy<=b[1];yy++)for(let xx=b[0]-1;xx<=b[0];xx++){const j=yy*MW+xx;if(t[j]===FL||t[j]===T.TALL)t[j]=T.WATER;}}
  }
  for(const L of lads){t[L.y*MW+L.x]=T.LADDER;m.warps[L.x+','+L.y]=L.to;}
  // トレーナー
  r.shuffle(tspots);
  const nT=Math.min(tspots.length,o.nT!=null?o.nT:r.range(2,3));
  for(let i=0;i<nT;i++){
    const s=tspots[i];if(s.x<1||s.y<1||s.x>30||s.y>30||occupied(m,s.x,s.y))continue;
    const j=s.y*MW+s.x;if(t[j]===T.LADDER||SOLID[t[j]])continue;
    const grunt=o.grunt||(cell.main>=5&&cell.main<49&&cell.kind==='wild'&&i===0);
    const tr=genTrainer(r,cell,tid++,{grunt,elite:o.elite,bonus:(o.bonus||0)});
    tr.x=s.x;tr.y=s.y;tr.dir=s.dir;m.objs.push(tr);
  }
  // 道具
  for(const b of m.blobs){
    if(iid>=(o.nI!=null?o.nI:2))break;
    const j=b[1]*MW+b[0];if(SOLID[t[j]]||t[j]===T.LADDER||occupied(m,b[0],b[1]))continue;
    const rich=cell.kind==='dung'&&iid===0;
    m.objs.push({k:'item',iid:iid++,x:b[0],y:b[1],item:itemFor(r,cell.prog,rich)});
  }
  if(any&&!cave&&f===0){const j=11*MW+11;if(t[j]===WALL||t[j]===FL){t[j]=T.SIGN;m.signs['11,11']=routeSign(cell);}}
  m.enc={rate:cave?14:8,bonus:f};
  return m;
}
function genFloor(cell,f){
  const last=cell.nF-1;
  if(floorType(cell,f)==='hall')return genHall(cell,f);
  const ex=[0,0,0,0];
  for(let d=0;d<4;d++){if(!cell.ex[d])continue;if(cell.onward===d){if(f===last)ex[d]=1;}else if(f===0)ex[d]=1;}
  const lad=[];
  if(f<last){const u=ladderPos(cell,f),dst=floorType(cell,f+1)==='hall'?hallLadder(cell):downPos(cell,f+1);lad.push({x:u.x,y:u.y,to:{map:floorId(cell,f+1),x:dst.x,y:dst.y}});}
  if(f>0){const dn=downPos(cell,f),u=ladderPos(cell,f-1);lad.push({x:dn.x,y:dn.y,to:{map:floorId(cell,f-1),x:u.x,y:u.y}});}
  const road=cell.style==='road';
  return genWild(cell,{f,exits:ex,ladders:lad,elite:road,grunt:cell.style==='shrine',nT:road?3:2,nI:2,bonus:f});
}
const hallLadder=cell=>({x:15,y:cell.onward===2?4:27});
function genHall(cell,f){
  const id=floorId(cell,f),m=newMap(id,cell,MW,MH,T.ROCK),flip=cell.onward===2;
  m.pal='cave';
  const set=(x,y,v)=>{m.t[(flip?MH-1-y:y)*MW+x]=v;};
  const Y=y=>flip?MH-1-y:y;
  for(let y=4;y<=28;y++)for(let x=11;x<=20;x++)set(x,y,T.CFLOOR);
  for(let y=9;y<=26;y++){set(15,y,T.RUG);set(16,y,T.RUG);}
  for(let x=14;x<=17;x++)set(x,5,T.ALTAR);
  set(11,4,T.STATUE);set(20,4,T.STATUE);set(11,28,T.STATUE);set(20,28,T.STATUE);
  set(15,27,T.LADDER);const u=ladderPos(cell,f-1);m.warps['15,'+Y(27)]={map:floorId(cell,f-1),x:u.x,y:u.y};
  const spots=[[15,7],[12,7],[19,7]];
  const lv=clamp(Math.max(30,cell.lv+6),30,70);
  cell.legends.forEach((sp,i)=>{
    const s=spots[i%3];
    m.objs.push({k:'legend',sp,lv:sp===SP_OWARI?60:sp===SP_HAJIMARI?70:lv,x:s[0],y:Y(s[1]),needFlag:sp===SP_OWARI?'s:boss':sp===SP_HAJIMARI?'champ':null});

function townBuildings(cell){

    if(cell.size!=='village'||cell.main===0||r.chance(0.5))kinds.push('shop');
    if(cell.gym)kinds.push('gym');
    if(cell.special)for(const s of cell.special)kinds.push(s);
    const n=cell.size==='village'?r.range(2,3):cell.size==='town'?r.range(4,5):r.range(6,8);
    for(let i=0;i<n;i++)kinds.push('house');

    const p=id.split(':'),cell=CELLS[p[0]];

const MSG_H=56;
function msg(str,opt){

    const w={type:'msg',pages,pi:0,ci:0,hold:0,
      len(){let n=0;for(const l of this.pages[this.pi])n+=l.length;return n;},
      next(){if(this.ci<this.len()){this.ci=this.len();return;}
        if(this.pi<this.pages.length-1){this.pi++;this.ci=0;sfx('sel');}else{popW(this);if(!opt.silent)sfx('sel');res();}},

// 選択メニュー。戻り値: 選んだ番号 / キャンセルは -1
function menu(items,opt){

  const rowsAll=Math.ceil(items.length/opt.cols);
  const rows=opt.rows?Math.min(opt.rows,rowsAll):rowsAll;

  if(opt.y+h>LH)opt.y=Math.max(0,LH-h);
  return new Promise(res=>{
    const w={type:'menu',items,i:clamp(opt.idx,0,Math.max(0,items.length-1)),top:0,
      key(k){
        const n=items.length;if(!n){if(k==='b'||k==='a'){popW(this);res(-1);}return;}

function setupInput(){

  const btn=(id,k)=>{const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();el.classList.add('on');if(k==='m'||k==='c')press(k);else setHeld(k,1);});

    else if(sw.moved)setDir(-1);
  });
  const swUp=e=>{if(!sw||e.pointerId!==sw.id)return;if(sw.moved)setDir(-1);else{press('a');}sw=null;};
  cv.addEventListener('pointerup',swUp);cv.addEventListener('pointercancel',swUp);
  document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

}

/* ---------- メインループ ---------- */

  const top=UI[UI.length-1];
  if(top){let k;while((k=pressQ.shift())){const w=UI[UI.length-1];if(w&&w.key)w.key(k);}const w2=UI[UI.length-1];if(w2&&w2.update)w2.update();}
  if(G.scene==='world')worldTick(!top&&!G.busy);
  else if(G.scene==='title'&&!top)pressQ.length=0;

function render(){

let lastTs=0,acc=0;

function h2(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul((s|0)+7,1274126177);h=Math.imul(h^h>>>13,1103515245);return((h^h>>>16)>>>0)/4294967296;}
const pmod=(a,n)=>((a%n)+n)%n;
const wind=(t,x,y)=>Math.sin(t*0.023+x*0.011+y*0.019)*0.65+Math.sin(t*0.051+x*0.027-y*0.013)*0.35;

function atlas(cols,rows,cw,ch,draw){
  const c=document.createElement('canvas');c.width=cols*cw*K;c.height=rows*ch*K;const g=c.getContext('2d');
  for(let r=0;r<rows;r++)for(let i=0;i<cols;i++){g.save();g.setTransform(K,0,0,K,i*cw*K,r*ch*K);g.beginPath();g.rect(0,0,cw,ch);g.clip();g.lineCap='round';g.lineJoin='round';draw(g,i,r);g.restore();}
  c.cw=cw;c.ch=ch;return c;
}
function blit(g,c,i,r,x,y){const w=c.cw*K,h=c.ch*K;g.drawImage(c,i*w,r*h,w,h,x,y,c.cw,c.ch);}
// セル塗り：ペン線→ベタ→右下に影
function celP(g,mk,base,shade,iw,ox,oy){
  const p=new Path2D();mk(p);
  if(iw){g.save();g.translate(0.1,0.13);g.strokeStyle=SINK;g.lineWidth=iw;g.lineJoin='round';g.stroke(p);g.restore();}
  g.fillStyle=base;g.fill(p);
  if(shade){g.save();g.clip(p);g.fillStyle=shade;g.fillRect(-90,-90,180,180);g.translate(ox==null?-1:ox,oy==null?-1.2:oy);g.fillStyle=base;g.fill(p);g.restore();}
  return p;
}

/* ---------- ふちがゆらぐマス（道・砂・水・岩） ---------- */
const EC=[[0,0],[16,0],[16,16],[0,16]],ED=[[1,0],[0,1],[-1,0],[0,-1]],EN=[[0,1],[-1,0],[0,-1],[1,0]];
function edgeShape(mask,seed,ins,amp,r){
  const q=RNG(seed),fill=new Path2D(),line=new Path2D(),pts=[],I=typeof ins==='number'?[ins,ins,ins,ins]:ins;
  const con=s=>(mask>>s)&1,pt=(s,t,d)=>[EC[s][0]+ED[s][0]*t+EN[s][0]*d,EC[s][1]+ED[s][1]*t+EN[s][1]*d];
  let first=true,open=false;
  const go=a=>{if(first){fill.moveTo(a[0],a[1]);first=false;}else fill.lineTo(a[0],a[1]);};
  for(let s=0;s<4;s++){
    const pv=(s+3)%4,nx=(s+1)%4;
    if(con(s)){if(con(pv))go(EC[s]);open=false;continue;}
    const t0=con(pv)?0:I[pv]+r,t1=con(nx)?16:16-I[nx]-r,n=4,W=[];
    for(let k=0;k<=n;k++)W.push(pt(s,t0+(t1-t0)*k/n,(k===0||k===n)?I[s]:I[s]+(q()-0.5)*2*amp));
    go(W[0]);if(!open){line.moveTo(W[0][0],W[0][1]);open=true;}
    for(let k=1;k<n;k++){const m=k===n-1?W[n]:[(W[k][0]+W[k+1][0])/2,(W[k][1]+W[k+1][1])/2];fill.quadraticCurveTo(W[k][0],W[k][1],m[0],m[1]);line.quadraticCurveTo(W[k][0],W[k][1],m[0],m[1]);pts.push([m[0],m[1],s]);}
    if(!con(nx)){const c=pt(s,16-I[nx],I[s]),e=pt(nx,I[s]+r,I[nx]);fill.quadraticCurveTo(c[0],c[1],e[0],e[1]);line.quadraticCurveTo(c[0],c[1],e[0],e[1]);}
  }
  fill.closePath();
  return{fill,line,pts};
}

const GVW=[0,0,7,7,0,1,1,2,7,3,4,5,6,1,0,2];
function mkGround(P){
  const cave=!!P.cave,b=cave?P.cf:P.g,d=cave?P.cf2:P.g2;

    }

    const n=[0,1,2,3,1,1,1,0][v];
    for(let i=0;i<n;i++){const x=3+q()*9,y=5.5+q()*8,c=q()<0.65?d:lite(b,0.25);blade(x,y,1.8+q(),-0.6,c);blade(x+0.7,y,2.3+q(),0.15,c);if(q()<0.6)blade(x+1.4,y,1.6+q()*0.6,0.8,c);}

    if(v===5){const x=5+q()*6,y=6+q()*5;g.fillStyle=lite(b,-0.3);g.beginPath();g.ellipse(x+0.2,y+0.5,1.4,0.7,0,0,6.3);g.fill();g.fillStyle='#b9b4a6';g.beginPath();g.ellipse(x,y,1.3,0.9,0,0,6.3);g.fill();g.strokeStyle=SINK;g.lineWidth=0.22;g.beginPath();g.arc(x,y,1.25,0.4,2.9);g.stroke();g.fillStyle='#dcd8cc';g.beginPath();g.ellipse(x-0.3,y-0.3,0.5,0.25,0,0,6.3);g.fill();}
    if(v===6){for(let i=0;i<2;i++){const x=4+q()*8,y=4+q()*8;g.fillStyle='#fffdf0';for(let k=0;k<4;k++){g.beginPath();g.arc(x+Math.cos(k*1.571)*0.5,y+Math.sin(k*1.571)*0.5,0.36,0,6.3);g.fill();}g.fillStyle='#f4c53a';g.beginPath();g.arc(x,y,0.26,0,6.3);g.fill();}}
    if(v===7){g.fillStyle=lite(b,-0.05);g.beginPath();g.ellipse(5+q()*6,6+q()*5,2.4,1,0.2,0,6.3);g.fill();}

}
function mkBlobs(P){

function mkEdge(P,kind){
  const sand=kind==='sand',col=sand?P.sand:P.path,col2=sand?P.sand2:P.path2,I=sand?1.8:2.2;
  return atlas(16,3,16,16,(g,mask,row)=>{
    if(row===2){ // 内がわの角を丸める草の切れこみ（0:北西 1:北東 2:南東 3:南西）
      if(mask>3)return;
      g.translate(8,8);g.rotate(mask*Math.PI/2);g.translate(-8,-8);
      g.fillStyle=P.g;g.beginPath();g.moveTo(0,0);g.lineTo(I,0);g.quadraticCurveTo(I,I,0,I);g.closePath();g.fill();
      g.strokeStyle=lite(col,-0.4);g.lineWidth=0.42;g.beginPath();g.moveTo(I,0);g.quadraticCurveTo(I,I,0,I);g.stroke();return;
    }

    g.fillStyle=col;g.fill(sh.fill);

    if(sand){g.strokeStyle=col2;g.lineWidth=0.24;for(let i=0;i<2;i++){const x=3+q()*7,y=3+q()*10;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+1.5,y-0.7,x+3,y);g.stroke();}
      g.fillStyle=col2;for(let i=0;i<5;i++){g.beginPath();g.arc(2+q()*12,2+q()*12,0.2,0,6.3);g.fill();}}
    else{g.fillStyle=col2;for(let i=0;i<5;i++){g.beginPath();g.ellipse(2.5+q()*11,2.5+q()*11,0.35+q()*0.35,0.25+q()*0.2,0,0,6.3);g.fill();}
      g.strokeStyle=lite(col2,-0.22);g.lineWidth=0.18;for(let i=0;i<2;i++){const x=3+q()*9,y=3+q()*10;g.beginPath();g.moveTo(x,y);g.lineTo(x+1.2+q(),y+0.3);g.stroke();}}
    g.strokeStyle=lite(col,-0.12);g.lineWidth=2;g.stroke(sh.line);      // ふちのかげり
    g.restore();
    g.strokeStyle=lite(col,-0.42);g.lineWidth=0.42;g.stroke(sh.line);
    for(const p of sh.pts){for(let k=0;k<2;k++){            // 草が道にかぶさる
      const x=p[0]+(q()-0.5)*2.6,y=p[1]+(q()-0.3)*1.2+(p[2]===2?0.9:0);if(x<0.9||x>15.1||y<3||y>15.6){q();q();q();continue;}
      g.strokeStyle=q()<0.5?P.g2:lite(P.g,q()<0.5?0.18:-0.04);g.lineWidth=0.4;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+0.2,y-1.2,x+(q()-0.5)*1.4,y-2-q()*0.8);g.stroke();}}
  });
}
function mkWater(P){
  const foam=lite(P.w2,0.45),deep=lite(P.w1,-0.12);
  return atlas(16,7,16,16,(g,mask,row)=>{
    if(row>3){ // 岸の出っぱりの角（4:草 5:砂 6:洞くつの床）
      if(mask>3)return;const I=1.8,bc=row===4?P.g:row===5?P.sand:P.cf;
      g.translate(8,8);g.rotate(mask*Math.PI/2);g.translate(-8,-8);
      g.fillStyle=lite(P.w1,0.16);g.beginPath();g.moveTo(0,0);g.lineTo(4.7,0);g.quadraticCurveTo(4.7,4.7,0,4.7);g.closePath();g.fill();
      g.strokeStyle=foam;g.lineWidth=2.6;g.globalAlpha=0.85;g.beginPath();g.moveTo(I,0);g.quadraticCurveTo(I,I,0,I);g.stroke();g.globalAlpha=1;
      g.fillStyle=bc;g.beginPath();g.moveTo(0,0);g.lineTo(I,0);g.quadraticCurveTo(I,I,0,I);g.closePath();g.fill();
      g.strokeStyle=lite(P.w1,-0.5);g.lineWidth=0.4;g.beginPath();g.moveTo(I,0);g.quadraticCurveTo(I,I,0,I);g.stroke();return;
    }
    const v=row>>1,fr=row&1,sh=edgeShape(mask,'wt'+v+':'+mask,[2.2,1.7,1.3,1.7],0.8,4.6),q=RNG('wtx'+v+':'+mask);
    g.strokeStyle='rgba(40,30,60,0.28)';g.lineWidth=2.4;g.stroke(sh.line);      // 岸のかげ
    g.fillStyle=P.w1;g.fill(sh.fill);
    g.save();g.clip(sh.fill);
    g.strokeStyle=lite(P.w1,0.16);g.lineWidth=5.5;g.stroke(sh.line);            // 浅瀬
    const o=fr?2.2:0;
    g.strokeStyle=P.w2;g.lineWidth=0.42;
    for(let i=0,n=mask===15?v*2:1+v;i<n;i++){const x=3.4+q()*7.2+o,y=3+q()*10,w=1.2+q()*0.8;g.beginPath();g.moveTo(x-w,y);g.quadraticCurveTo(x-w/2,y-0.8,x,y);g.quadraticCurveTo(x+w/2,y+0.8,x+w,y);g.stroke();}
    g.strokeStyle=deep;g.lineWidth=0.26;
    for(let i=0;i<1+v;i++){const x=3+q()*9+o*0.6,y=3+q()*10;g.beginPath();g.moveTo(x-1,y);g.quadraticCurveTo(x,y+0.6,x+1,y);g.stroke();}
    g.strokeStyle=foam;g.lineWidth=fr?1.5:2.3;g.globalAlpha=fr?0.95:0.8;if(fr)g.setLineDash([2.6,1.1]);g.stroke(sh.line);g.setLineDash([]);g.globalAlpha=1;   // 波うちぎわ
    g.restore();
    g.strokeStyle=lite(P.w1,-0.5);g.lineWidth=0.4;g.stroke(sh.line);
  });
}
function rockTex(g,q,top,hi,v){
  if(v===1){g.strokeStyle=lite(top,-0.3);g.lineWidth=0.28;const x=4+q()*6,y=2.5+q()*3;g.beginPath();g.moveTo(x,y);g.lineTo(x+1.5,y+1.5);g.lineTo(x+0.8,y+2.8);g.lineTo(x+2.2,y+3.8);g.stroke();}
  else if(v===2){g.fillStyle=hi;g.globalAlpha=0.5;g.beginPath();g.ellipse(5+q()*6,3.5+q()*3,2.6,1.1,-0.3,0,6.3);g.fill();g.globalAlpha=1;}
  else if(v===3){for(let i=0;i<2;i++){const x=4+q()*8,y=3+q()*4.5;g.fillStyle=hi;g.beginPath();g.ellipse(x,y,0.8,0.55,0,0,6.3);g.fill();g.strokeStyle=lite(top,-0.35);g.lineWidth=0.2;g.beginPath();g.arc(x,y,0.8,0.3,2.8);g.stroke();}}
}
function mkRock(P){
  const cave=!!P.cave,top=cave?lite(P.rock2,-0.1):P.rock,hi=cave?lite(P.rock2,0.14):P.rock3,face=cave?P.rock:P.rock2,flo=lite(face,-0.26),fhi=lite(face,0.16);
  return atlas(16,3,16,16,(g,mask,row)=>{
    const q=RNG('rk'+row+':'+mask);
    if(row===2){g.fillStyle=top;g.fillRect(0,0,16,16);if(mask<8)rockTex(g,q,top,hi,mask%4);return;}   // 岩場の内がわ
    const S=!(mask&4),sh=edgeShape(mask,'rks'+row+':'+mask,[1,1,S?6.8:0,1],0.55,2.4);
    if(S){ // 手前のがけ
      const xl=(mask&8)?0:1.3,xr=(mask&2)?16:14.7,yb=15.4,bp=[];for(let x=12;x>=4;x-=4)bp.push([x,yb+(q()-0.5)*0.7]);
      const fp=new Path2D();fp.moveTo(xl,7.5);fp.lineTo(xr,7.5);fp.lineTo(xr,yb);for(const b of bp)fp.lineTo(b[0],b[1]);fp.lineTo(xl,yb);fp.closePath();
      g.fillStyle=face;g.fill(fp);
      g.save();g.clip(fp);
      g.fillStyle=flo;g.fillRect(0,13.3,16,3);g.fillStyle=fhi;g.fillRect(0,9.6,16,0.8);
      g.strokeStyle=flo;g.lineWidth=0.3;
      for(let i=0;i<3;i++){const x=2+q()*12;g.beginPath();g.moveTo(x,10.4+q()*1.2);g.lineTo(x+(q()-0.5)*1.2,12.2+q());g.lineTo(x+(q()-0.5)*1.5,14.6+q());g.stroke();}
      g.restore();
      g.strokeStyle=SINK;g.lineWidth=0.5;g.beginPath();
      if(!(mask&2)){g.moveTo(xr,8.5);g.lineTo(xr,yb);}else g.moveTo(xr,yb);
      for(const b of bp)g.lineTo(b[0],b[1]);g.lineTo(xl,yb);if(!(mask&8))g.lineTo(xl,8.5);g.stroke();
    }
    g.fillStyle=top;g.fill(sh.fill);
    g.save();g.clip(sh.fill);rockTex(g,q,top,hi,(row*2+(mask&1)+(mask>>3))%4);
    g.strokeStyle=hi;g.lineWidth=1.7;g.stroke(sh.line);g.restore();
    g.strokeStyle=SINK;g.lineWidth=0.55;g.stroke(sh.line);
  });
}
function mkFlowers(P){

  });
}
/* ---------- 草むら（奥と手前の2層・風で3コマゆれる） ---------- */
const TGX=3,TGY=8;

/* ---------- 木・岩・柱（マスより大きく、重なりあう） ---------- */

function effStat(B,s,i){
  const m=bmon(B,s),st=bstg(B,s);let v=Math.floor(stat(m,i)*stgMul(st[STKEY[i]]));
  const ab=abilOf(m);
  if(i===1){if(m.st&&ab===12)v=Math.floor(v*1.5);else if(m.st==='brn')v=Math.floor(v/2);}
  if(i===5&&m.st==='par')v=Math.floor(v/4);
  return Math.max(1,v);
}
function calcDamage(B,s,mv,crit,eff){
  const a=bmon(B,s),d=bmon(B,1-s),asp=SP[a.sp];
  const A=mv.phys?effStat(B,s,1):effStat(B,s,3),D=mv.phys?effStat(B,1-s,2):effStat(B,1-s,4);
  let pw=mv.pow;if(mv.has('pinch')&&a.hp*3<=maxHP(a))pw*=2;if(mv.has('hex')&&d.st)pw*=2;
  let dmg=Math.floor(Math.floor(Math.floor(2*a.lv/5+2)*pw*A/D)/50)+2;
  if(crit)dmg*=2;else if(B.wall[1-s][mv.phys?0:1]>0)dmg=Math.floor(dmg/2);          // 光の壁（急所には きかない）
  if(B.weather==='sun'){if(mv.type===1)dmg=Math.floor(dmg*1.5);else if(mv.type===2)dmg=Math.floor(dmg/2);}
  else if(B.weather==='rain'){if(mv.type===2)dmg=Math.floor(dmg*1.5);else if(mv.type===1)dmg=Math.floor(dmg/2);}
  if(mv.type>=0){
    if(asp.types.indexOf(mv.type)>=0)dmg=Math.floor(dmg*1.5);
    dmg=Math.floor(dmg*eff);
    if(abilOf(a)===0&&mv.type===asp.types[0]&&a.hp*3<=maxHP(a))dmg=Math.floor(dmg*1.5);
    if(abilOf(d)===8&&(mv.type===1||mv.type===5))dmg=Math.floor(dmg/2);
  }
  return Math.max(1,Math.floor(dmg*(85+ri(16))/100));
}
async function hpAnim(B,s){const from=B.hpShow[s],to=bmon(B,s).hp;if(from===to)return;await tween(Math.min(600,160+Math.abs(from-to)*12),p=>{B.hpShow[s]=from+(to-from)*p;});B.hpShow[s]=to;}
async function hitAnim(B,s,eff){

  for(let i=0;i<3;i++){B.fx[k]=1;await sleep(45);B.fx[k]=0;await sleep(45);}
}

  for(let i=0;i<8;i++)P({s:'smoke:255,255,255',x:T.x+rnd(-18,18),y:T.y+rnd(0,22),vy:-rnd(0.3,1),r:rnd(5,10),dr:0.3,life:Math.round(rnd(16,28)),a:0.7});

async function inflict(B,s,st,verbose){
  const m=bmon(B,s),n=bname(B,s),ty=SP[m.sp].types;
  if(m.hp<=0)return false;
  if(m.st){if(verbose)await say('しかし こうかが なかった！');return false;}
  if(abilOf(m)===18||(st==='brn'&&ty.indexOf(1)>=0)||(st==='frz'&&ty.indexOf(5)>=0)||(st==='psn'&&(ty.indexOf(7)>=0||ty.indexOf(16)>=0))){
    if(verbose)await say(n+'には こうかが ないようだ…');return false;}
  m.st=st;if(st==='slp')m.sc=rr(1,3);
  statusFx(s,st);sfx('weak');
  await say(n+({psn:'は どくを うけた！',brn:'は やけどを おった！',par:'は からだが しびれた！',slp:'は ねむってしまった！',frz:'は こおりついた！'})[st]);
  return true;
}
async function boost(B,s,key,n){
  const st=bstg(B,s),nm=bname(B,s);
  if(bmon(B,s).hp<=0)return;
  if((n>0&&st[key]>=6)||(n<0&&st[key]<=-6)){await say(nm+'の '+STAGE_JP[key]+'は もう '+(n>0?'上がらない':'下がらない')+'！');return;}
  st[key]=clamp(st[key]+n,-6,6);
  stageFx(s,key,n>0);sfx(n>0?'lvup':'cancel');
  await say(nm+'の '+STAGE_JP[key]+'が '+(n>=2?'ぐんと 上がった！':n===1?'上がった！':n===-1?'下がった！':'がくんと 下がった！'));
}
async function applyEffects(B,sd,mv,isStatus,selfOnly){
  for(const e of mv.eff){
    if(e.k==='st'){
      if(selfOnly||ri(100)>=e.ch)continue;
      if(e.st==='flinch')bstg(B,1-sd).flinch=true;
      else if(e.st==='cnf'){
        const ts=bstg(B,1-sd);
        if(bmon(B,1-sd).hp<=0)continue;
        if(ts.conf>0){if(isStatus)await say('しかし こうかが なかった！');}
        else{ts.conf=rr(2,5);statusFx(1-sd,'cnf');await say(bname(B,1-sd)+'は こんらんした！');}
      }else await inflict(B,1-sd,e.st,isStatus);
    }else if(e.k==='stage'){
      if(ri(100)>=e.ch)continue;
      if(e.who==='self')await boost(B,sd,e.stat,e.n);else if(!selfOnly)await boost(B,1-sd,e.stat,e.n);
    }else if(e.k==='heal'){
      const u=bmon(B,sd),mx=maxHP(u);
      if(u.hp>=mx)await say('しかし HPは まんたんだ！');
      else{u.hp=Math.min(mx,u.hp+Math.floor(mx/2));sfx('heal');healFx(sd);await hpAnim(B,sd);await say(bname(B,sd)+'の たいりょくが 回復した！');}
    }else if(e.k==='protect'){
      const st=bstg(B,sd);if(ri(1<<Math.min(3,st.protN))===0){st.prot=true;st.protN++;await say(bname(B,sd)+'は 守りの かまえに 入った！');}else{st.protN=0;await say('しかし うまく きまらなかった！');}
    }else if(e.k==='seed'){
      const ts=bstg(B,1-sd),tm=bmon(B,1-sd);if(selfOnly||tm.hp<=0)continue;
      if(ts.seed||SP[tm.sp].types.indexOf(4)>=0)await say('しかし こうかが なかった！');else{ts.seed=true;await say(bname(B,1-sd)+'に タネを うえつけた！');}
    }else if(e.k==='wx'){
      if(B.weather===e.w)await say('しかし 天気は 変わらなかった！');else{B.weather=e.w;B.wT=5;flashFx(e.w==='sun'?'255,210,90':e.w==='rain'?'90,130,220':e.w==='sand'?'220,180,110':'220,240,255',0.4);await say(WX_ON[e.w]);}
    }else if(e.k==='wall'){
      if(B.wall[sd][e.c]>0)await say('しかし すでに 壁が ある！');else{B.wall[sd][e.c]=5;const T=fxPos(sd);ring(T.x,T.y,e.c?'200,160,255':'255,220,140',{dr:3,w:3,life:22,max:22});await say((sd?'相手':'味方')+'は '+(e.c?'特殊':'物理')+'に 強い 光の壁に つつまれた！');}
    }else if(e.k==='haze'){
      for(const s2 of [0,1]){const st=bstg(B,s2);for(const k of ['atk','def','spa','spd','spe','acc','eva'])st[k]=0;}await say('すべての 能力の変化が もとに もどった！');
    }else if(e.k==='belly'){
      const u=bmon(B,sd),mx=maxHP(u),st=bstg(B,sd);
      if(u.hp*2<=mx||st.atk>=6)await say('しかし うまく きまらなかった！');else{u.hp-=Math.floor(mx/2);await hpAnim(B,sd);st.atk=6;stageFx(sd,'atk',true);sfx('lvup');await say(bname(B,sd)+'は 体力を けずって こうげきを 最大まで 高めた！');}
    }else if(e.k==='cure'){
      const u=bmon(B,sd);if(!u.st)await say('しかし こうかが なかった！');else{u.st=null;healFx(sd);sfx('heal');await say(bname(B,sd)+'の 状態異常が なおった！');}
    }else if(e.k==='rest'){
      const u=bmon(B,sd),mx=maxHP(u);if(u.hp>=mx)await say('しかし HPは まんたんだ！');else{u.hp=mx;u.st='slp';u.sc=2;sfx('heal');healFx(sd);await hpAnim(B,sd);await say(bname(B,sd)+'は ねむって 元気に なった！');}
    }else if(e.k==='split'){
      const u=bmon(B,sd),t=bmon(B,1-sd);if(selfOnly||t.hp<=0)continue;const av=Math.floor((u.hp+t.hp)/2);u.hp=Math.min(maxHP(u),av);t.hp=Math.min(maxHP(t),av);await hpAnim(B,sd);await hpAnim(B,1-sd);await say('おたがいの 体力を 分けあった！');
    }else if(e.k==='focus'){
      const st=bstg(B,sd);if(st.focus)await say('しかし こうかが なかった！');else{st.focus=true;await say(bname(B,sd)+'は ねらいを さだめた！');}
    }
  }
}
function accCheck(B,sd,mv){
  const a=mv.acc*accMul(bstg(B,sd).acc-bstg(B,1-sd).eva)*(abilOf(bmon(B,sd))===14?1.2:1);
  return ri(100)<a;
}
async function useMove(B,sd,idx){
  const u=bmon(B,sd),t=bmon(B,1-sd),us=bstg(B,sd),un=bname(B,sd),tn=bname(B,1-sd);
  if(us.flinch){us.flinch=false;us.rech=false;await say(un+'は ひるんで うごけない！');return;}
  if(us.rech){us.rech=false;await say(un+'は はんどうで うごけない！');return;}
  if(u.st==='slp'){if(u.sc>0){u.sc--;await say(un+'は ぐうぐう ねむっている。');return;}u.st=null;await say(un+'は 目を さました！');}
  if(u.st==='frz'){if(ri(5)===0){u.st=null;await say(un+'の こおりが とけた！');}else{await say(un+'は こおって うごけない！');return;}}
  if(u.st==='par'&&ri(4)===0){await say(un+'は しびれて うごけない！');return;}
  if(us.conf>0){
    us.conf--;
    if(us.conf===0)await say(un+'の こんらんが とけた！');
    else{
      await say(un+'は こんらんしている！');
      if(ri(2)===0){
        const A=effStat(B,sd,1),D=effStat(B,sd,2);
        const d=Math.min(u.hp,Math.max(1,Math.floor((Math.floor(Math.floor(2*u.lv/5+2)*40*A/D)/50+2)*(85+ri(16))/100)));
        await hitAnim(B,sd,1);u.hp-=d;await hpAnim(B,sd);await say('まちがえて 自分を たたいてしまった！');return;
      }
    }
  }
  const mv=idx<0?STRUGGLE:MOVES[u.mv[idx].id];
  if(idx>=0)u.mv[idx].pp=Math.max(0,u.mv[idx].pp-1);
  await say(un+'の '+mv.name+'！');
  const ts=bstg(B,1-sd);if(!mv.has('protect'))us.protN=0;
  if(mv.pow===0){
    const onFoe=mv.eff.some(e=>e.k==='st'||(e.k==='stage'&&e.who==='foe')||e.k==='seed'||e.k==='split');
    if(onFoe&&ts.prot){await say(tn+'は 身を まもった！');return;}
    if(onFoe&&mv.acc>0&&!accCheck(B,sd,mv)){await say('しかし '+tn+'には あたらなかった！');return;}
    await moveFx(B,sd,mv);
    await applyEffects(B,sd,mv,true,false);return;
  }
  if(t.hp<=0)return;
  if(ts.prot){await say(tn+'は 身を まもった！');return;}
  if(mv.acc>0&&!accCheck(B,sd,mv)){await say('しかし こうげきは はずれた！');return;}
  let eff=mv.type>=0?typeEff(mv.type,SP[t.sp].types):1;const ab=abilOf(t);
  if(mv.type===8&&ab===2)eff=0;
  if((mv.type===2&&ab===9)||(mv.type===3&&ab===10)||(mv.type===1&&ab===11)){
    const mx=maxHP(t);t.hp=Math.min(mx,t.hp+Math.floor(mx/4));healFx(1-sd);await hpAnim(B,1-sd);await say(tn+'は 「'+ABIL[ab].n+'」で 技を すいとった！');return;}
  if(eff===0){await say(tn+'には まったく きかない！');return;}
  const fxd=mv.eff.find(e=>e.k==='fixed');
  if(fxd||mv.has('level')||mv.has('halve')){     // 決まった量のダメージ（能力や相性の倍率を 受けない）
    const d0=Math.min(t.hp,fxd?fxd.n:mv.has('level')?u.lv:Math.max(1,Math.floor(t.hp/2)));
    await moveFx(B,sd,mv);await hitAnim(B,1-sd,1);t.hp-=d0;await hpAnim(B,1-sd);await applyEffects(B,sd,mv,false,t.hp<=0);return;
  }
  const hits=mv.has('multi')?[2,2,3,3,4,5][ri(6)]:mv.has('twice')?2:1;
  let dmg=0,nh=0,crit=false,sturdy=false;
  for(let h=0;h<hits&&t.hp>0;h++){
    let c1=false;if(ab!==15){let cr=mv.crit?8:16;if(us.focus)cr/=2;if(abilOf(u)===17)cr/=2;c1=ri(Math.max(1,Math.floor(cr)))===0;}
    let d1=calcDamage(B,sd,mv,c1,eff);
    if(ab===6&&t.hp===maxHP(t)&&d1>=t.hp){d1=t.hp-1;sturdy=true;}
    d1=Math.min(d1,t.hp);
    if(h===0)await moveFx(B,sd,mv);else{const T=fxPos(1-sd);burst('star',T.x+rnd(-9,9),T.y+rnd(-9,9),4,2.2,{r0:2,r1:4,l0:8,l1:14,add:true});slash(T.x+rnd(-8,8),T.y+rnd(-8,8),rnd(-1,2.4),20,'255,250,220',2.6);}
    if(c1){const T=fxPos(1-sd);P({s:'star',x:T.x,y:T.y,r:10,dr:1.4,life:10,add:true});flashFx('255,255,255',0.35);crit=true;}
    await hitAnim(B,1-sd,eff);t.hp-=d1;await hpAnim(B,1-sd);dmg+=d1;nh++;

  if(sturdy)await say(tn+'は 「不屈」で もちこたえた！');
  for(const e of mv.eff){
    if(e.k==='recoil'&&u.hp>0){u.hp=Math.max(0,u.hp-Math.max(1,Math.floor(dmg/4)));await hpAnim(B,sd);await say(un+'は はんどうを うけた！');}
    if(e.k==='drain'&&u.hp>0&&u.hp<maxHP(u)){u.hp=Math.min(maxHP(u),u.hp+Math.max(1,Math.floor(dmg/2)));healFx(sd);await hpAnim(B,sd);await say(tn+'から たいりょくを すいとった！');}
  }
  await applyEffects(B,sd,mv,false,t.hp<=0);
  if(mv.has('rech')&&u.hp>0)us.rech=true;
  if(mv.has('coin')&&sd===0){B.coins+=u.lv*4;await say('お金が あたりに ちらばった！');}
  if(mv.has('boom')&&u.hp>0){u.hp=0;await hpAnim(B,sd);await say(un+'は 力を 使いはたした！');}
  if(t.hp>0&&u.hp>0&&mv.phys&&ri(10)<3){if(ab===3)await inflict(B,sd,'par');else if(ab===4)await inflict(B,sd,'psn');else if(ab===5)await inflict(B,sd,'brn');}
}
function aiPick(B){
  const f=bmon(B,1),me=bmon(B,0),list=[];
  f.mv.forEach((v,i)=>{if(v.pp>0)list.push(i);});
  if(!list.length)return -1;
  if(B.wild&&!B.o.smart)return pick(list);
  let best=list[0],bs=-1;
  for(const i of list){
    const m=MOVES[f.mv[i].id];let sc;
    if(m.pow>0){
      let eff=typeEff(m.type,SP[me.sp].types);if(m.type===8&&abilOf(me)===2)eff=0;
      let pw=m.pow;if(pw===1)pw=m.has('halve')?(me.hp*2>maxHP(me)?70:25):m.has('level')?f.lv*1.1:45;
      if(m.has('multi'))pw*=3;if(m.has('twice'))pw*=2;if(m.has('rech'))pw*=0.62;if(m.has('boom'))pw*=f.hp*3<maxHP(f)?0.8:0.03;if(m.has('pinch')&&f.hp*3<=maxHP(f))pw*=2;if(m.has('hex')&&me.st)pw*=2;
      sc=pw*eff*(SP[f.sp].types.indexOf(m.type)>=0?1.5:1)*(m.acc||100)/100*(m.phys?effStat(B,1,1):effStat(B,1,3))/100;
    }else{
      sc=22;const e=m.eff[0];
      if(e){
        if(e.k==='st'&&e.st!=='cnf'&&me.st)sc=0;
        if(e.k==='st'&&e.st==='cnf'&&B.ps.conf)sc=0;
        if(e.k==='stage'){const s=e.who==='self'?B.fs:B.ps;if(Math.abs(s[e.stat])>=2)sc=2;}
        if(e.k==='heal')sc=f.hp<maxHP(f)/2?80:0;
        if(e.k==='protect')sc=9;if(e.k==='seed')sc=B.ps.seed||SP[me.sp].types.indexOf(4)>=0?0:34;if(e.k==='wx')sc=B.weather===e.w?0:16;if(e.k==='wall')sc=B.wall[1][e.c]>0?0:24;if(e.k==='haze')sc=4;
        if(e.k==='belly')sc=f.hp*2>maxHP(f)&&B.fs.atk<3?26:0;if(e.k==='cure')sc=f.st?60:0;if(e.k==='rest')sc=f.hp*5<maxHP(f)*2?70:0;if(e.k==='split')sc=f.hp*2<me.hp?55:0;if(e.k==='focus')sc=B.fs.focus?0:14;
      }
    }
    sc*=0.8+Math.random()*0.4;if(sc>bs){bs=sc;best=i;}
  }
  return best;
}

async function giveExp(B){
  const foe=bmon(B,1),sp=SP[foe.sp];
  const ps=[...B.parts].filter(i=>S.party[i]&&S.party[i].hp>0);
  // 戦いに出なかった手持ちにも 半分ずつ 入る（せっていで 切りかえ）
  const rest=S.opts.share!==0?S.party.map((m,i)=>i).filter(i=>ps.indexOf(i)<0&&S.party[i].hp>0&&S.party[i].lv<100):[];
  if(!ps.length&&!rest.length)return;
  const base=sp.yield*foe.lv/7*(B.wild?1:1.5),amt=Math.max(1,Math.floor(base/Math.max(1,ps.length)));
  let hi=1;for(let i=2;i<6;i++)if(sp.base[i]>sp.base[hi])hi=i;
  for(const i of ps){
    const m=S.party[i];
    let tot=0;for(const v of m.ev)tot+=v;if(tot<510&&m.ev[hi]<252)m.ev[hi]++;
    await gainExp(m,amt,i===B.pi?B:null);

  if(rest.length){
    await say('ひかえの みんなにも けいけんちが 分けられた！');
    for(const i of rest)await gainExp(S.party[i],Math.max(1,Math.floor(base/2)),null,true);

async function gainExp(m,amt,B,quiet){
  if(m.lv>=100)return;
  m.exp+=amt;if(!quiet)await say(monName(m)+'は '+amt+'の けいけんちを えた！');
  while(m.lv<100&&m.exp>=expFor(SP[m.sp],m.lv+1)){
    const oh=maxHP(m);m.lv++;m.hp+=maxHP(m)-oh;if(B)B.hpShow[0]=m.hp;

async function useItem(id,opt){
  const it=ITEMS[id],B=opt.battle;
  const consume=()=>{S.bag[id]--;if(S.bag[id]<=0)delete S.bag[id];};
  if(it.k==='seal'){if(!B){await msg('野生の アニマとの バトル中に 使おう。');return null;}return{t:'seal',id};}
  if(it.k==='repel'){if(S.repel>0){await msg('まだ 前の ポプリが 効いている。');return null;}S.repel=it.v;consume();await msg('まよけのポプリを ひらいた。しばらく 野生の アニマが 出てこない。');return true;}
  if(it.k==='rope'){
    if(G.map.id.slice(0,2)==='lg'){await msg('ここでは 使えない！');return null;}
    if(!(await confirmYN('最後に 休んだ 宿屋まで もどりますか？')))return null;
    consume();await warpTo(S.heal);return'close';
  }
  if(it.k==='key'){
    if(id==='k_fly'){const r=await flyMenu();return r?'close':null;}
    if(id==='k_map'){await mapScreen();return null;}
    if(id==='k_rod'){await msg('水辺に むかって Aボタンを おすと 釣りが できる。');return null;}
    await msg(it.d);return null;
  }
  const pi=await partyPick({title:it.n+'を だれに 使う？',note:it.k==='tm'?(m=>canLearnTM(m,it.v)?(m.mv.some(v=>v.id===it.v)?'おぼえている':'おぼえられる'):'おぼえられない'):null});
  if(pi<0)return null;
  const m=S.party[pi],n=monName(m);let text=null;
  if(it.k==='heal'){if(m.hp>0&&m.hp<maxHP(m)){const b=m.hp;m.hp=Math.min(maxHP(m),m.hp+it.v);text=n+'の HPが '+(m.hp-b)+' 回復した！';}}
  else if(it.k==='cure'){if(m.hp>0&&m.st&&(it.v==='all'||m.st===it.v)){m.st=null;m.sc=0;text=n+'の 状態異常が 治った！';}}
  else if(it.k==='revive'){if(m.hp<=0){m.hp=Math.floor(maxHP(m)/2);m.st=null;text=n+'は 元気を とりもどした！';}}
  else if(it.k==='pp'){if(m.mv.some(v=>v.pp<MOVES[v.id].pp)){for(const v of m.mv)v.pp=MOVES[v.id].pp;text=n+'の 技の PPが 回復した！';}}
  else if(it.k==='candy'){
    if(m.lv<100){consume();m.exp=Math.max(m.exp,expFor(SP[m.sp],m.lv+1));const oh=maxHP(m);m.lv++;if(m.hp>0)m.hp+=maxHP(m)-oh;sfx('lvup');
      await msg(n+'は レベル'+m.lv+'に 上がった！');await learnMoves(m,m.lv);await checkEvolutions();return true;}
  }else if(it.k==='tm'){
    if(!canLearnTM(m,it.v)){await msg(n+'は この技を おぼえられない。');return null;}
    if(m.mv.some(v=>v.id===it.v)){await msg(n+'は すでに '+MOVES[it.v].name+'を おぼえている。');return null;}
    await teachMove(m,it.v);
    return true;
  }
  if(!text){await msg('使っても 効果が ないよ。');return null;}
  consume();sfx('heal');await msg(text);
  return B?{t:'item'}:true;
}

function interact(){
  const p=G.pl,m=G.map,fx=p.x+DX[p.dir],fy=p.y+DY[p.dir];
  const inb=fx>=0&&fy>=0&&fx<m.W&&fy<m.H,v=inb?m.t[fy*m.W+fx]:-1;
  let o=objAt(fx,fy);
  if(!o&&(v===T.COUNTER||v===T.TABLE))o=objAt(fx+DX[p.dir],fy+DY[p.dir]);
  if(o){run(()=>talk(o));return;}
  if(folVisible()&&FOL.x===fx&&FOL.y===fy){run(folTalk);return;}
  if(v===T.SIGN){const s=m.signs[fx+','+fy];if(s)run(()=>msg(s));return;}
  if(v===T.SHRUB||v===T.CRACK||v===T.BOULDER){run(()=>useTool(v,fx,fy));return;}
  if(v===T.WATER&&!p.surf){run(waterAct);return;}
  if(v===T.PC){run(pcMenu);return;}
  if(v===T.SHELF){run(()=>msg('むずかしそうな 本が ぎっしり ならんでいる。'));return;}
  if(v===T.HEALM){run(()=>msg('ふかふかの 寝床と あたたかい 暖炉。アニマたちが 休む 場所だ。'));return;}
  if(v===T.STATUE){run(()=>msg(m.indoor?'りっぱな アニマの 像だ。':'古い 石像だ。なにかを まもっているようだ。'));return;}
  if(v===T.ALTAR){run(()=>msg(m.id==='lg6'?'歴代の 王者の 名が きざまれている。':'古い 祭壇だ。ふしぎな 気配を 感じる…。'));return;}
}
async function useTool(v,x,y){
  const m=G.map,need=v===T.SHRUB?'k_cut':v===T.CRACK?'k_smash':'k_str';
  const what={k_cut:'茨の しげみ',k_smash:'ひびの 入った 岩',k_str:'大きな 岩'}[need];
  if(!hasItem(need)){await msg(what+'が 道を ふさいでいる。\n「'+ITEMS[need].n+'」が あれば 通れそうだ。');return;}
  sfx('hit');m.t[y*m.W+x]=m.pal==='cave'?T.CFLOOR:T.PATH;m.rn=null;
  await msg({k_cut:'木こりの手斧で 茨を 切りはらった！',k_smash:'岩くだきの槌で 岩を 砕いた！',k_str:'力の籠手で 大岩を 押しのけた！'}[need]);
}
async function waterAct(){
  const surf=hasItem('k_surf'),rod=hasItem('k_rod');
  if(!surf&&!rod){await msg('水が きらきら 光っている。');return;}
  const opts=[];if(surf)opts.push('小舟を 出す');if(rod)opts.push('釣りを する');opts.push('やめる');
  const bg=msgBox('水辺だ。どうする？'),c=await menu(opts,{x:LW-96,y:LH-MSG_H-60,w:90});popW(bg);
  const ch=opts[c];
  if(ch==='小舟を 出す'){const p=G.pl;p.surf=true;p.moving=true;p.spd=2;p.prog=0;folStart();sfx('door');}
  else if(ch==='釣りを する'){
    await msg('つりざおを ふった。……………');
    if(chance(0.6)){const w=wildPick(G.map.cell,'water',0)||waterFallback(G.map.cell);if(w){sfx('alert');await msg('かかった！');await doWild(w,{water:true});return;}}
    await msg('…なにも 釣れなかった。');
  }
}

async function talk(o){

   case'elite':await eliteBattle(o);break;

   case'prof':await profTalk();break;

     await msg('かあさん「'+(S.flags.champ?'おかえり、王者さん！ ':'')+'つかれたでしょう。すこし 休んでいきなさい。」');

  S.flags.dex=1;bagAdd('fuda',5);bagAdd('heal1',3);bagAdd('k_map');sfx('get');
  await msg(S.name+'は 博物誌と 大陸の地図、カンテラ5つ、薬草3つを もらった！');
  await msg('博士「各地の ギルドを めぐり 16の紋章を 集めれば、「栄冠の城」への 道が ひらく。」');
  await msg('博士「それと… 近ごろ 「灰の結社」という 者たちが 旅人の カンテラの 灯を 消して まわっておる。気を つけるのじゃぞ。」');
  saveGame();
}
async function profTalk(){
  if(!S.starter){
    S.flags.prof=1;
    await msg('博士「おお '+S.name+'、まっておったぞ。わしは アニマを 研究しておる ウィックじゃ。」');
    await msg('博士「アニマは 灯りに 心を ひらく 生きものじゃ。「カンテラ」を かかげて 絆を 結ぶと、その灯に やどって 仲間に なってくれる。」');
    await msg('博士「机の上の 5つの カンテラに それぞれ アニマが 宿っておる。話しかけて、1匹 えらびなさい。」');return;
  }
  const seen=countKeys(S.seen),got=countKeys(S.caught);
  await msg('博士「博物誌の 調子は どうじゃ？ 見つけた数 '+seen+'、なかまにした数 '+got+'。'+(got<30?'まだまだ これからじゃな！':got<200?'なかなかの ものじゃ！':got<600?'すばらしい！ 大陸に 名が ひびくぞ！':'信じられん…！ きみこそ 真の アニマ博士じゃ！')+'」');
  if(S.flags.champ)await msg('博士「大陸の 果ての 遺跡に 「ルクス」と よばれる アニマが あらわれた そうじゃ。各地の 遺跡の 守護獣たちも、王者の きみを 待っておるぞ。」');
}
async function ending(){
  await msg('ここは 栄光の間。\n'+S.name+'と アニマたちの 名が 永遠に きざまれた！');
  const bg=pushBG(()=>{ctx.fillStyle='#141020';ctx.fillRect(0,0,LW,LH);tx('王者 '+S.name,120,14,'#f6e8b8',14,'center');
    S.party.forEach((m,i)=>{const x=24+i*52;drawMonUI(m.sp,m.shiny,x,50+Math.sin(G.t/14+i)*4,48);tx(monName(m),x+24,104,'#fff',8,'center');tx('Lv'+m.lv,x+24,116,'#c8c0d8',8,'center');});
    win(0,LH-MSG_H,LW,MSG_H);});
  sfx('lvup');
  await msg('こうして '+S.name+'は ルミエール大陸の 新たな 王者と なった。');
  await msg('だが 博物誌は まだ 道の 途中。まだ 見ぬ アニマたちが 大陸の どこかで 待っている。');
  await msg('アニマ クロニクル　― おわり ―\n（旅は つづく… 各地の 遺跡の 守護獣たちに 会いに行こう）');
  popW(bg);
  S.flags.champ=1;S.party.forEach(healMon);
  await warpTo(homeSpot(),0);S.heal=homeSpot();saveGame();
  await msg('かあさん「おかえりなさい！ 王者に なったんですって？ さすが わたしの 子ね！」');
}

/* ---------- フィールドの描画 ---------- */
const BLD_MARK={heal:'宿',shop:'店',gym:'闘',lab:'研',league:'城',home:'家'};
function drawWorldPix(){
  const m=G.map,p=G.pl,g=wctx;if(!m)return;
  const ppx=p.x*16+(p.moving?DX[p.dir]*p.prog:0),ppy=p.y*16+(p.moving?DY[p.dir]*p.prog:0);
  let camx=Math.round((ppx-112)*K)/K,camy=Math.round((ppy-96)*K)/K;
  if(m.W*16<=LW)camx=Math.round((m.W*16-LW)/2);if(m.H*16<=LH)camy=Math.round((m.H*16-LH)/2);
  G.camx=camx;G.camy=camy;
  drawGround(g,m,camx,camy);
  // 人物と置き物を行ごとにまとめ、木や草むらと奥→手前の順で重ねる
  const byRow={},put=e=>{const r=Math.round(e.y/16);(byRow[r]||(byRow[r]=[])).push(e);};
  const skip={};   // 道具が落ちているマスは手前の草をかぶせない（見つけやすく）
  for(const o of G.objs){if(o.hide)continue;put({o,y:o.y*16+(o.oy||0)});if(o.k==='item')skip[(o.y+16)*64+o.x+16]=1;}
  put({pl:1,y:ppy});
  if(folVisible()){const q=folPos();put({fol:1,y:q[1]});}
  drawRows(g,m,camx,camy,byRow,e=>{
    if(e.fol){drawFollower(g,camx,camy);return;}
    if(e.pl){
      const x=ppx-camx,y=ppy-camy;
      if(p.surf){const b=Math.sin(G.t/14)*0.6;   // 小舟：船べりの奥→人→手前の船べり
        drawBoat(g,x+8,y+b,p.dir,false);drawChar(g,'pl',p.dir,0,x,y-9+b);drawBoat(g,x+8,y+b,p.dir,true);return;}
      if(riding()){drawIcon(g,3,x-4,y+3,24,16);drawChar(g,'pl',p.dir,3+(p.moving?((p.stepN||0)&1):0),x,y-6);return;}
      drawIcon(g,3,x,y+2);
      drawChar(g,'pl',p.dir,p.moving?walkFr(((p.stepN||0)&1)*2+(p.prog>=8?1:0)):0,x,y-6);
      return;
    }
    const o=e.o,x=o.x*16+(o.ox||0)-camx,y=o.y*16+(o.oy||0)-camy;
    if(x<-32||y<-32||x>LW+16||y>LH+16)return;
    if(o.k==='item')drawIcon(g,0,x,y);
    else if(o.k==='starter')drawIcon(g,1,x,y-3);
    else if(o.k==='legend'){drawIcon(g,3,x-4,y+2,24,18);g.drawImage(monCanvas(o.sp,false,false),x-8,y-18+Math.sin(G.t/20)*1.5,32,32);}
    else{
      const water=m.t[o.y*m.W+o.x]===T.WATER;
      if(water)drawChar(g,o.spr,o.dir,0,x,y-2+Math.sin(G.t/16+o.x)*0.5,12);
      else{drawIcon(g,3,x,y+2);drawChar(g,o.spr,o.dir,(o.ox||o.oy)?walkFr(G.t>>3):0,x,y-6);}
      if(o.alert)drawIcon(g,2,x,y-35);
    }
  },skip);
  drawAmbient(g,m,camx,camy);drawDayNight(g,m,camx,camy);
}
function drawWorldUI(){
  const m=G.map;if(!m)return;
  for(const b of m.blds){
    if(!BLD_MARK[b.kind])continue;
    const x=(b.x+2)*16-G.camx+8,y=b.y*16-G.camy+9;
    if(x<-20||y<-20||x>LW+20||y>LH+20)continue;
    ctx.fillStyle='rgba(20,16,32,0.55)';ctx.beginPath();ctx.ellipse(x,y+7,9,9,0,0,6.3);ctx.fill();
    tx(BLD_MARK[b.kind],x,y,'#fff',12,'center');
  }
  if(G.banner&&G.banner.t>0&&!UI.length){
    const a=Math.min(1,G.banner.t/20);ctx.globalAlpha=a;
    setFont(10);const w=Math.max(70,ctx.measureText(G.banner.text).width+20);
    win(4,4,w,22);tx(G.banner.text,14,9,'#2a2233',10);ctx.globalAlpha=1;
  }
}

/* ---------- タイトル ---------- */
let titleMons=null;
function drawTitlePix(){
  const g=wctx;g.lineJoin='round';g.lineCap='round';
  g.fillStyle='#3f6fbf';g.fillRect(0,0,LW,LH);g.fillStyle='#5f93d6';g.fillRect(0,70,LW,LH);g.fillStyle='#8fbfea';g.fillRect(0,108,LW,LH);g.fillStyle='#c4e4f8';g.fillRect(0,134,LW,LH);
  const cloud=(x,y,k)=>{g.fillStyle='#ffffff';g.beginPath();g.ellipse(x,y,16*k,5.5*k,0,0,6.3);g.ellipse(x-7*k,y-4*k,8*k,6*k,0,0,6.3);g.ellipse(x+5*k,y-6*k,10*k,7.5*k,0,0,6.3);g.fill();g.fillStyle='rgba(90,120,190,0.3)';g.beginPath();g.ellipse(x+k,y+2.2*k,13*k,2.6*k,0,0,6.3);g.fill();};
  for(let i=0;i<4;i++)cloud((i*83+G.t*0.06)%(LW+90)-40,100+(i*23)%34,0.7+i*0.15);
  const hill=(col,y0,a,b)=>{g.fillStyle=col;g.strokeStyle='#2b3f2f';g.lineWidth=1;g.beginPath();g.moveTo(-10,LH+10);g.lineTo(-10,y0);g.quadraticCurveTo(60,y0-a,130,y0+4);g.quadraticCurveTo(190,y0-b,LW+10,y0+2);g.lineTo(LW+10,LH+10);g.closePath();g.fill();g.stroke();};
  hill('#4c9a5c',170,26,20);hill('#63b36d',184,10,22);
  g.strokeStyle='rgba(30,60,40,0.45)';g.lineWidth=0.6;for(let i=0;i<16;i++){const x=(i*37)%LW,y=188+(i*13)%18;g.beginPath();g.moveTo(x,y);g.lineTo(x+1.4,y-3.4);g.moveTo(x+2.4,y);g.lineTo(x+3.2,y-2.6);g.stroke();}
  if(!titleMons){const r=RNG('title'+((Date.now()/60000)|0));titleMons=STARTERS.map(id=>id);for(let i=0;i<3;i++)titleMons.push(FAMS[5+r.int(250)].ids.slice(-1)[0]);}
  titleMons.forEach((id,i)=>{const x=(i*46+G.t/3)%(LW+60)-50,y=150+((i*17)%14)+Math.abs(Math.sin(G.t/9+i))*-3;g.drawImage(monCanvas(id,false,true),x,y,40,40);});
}
function drawTitleUI(){
  ctx.lineJoin='round';
  setFont(23);ctx.textAlign='center';ctx.textBaseline='top';ctx.strokeStyle='#22324e';ctx.lineWidth=5;ctx.strokeText('アニマ・クロニクル',120,36);
  tx('アニマ・クロニクル',120,36,'#fff3c4',23,'center');
  tx('― カンテラの旅人 ―',120,68,'#fff',11,'center');
  tx('全'+N_SPECIES+'種のアニマと 絆を結ぶ旅',120,86,'#e8f0ff',8,'center');
  tx('ver '+VERSION,LW-4,LH-10,'rgba(255,255,255,0.6)',7,'right');
}
async function titleFlow(){
  G.scene='title';G.fade=0;
  for(;;){
    const sv=loadSave();
    const opts=sv?['つづきから','はじめから']:['はじめから'];
    const c=await menu(opts,{x:74,y:108,w:92,cancel:false});
    if(opts[c]==='つづきから'){S=sv;if(!S.opts)S.opts={snd:1,fast:0};await fadeTo(1,250);startFromSave();await fadeTo(0,250);return;}
    if(sv&&!(await confirmYN('いまの きろくは 上書きすると 消えます。はじめから 始めますか？')))continue;
    await newGame();return;
  }
}
async function newGame(){
  await fadeTo(1,300);
  S=newSave('ルカ');SND=true;charInvalidate();
  const bg=pushBG(()=>{ctx.fillStyle='#141020';ctx.fillRect(0,0,LW,LH);drawMonUI(STARTERS[(G.t>>7)%5],false,88,40,64);});
  G.fade=0;
  await msg('ここは ルミエール大陸。');
  await msg('人は むかしから カンテラの 灯を わかちあい、ふしぎな 生きもの 「アニマ」と ともに くらしてきた。');
  await msg('きょうは きみが はじめての アニマと 出会う日。…きみの 名前を 教えて ください。');
  let name='ルカ';
  try{const n=window.prompt('あなたの なまえ（6文字まで）','ルカ');if(n&&n.trim())name=n.trim().slice(0,6);}catch(e){}
  S.name=name;
  await msg(name+'。いい 名前だね。つぎは きみの すがたを 教えて。');
  await dressScreen(true);
  await msg('よく にあっているよ。それでは、旅の はじまりだ！');
  await fadeTo(1,300);popW(bg);
  const h=homeSpot();S.heal=h;G.scene='world';loadMap(h.map,h.x,h.y,2);
  await fadeTo(0,300);
  G.busy=true;
  await msg('かあさん「'+name+'、おはよう！ ウィック博士が 研究所で まっているわよ。屋根に 「研」と 書いてある 建物よ。」');
  await msg('（十字パッドか 画面を なぞって 移動。Aで 話す・しらべる。Bを おしながらで 走る。MENUで メニュー）');
  G.busy=false;
  saveGame();
}

/* ---------- 起動 ---------- */
window.addEventListener('load',()=>{
  cv=document.getElementById('cv');ctx=cv.getContext('2d');
  wctx=ctx;
  setupInput();resize();window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.scene==='world'&&!G.busy)saveGame();});
  requestAnimationFrame(loop);
  titleFlow();
});

</script>

function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function RNG(seed){
  let a=(typeof seed==='string'?hashStr(seed):seed)>>>0;
  const f=function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  f.int=n=>Math.floor(f()*n);
  f.range=(lo,hi)=>lo+Math.floor(f()*(hi-lo+1));
  f.pick=arr=>arr[Math.floor(f()*arr.length)];
  f.chance=p=>f()<p;
  f.shuffle=arr=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;};
  f.weighted=ws=>{let s=0;for(const w of ws)s+=w;let r=f()*s;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i;}return ws.length-1;};
  return f;
}

function parseEff(s){
  const out=[];
  for(const tk of s.split(',')){
    if(!tk)continue;
    let m;
    if((m=/^(brn|par|psn|slp|frz|cnf|flinch)(\d+)?$/.exec(tk)))out.push({k:'st',st:m[1],ch:m[2]?+m[2]:100});
    else if((m=/^(self|foe):(atk|def|spa|spd|spe|acc|eva)([+-]\d)(?:@(\d+))?$/.exec(tk)))out.push({k:'stage',who:m[1],stat:m[2],n:+m[3],ch:m[4]?+m[4]:100});
    else out.push({k:tk});
  }
  return out;
}

  add(r.range(13,16),r.pick(t1===0?[7,8]:TYPE_MOVES[t1].st));
  add(r.range(18,22),tr(t1,1));

function genMacro(seed,pNew){

    if(!opts.length){act.splice(ai,1);continue;}
    const n=r.pick(opts);vis[n]=1;adj[c].push(n);adj[n].push(c);act.push(n);
  }
  const bfs=s=>{const dist=new Int16Array(N).fill(-1),par=new Int16Array(N).fill(-1);dist[s]=0;const q=[s];
    for(let i=0;i<q.length;i++){const c=q[i];for(const n of adj[c])if(dist[n]<0){dist[n]=dist[c]+1;par[n]=c;q.push(n);}}

  const a=bfs(0).far,b=bfs(a),path=[];
  for(let c=b.far;c>=0;c=b.par[c])path.push(c);

}

const floorType=(cell,f)=>(cell.kind==='dung'&&f===cell.nF-1&&cell.style!=='road')?'hall':'cave';

function genFloor(cell,f){

/* ---------- マップの取得 ---------- */
const MAPCACHE=new Map();
function getMap(id){
  let m=MAPCACHE.get(id);if(m)return m;
  if(id[0]==='l'&&id[1]==='g')m=genLeague(+id.slice(2));
  else{
    const p=id.split(':'),cell=CELLS[p[0]];
    if(p[1]&&p[1][0]==='b')m=genInterior(cell,+p[1].slice(1));
    else{
      const f=p[1]?+p[1].slice(1):0;
      if(cell.kind==='town')m=genTown(cell);
      else if(cell.kind==='dung')m=genFloor(cell,f);
      else if(cell.node)m=genWild(cell,{});
      else m=genRoute(cell);
    }
  }
  MAPCACHE.set(id,m);
  if(MAPCACHE.size>24)MAPCACHE.delete(MAPCACHE.keys().next().value);
  return m;
}
// 隣のセルへ入るときの行き先マップ（ダンジョンは入る向きで階が決まる）
function entryMapId(cell,side){
  if(cell.kind==='dung'&&cell.onward===side)return floorId(cell,cell.nF-1);
  return cell.key;
}

function tween(ms,fn){return new Promise(res=>{const n=Math.max(1,Math.round(ms/16.7));let i=0;timers.push({n,step(){i++;fn(Math.min(1,i/n));},res});});}

/* ---------- ウィンドウ ---------- */
function popW(w){const i=UI.indexOf(w);if(i>=0)UI.splice(i,1);}
function wrapText(str,maxW){
  const out=[];
  for(const para of String(str).split('\n')){
    let line='',w=0;
    const cw=s=>{let n=0;for(const ch of s)n+=ch.charCodeAt(0)<256?0.56:1;return n;};
    for(const tok of para.split(' ')){
      let tw=cw(tok);
      if(line&&w+0.5+tw>maxW){out.push(line);line='';w=0;}
      if(tw>maxW){for(const ch of tok){const c=cw(ch);if(w+c>maxW){out.push(line);line='';w=0;}line+=ch;w+=c;}continue;}
      if(line){line+=' ';w+=0.5;}
      line+=tok;w+=tw;
    }
    out.push(line);
  }
  return out;
}
const MSG_H=56;
function msg(str,opt){
  opt=opt||{};
  return new Promise(res=>{
    const lines=wrapText(str,21.5),pages=[];
    for(let i=0;i<lines.length;i+=3)pages.push(lines.slice(i,i+3));
    const w={type:'msg',pages,pi:0,ci:0,hold:0,
      len(){let n=0;for(const l of this.pages[this.pi])n+=l.length;return n;},
      next(){if(this.ci<this.len()){this.ci=this.len();return;}
        if(this.pi<this.pages.length-1){this.pi++;this.ci=0;sfx('sel');}else{popW(this);if(!opt.silent)sfx('sel');res();}},
      key(k){if(k==='a'||k==='b')this.next();},
      update(){
        if(this.ci<this.len())this.ci+=(S&&S.opts&&S.opts.fast?3:1.5)*(held.a||held.b?2:1);
        else if(opt.auto){if(++this.hold>opt.auto)this.next();}
        else if(held.a||held.b){if(++this.hold>14){this.hold=0;this.next();}}else this.hold=0;
      },
      draw(){
        const y=LH-MSG_H;win(0,y,LW,MSG_H);
        let left=Math.floor(this.ci);
        this.pages[this.pi].forEach((l,i)=>{if(left<=0)return;tx(l.slice(0,left),10,y+8+i*14,'#2a2233',10);left-=l.length;});
        if(this.ci>=this.len()&&!opt.auto&&(G.t>>4)%2)tx('▼',LW-16,y+MSG_H-15,'#c8503a',8);
      }};
    UI.push(w);
  });
}
// 選択メニュー。戻り値: 選んだ番号 / キャンセルは -1
function menu(items,opt){
  opt=Object.assign({x:LW-100,y:8,w:92,cols:1,cancel:true,idx:0,lh:14},opt||{});
  const rowsAll=Math.ceil(items.length/opt.cols);
  const rows=opt.rows?Math.min(opt.rows,rowsAll):rowsAll;
  const h=rows*opt.lh+12+(opt.title?13:0);
  if(opt.y+h>LH)opt.y=Math.max(0,LH-h);
  return new Promise(res=>{
    const w={type:'menu',items,i:clamp(opt.idx,0,Math.max(0,items.length-1)),top:0,
      key(k){
        const n=items.length;if(!n){if(k==='b'||k==='a'){popW(this);res(-1);}return;}
        const c=opt.cols;let i=this.i;
        if(k==='up')i=i-c<0?(c===1?n-1:i):i-c;
        else if(k==='down')i=i+c>=n?(c===1?0:i):i+c;
        else if(k==='left'){if(c>1){if(i%c>0)i--;}else if(n>rows)i=Math.max(0,i-rows);}
        else if(k==='right'){if(c>1){if(i%c<c-1&&i+1<n)i++;}else if(n>rows)i=Math.min(n-1,i+rows);}
        else if(k==='a'){const it=items[this.i];if(it&&it.dis){sfx('bump');return;}sfx('ok');popW(this);res(this.i);return;}
        else if(k==='b'||k==='m'){if(opt.cancel){sfx('cancel');popW(this);res(-1);}return;}
        if(i!==this.i){this.i=i;sfx('sel');}
        const r=Math.floor(this.i/c);if(r<this.top)this.top=r;if(r>=this.top+rows)this.top=r-rows+1;
      },
      draw(){
        if(opt.bg)opt.bg(this.i);
        win(opt.x,opt.y,opt.w,h);
        let y0=opt.y+6;if(opt.title){tx(opt.title,opt.x+8,y0,'#8a5a2a',9);y0+=13;}
        const cw=(opt.w-12)/opt.cols;
        for(let r=0;r<rows;r++)for(let c=0;c<opt.cols;c++){
          const idx=(this.top+r)*opt.cols+c;if(idx>=items.length)continue;
          const it=items[idx],lab=typeof it==='string'?it:it.label,x=opt.x+6+c*cw,y=y0+r*opt.lh;
          if(idx===this.i){ctx.fillStyle='#f6d98a';ctx.fillRect(x-1,y-1,cw,opt.lh-1);tx('▶',x+1,y+1.5,'#c8503a',8);}
          tx(lab,x+10,y+1,it.dis?'#a8a4a0':(it.col||'#2a2233'),10);
          if(it.right)tx(it.right,x+cw-4,y+1,it.dis?'#a8a4a0':'#5a5560',10,'right');
        }
        if(rowsAll>rows){if(this.top>0)tx('▲',opt.x+opt.w-12,opt.y+3,'#8a5a2a',7);if(this.top+rows<rowsAll)tx('▼',opt.x+opt.w-12,opt.y+h-10,'#8a5a2a',7);}
        if(opt.fg)opt.fg(this.i);
      }};
    const r=Math.floor(w.i/opt.cols);if(r>=rows)w.top=r-rows+1;
    UI.push(w);
  });
}

  pad.addEventListener('pointermove',e=>{if(e.pointerId===padId){e.preventDefault();padMove(e);}});

  pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);

  cv.addEventListener('pointermove',e=>{
    if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(Math.hypot(dx,dy)>16){sw.moved=true;setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));}

  });
  const swUp=e=>{if(!sw||e.pointerId!==sw.id)return;if(sw.moved)setDir(-1);else{press('a');}sw=null;};
  cv.addEventListener('pointerup',swUp);cv.addEventListener('pointercancel',swUp);

function step(){
  G.t++;inputTick();fxTick();
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];if(t.step)t.step();if(--t.n<=0){timers.splice(i,1);t.res();}}
  const top=UI[UI.length-1];
  if(top){let k;while((k=pressQ.shift())){const w=UI[UI.length-1];if(w&&w.key)w.key(k);}const w2=UI[UI.length-1];if(w2&&w2.update)w2.update();}
  if(G.scene==='world')worldTick(!top&&!G.busy);
  else if(G.scene==='title'&&!top)pressQ.length=0;
  if(!UI.length&&(G.busy||G.scene==='battle'))pressQ.length=0;
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.globalAlpha=1;ctx.fillStyle='#181420';ctx.fillRect(0,0,LW,LH);

}
let lastTs=0,acc=0;
function loop(ts){
  if(!lastTs)lastTs=ts;acc+=Math.min(120,ts-lastTs);lastTs=ts;
  try{
    let n=0;while(acc>=16.6&&n<6){for(let i=0;i<G.turbo;i++)step();acc-=16.67;n++;}

  }catch(e){console.error(e);ctx.setTransform(K,0,0,K,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  requestAnimationFrame(loop);
}

let BT=null;
const newStg=()=>({atk:0,def:0,spa:0,spd:0,spe:0,acc:0,eva:0,conf:0,flinch:false});
const stgMul=n=>n>=0?(2+n)/2:2/(2-n);
const accMul=n=>{n=clamp(n,-6,6);return n>=0?(3+n)/3:3/(3-n);};
const bmon=(B,s)=>s?B.foes[B.fi]:S.party[B.pi];
const bstg=(B,s)=>s?B.fs:B.ps;
const bname=(B,s)=>s?(B.wild?'やせいの ':'あいての ')+SP[bmon(B,s).sp].name:monName(bmon(B,s));
const say=t=>msg(t,{auto:34,silent:true});
const sayW=t=>msg(t);

function effStat(B,s,i){
  const m=bmon(B,s),st=bstg(B,s);let v=Math.floor(stat(m,i)*stgMul(st[STKEY[i]]));
  const ab=abilOf(m);
  if(i===1){if(m.st&&ab===12)v=Math.floor(v*1.5);else if(m.st==='brn')v=Math.floor(v/2);}
  if(i===5&&m.st==='par')v=Math.floor(v/4);
  return Math.max(1,v);
}
function calcDamage(B,s,mv,crit,eff){
  const a=bmon(B,s),d=bmon(B,1-s),asp=SP[a.sp];
  const A=mv.phys?effStat(B,s,1):effStat(B,s,3),D=mv.phys?effStat(B,1-s,2):effStat(B,1-s,4);
  let dmg=Math.floor(Math.floor(Math.floor(2*a.lv/5+2)*mv.pow*A/D)/50)+2;
  if(crit)dmg*=2;
  if(mv.type>=0){
    if(asp.types.indexOf(mv.type)>=0)dmg=Math.floor(dmg*1.5);
    dmg=Math.floor(dmg*eff);
    if(abilOf(a)===0&&mv.type===asp.types[0]&&a.hp*3<=maxHP(a))dmg=Math.floor(dmg*1.5);
    if(abilOf(d)===8&&(mv.type===1||mv.type===5))dmg=Math.floor(dmg/2);
  }
  return Math.max(1,Math.floor(dmg*(85+ri(16))/100));
}

async function applyEffects(B,sd,mv,isStatus,selfOnly){

async function useMove(B,sd,idx){

async function useItem(id,opt){
  const it=ITEMS[id],B=opt.battle;
  const consume=()=>{S.bag[id]--;if(S.bag[id]<=0)delete S.bag[id];};
  if(it.k==='seal'){if(!B){await msg('野生の タマモノとの バトル中に 使おう。');return null;}return{t:'seal',id};}
  if(it.k==='repel'){if(S.repel>0){await msg('まだ 前の 香が 効いている。');return null;}S.repel=it.v;consume();await msg('けものよけの香を たいた。しばらく 野生の タマモノが 出てこない。');return true;}
  if(it.k==='rope'){
    if(G.map.id.slice(0,2)==='lg'){await msg('ここでは 使えない！');return null;}
    if(!(await confirmYN('最後に 休んだ 社まで もどりますか？')))return null;
    consume();await warpTo(S.heal);return'close';
  }
  if(it.k==='key'){
    if(id==='k_fly'){const r=await flyMenu();return r?'close':null;}
    if(id==='k_map'){await mapScreen();return null;}
    if(id==='k_rod'){await msg('水辺に むかって Aボタンを おすと 釣りが できる。');return null;}
    await msg(it.d);return null;
  }
  const pi=await partyPick({title:it.n+'を だれに 使う？',note:it.k==='tm'?(m=>canLearnTM(m,it.v)?(m.mv.some(v=>v.id===it.v)?'おぼえている':'おぼえられる'):'おぼえられない'):null});
  if(pi<0)return null;
  const m=S.party[pi],n=monName(m);let text=null;
  if(it.k==='heal'){if(m.hp>0&&m.hp<maxHP(m)){const b=m.hp;m.hp=Math.min(maxHP(m),m.hp+it.v);text=n+'の HPが '+(m.hp-b)+' 回復した！';}}
  else if(it.k==='cure'){if(m.hp>0&&m.st&&(it.v==='all'||m.st===it.v)){m.st=null;m.sc=0;text=n+'の 状態異常が 治った！';}}
  else if(it.k==='revive'){if(m.hp<=0){m.hp=Math.floor(maxHP(m)/2);m.st=null;text=n+'は 元気を とりもどした！';}}
  else if(it.k==='pp'){if(m.mv.some(v=>v.pp<MOVES[v.id].pp)){for(const v of m.mv)v.pp=MOVES[v.id].pp;text=n+'の 技の PPが 回復した！';}}
  else if(it.k==='candy'){
    if(m.lv<100){consume();m.exp=Math.max(m.exp,expFor(SP[m.sp],m.lv+1));const oh=maxHP(m);m.lv++;if(m.hp>0)m.hp+=maxHP(m)-oh;sfx('lvup');
      await msg(n+'は レベル'+m.lv+'に 上がった！');await learnMoves(m,m.lv);await checkEvolutions();return true;}
  }else if(it.k==='tm'){
    if(!canLearnTM(m,it.v)){await msg(n+'は この技を おぼえられない。');return null;}
    if(m.mv.some(v=>v.id===it.v)){await msg(n+'は すでに '+MOVES[it.v].name+'を おぼえている。');return null;}
    if(await teachMove(m,it.v))consume();
    return true;
  }
  if(!text){await msg('使っても 効果が ないよ。');return null;}
  consume();sfx('heal');await msg(text);
  return B?{t:'item'}:true;
}

'use strict';
/* ================= game.js : フィールド・イベント・ストーリー ================= */
const SAVE_KEY='tamamono_save_v1',RIVAL='レン';
const fillName=s=>s.replace(/\{n\}/g,S.name);
function newSave(name){return{v:1,name,map:'',x:0,y:0,dir:2,surf:false,party:[],box:[],bag:{},money:3000,badges:{},flags:{},seen:{},caught:{},heal:null,visited:{},steps:0,repel:0,time:0,opts:{snd:1,fast:0},starter:0,rival:0};}
function saveGame(){if(!S||!G.map)return;const p=G.pl;S.map=G.map.id;S.x=p.x;S.y=p.y;S.dir=p.dir;S.surf=p.surf;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.party&&d.map)return d;}catch(e){}return null;}
function startFromSave(){SND=!!S.opts.snd;UI.length=0;G.scene='world';loadMap(S.map,S.x,S.y,S.dir);G.pl.surf=!!S.surf;G.fade=0;}
function run(fn){G.busy=true;Promise.resolve().then(fn).catch(e=>{console.error(e);}).then(()=>{G.busy=false;});}

/* ---------- マップの読みこみ ---------- */
function activeObjs(m){
  const out=[];
  for(const o of m.objs){
    if(o.k==='item'&&S.flags['i:'+m.id+':'+o.iid])continue;
    if(o.k==='legend'&&(S.flags['L:'+o.sp]||(o.needFlag&&!S.flags[o.needFlag])||(o.sp===SP_OWARI&&S.flags['s:owari']&&!S.flags.champ)))continue;
    if(o.k==='starter'&&S.starter)continue;
    const a=Object.assign({ox:0,oy:0,alert:0},o);
    if(o.k==='npc'){
      if(o.role==='guard'&&S.badges[o.need])continue;
      if(o.role==='story'&&S.flags['s:'+o.sid])continue;
      if(o.role==='rival0'&&S.flags['s:rival1'])continue;
      if(o.role==='trainer')a.beaten=!!S.flags['t:'+m.id+':'+o.tid];
      if(o.role==='elite'&&S.flags['s:lg'+o.n]){a.x=3;a.y=2;a.dir=1;}
    }
    out.push(a);
  }
  return out;
}
function loadMap(id,x,y,dir){
  let m;try{m=getMap(id);}catch(e){console.error(e);m=null;}
  if(!m){const h=homeSpot();m=getMap(h.map);x=h.x;y=h.y;}
  G.map=m;const p=G.pl;p.x=x;p.y=y;if(dir!=null)p.dir=dir;p.moving=false;p.prog=0;p.turn=0;p.idle=9;
  if(m.t[y*m.W+x]!==T.WATER)p.surf=false;
  G.objs=activeObjs(m);
  if(m.cell&&!m.indoor)S.visited[m.cell.key]=1;
  G.banner={text:m.name,t:130};
}
function homeSpot(){const c=WORLD.main[0],b=townBuildings(c).find(x=>x.kind==='home');return{map:c.key+':b'+b.slot,x:4,y:5};}
const refreshObjs=()=>{G.objs=activeObjs(G.map);};
const objAt=(x,y)=>{for(const o of G.objs)if(o.x===x&&o.y===y)return o;return null;};
const removeObj=o=>{const i=G.objs.indexOf(o);if(i>=0)G.objs.splice(i,1);};
async function warpTo(s,dir){await fadeTo(1,220);loadMap(s.map,s.x,s.y,dir==null?2:dir);await fadeTo(0,220);}

/* ---------- 移動 ---------- */
function passable(x,y){
  const m=G.map;if(x<0||y<0||x>=m.W||y>=m.H)return false;
  const v=m.t[y*m.W+x];
  if(v===T.WATER)return G.pl.surf;
  if(SOLID[v])return false;
  return!objAt(x,y);
}
let bumpT=0;
function tryMove(d){
  const p=G.pl,m=G.map,nx=p.x+DX[d],ny=p.y+DY[d];
  if(nx<0||ny<0||nx>=m.W||ny>=m.H){
    const lat=d%2===0?p.x:p.y;
    if(!m.indoor&&m.exits[d]&&(lat===15||lat===16))run(()=>edgeMove(d));
    else if(G.t-bumpT>20){bumpT=G.t;sfx('bump');}
    return;
  }
  if(!passable(nx,ny)){if(G.t-bumpT>20){bumpT=G.t;sfx('bump');}return;}
  p.moving=true;p.spd=held.b?4:2;p.prog=0;
}
function worldTick(canInput){
  const p=G.pl;
  if(G.banner&&G.banner.t>0)G.banner.t--;
  if(G.t%60===0&&S)S.time++;
  if(p.moving){p.idle=0;p.prog+=p.spd;if(p.prog>=16){p.prog=0;p.moving=false;p.x+=DX[p.dir];p.y+=DY[p.dir];p.stepN=(p.stepN||0)+1;onStep();}if(p.moving||!canInput||G.busy)return;}
  else p.idle++;
  if(!canInput)return;
  let k,tap=-1;while((k=pressQ.shift())){if(k==='a'){interact();return;}if(k==='m'){run(openMenu);return;}const ti=['up','right','down','left'].indexOf(k);if(ti>=0)tap=ti;}
  let d=held.up?0:held.right?1:held.down?2:held.left?3:-1;
  if(d<0&&tap>=0){if(p.dir!==tap){p.dir=tap;return;}d=tap;}
  if(d<0){p.turn=0;return;}
  if(p.dir!==d){p.dir=d;if(p.idle>2){p.turn=5;return;}}
  if(p.turn>0){p.turn--;return;}
  tryMove(d);
}
function clearLine(x,y){const m=G.map;if(x<0||y<0||x>=m.W||y>=m.H)return false;const v=m.t[y*m.W+x];return(v===T.WATER||!SOLID[v])&&!objAt(x,y);}
function seenBy(){
  const p=G.pl;
  for(const o of G.objs){
    if(o.k!=='npc')continue;
    if(o.role==='story'){if(Math.abs(o.x-p.x)+Math.abs(o.y-p.y)===1)return o;continue;}
    if((o.role!=='trainer'&&o.role!=='elite')||o.beaten)continue;
    if(o.role==='elite'&&S.flags['s:lg'+o.n])continue;
    const los=o.role==='trainer'?o.los:6;
    for(let i=1;i<=los;i++){const x=o.x+DX[o.dir]*i,y=o.y+DY[o.dir]*i;if(x===p.x&&y===p.y)return o;if(!clearLine(x,y))break;}
  }
  return null;
}
function onStep(){
  const p=G.pl,m=G.map,v=m.t[p.y*m.W+p.x];
  S.steps++;if(p.surf&&v!==T.WATER)p.surf=false;
  const w=m.warps[p.x+','+p.y];
  if(w&&(v===T.DOOR||v===T.MAT||v===T.LADDER)){run(()=>doWarp(w));return;}
  const tr=seenBy();if(tr){run(()=>trainerEncounter(tr));return;}
  if(S.repel>0){S.repel--;if(S.repel===0)run(()=>msg('けものよけの香の 効き目が きれた。'));return;}
  if(m.enc&&m.cell&&S.party.length){
    let kind=null,rate=m.enc.rate;
    if(v===T.TALL||(v===T.CFLOOR&&m.pal==='cave'))kind='land';else if(v===T.WATER&&p.surf){kind='water';rate=10;}
    if(kind&&ri(rate)===0){const wp=wildPick(m.cell,kind,m.enc.bonus||0)||(kind==='water'?waterFallback(m.cell):null);if(wp)run(()=>doWild(wp));}
  }
}
function waterFallback(cell){let best=null,bd=1e9;for(const a of WORLD.areas){if(!a.water.length)continue;const d=Math.abs(a.prog-cell.prog);if(d<bd){bd=d;best=a;}}return best?wildPick(best,'water',0):null;}
async function doWild(w,opt){
  const r=await battle(Object.assign({wild:makeMon(w.sp,w.lv)},opt||{}));
  if(r==='lose')await blackout();
  return r;
}
async function edgeMove(d){
  const m=G.map,n=neighborCell(m.cell,d),p=G.pl;if(!n)return;
  if(!S.starter){await msg('まずは ヤドリギ博士の 研究所へ 行こう。');return;}
  if(m.cell.style==='shrine'&&d===m.cell.onward&&S.flags['s:boss']&&!S.flags['s:owari']){await msg('祭壇の オワリを このままには しておけない！');return;}
  await fadeTo(1,110);
  let x=p.x,y=p.y;if(d===0)y=MH-1;else if(d===2)y=0;else if(d===1)x=0;else x=MW-1;
  const surf=p.surf;
  loadMap(entryMapId(n,(d+2)%4),x,y,d);
  if(surf&&G.map.t[y*MW+x]===T.WATER)p.surf=true;
  saveGame();
  await fadeTo(0,110);
}
async function doWarp(w){
  if(w.needFlag&&!S.flags[w.needFlag])return;
  sfx('door');await fadeTo(1,150);
  if(w.map==='lg1'&&G.map.id.slice(0,2)!=='lg')for(let i=1;i<=5;i++)delete S.flags['s:lg'+i];
  loadMap(w.map,w.x,w.y,w.dir);
  await fadeTo(0,150);
  if(w.map==='lg6')await ending();
}
async function blackout(){
  await msg(S.name+'の 手持ちは みんな 力つきてしまった…。');
  const lost=Math.floor(S.money/2);S.money-=lost;
  await fadeTo(1,400);S.party.forEach(healMon);
  const h=S.heal||homeSpot();loadMap(h.map,h.x,h.y,0);
  await fadeTo(0,400);
  await msg('気がつくと 手当てを うけていた。'+(lost?'（あわてて '+lost+'文 おとしてしまった）':''));
  saveGame();
}

/* ---------- しらべる・話す ---------- */
function interact(){
  const p=G.pl,m=G.map,fx=p.x+DX[p.dir],fy=p.y+DY[p.dir];
  const inb=fx>=0&&fy>=0&&fx<m.W&&fy<m.H,v=inb?m.t[fy*m.W+fx]:-1;
  let o=objAt(fx,fy);
  if(!o&&(v===T.COUNTER||v===T.TABLE))o=objAt(fx+DX[p.dir],fy+DY[p.dir]);
  if(o){run(()=>talk(o));return;}
  if(v===T.SIGN){const s=m.signs[fx+','+fy];if(s)run(()=>msg(s));return;}
  if(v===T.SHRUB||v===T.CRACK||v===T.BOULDER){run(()=>useTool(v,fx,fy));return;}
  if(v===T.WATER&&!p.surf){run(waterAct);return;}
  if(v===T.PC){run(pcMenu);return;}
  if(v===T.SHELF){run(()=>msg('むずかしそうな 本が ぎっしり ならんでいる。'));return;}
  if(v===T.HEALM){run(()=>msg('タマモノを いやす ふしぎな 祭壇だ。'));return;}
  if(v===T.STATUE){run(()=>msg(m.indoor?'りっぱな タマモノの 像だ。':'古い 石像だ。なにかを まもっているようだ。'));return;}
  if(v===T.ALTAR){run(()=>msg(m.id==='lg6'?'歴代の 覇者の 名が きざまれている。':'古い 祭壇だ。ふしぎな 気配を 感じる…。'));return;}
}

  }
  const seen=countKeys(S.seen),got=countKeys(S.caught);
  await msg('博士「見聞録の 調子は どうじゃ？ 見つけた数 '+seen+'、縁を 結んだ数 '+got+'。'+(got<30?'まだまだ これからじゃな！':got<200?'なかなかの ものじゃ！':got<600?'すばらしい！ 大陸に 名が ひびくぞ！':'信じられん…！ きみこそ 真の タマモノ博士じゃ！')+'」');
  if(S.flags.champ)await msg('博士「大陸の 果ての 祠に 「ハジマリ」と よばれる タマモノが あらわれた そうじゃ。各地の 祠の ヌシたちも、覇者の きみを 待っておるぞ。」');
}
async function ending(){
  await msg('ここは 栄光の間。\n'+S.name+'と タマモノたちの 名が 永遠に きざまれた！');
  const bg=pushBG(()=>{ctx.fillStyle='#141020';ctx.fillRect(0,0,LW,LH);tx('覇者 '+S.name,120,14,'#f6e8b8',14,'center');
    S.party.forEach((m,i)=>{const x=24+i*52;drawMonUI(m.sp,m.shiny,x,50+Math.sin(G.t/14+i)*4,48);tx(monName(m),x+24,104,'#fff',8,'center');tx('Lv'+m.lv,x+24,116,'#c8c0d8',8,'center');});
    win(0,LH-MSG_H,LW,MSG_H);});
  sfx('lvup');
  await msg('こうして '+S.name+'は アマツ大陸の 新たな 覇者と なった。');
  await msg('だが 見聞録は まだ 道の 途中。まだ 見ぬ タマモノたちが 大陸の どこかで 待っている。');
  await msg('タマモノ見聞録　― おわり ―\n（旅は つづく… 各地の 祠の ヌシたちに 会いに行こう）');
  popW(bg);
  S.flags.champ=1;S.party.forEach(healMon);
  await warpTo(homeSpot(),0);S.heal=homeSpot();saveGame();
  await msg('かあさん「おかえりなさい！ 覇者に なったんですって？ さすが わたしの 子ね！」');
}

/* ---------- フィールドの描画 ---------- */
const BLD_MARK={heal:'社',shop:'店',gym:'道',lab:'研',league:'殿',home:'家'};
function drawWorldPix(){
  const m=G.map,p=G.pl,g=wctx;if(!m)return;
  const ppx=p.x*16+(p.moving?DX[p.dir]*p.prog:0),ppy=p.y*16+(p.moving?DY[p.dir]*p.prog:0);
  let camx=Math.round((ppx-112)*K)/K,camy=Math.round((ppy-96)*K)/K;
  if(m.W*16<=LW)camx=Math.round((m.W*16-LW)/2);if(m.H*16<=LH)camy=Math.round((m.H*16-LH)/2);
  G.camx=camx;G.camy=camy;
  const ts=tileset(m.pal),fr=(G.t>>5)&1,x0=Math.floor(camx/16),y0=Math.floor(camy/16);
  for(let ty=y0;ty<=y0+13;ty++)for(let tx_=x0;tx_<=x0+15;tx_++){
    const inb=tx_>=0&&ty>=0&&tx_<m.W&&ty<m.H;
    if(!inb&&m.indoor)continue;
    drawTileAt(g,ts,inb?m.t[ty*m.W+tx_]:m.border,fr,tx_*16-camx,ty*16-camy);
  }
  const list=G.objs.slice();list.push({pl:1,x:p.x,y:p.y+(p.moving&&p.dir===2?0.5:0)});
  list.sort((a,b)=>a.y-b.y);
  for(const o of list){
    if(o.pl){
      const x=ppx-camx,y=ppy-camy;
      if(p.surf){g.fillStyle='#7a4c28';g.beginPath();g.ellipse(x+8,y+12.5,8,3.4,0,0,6.3);g.fill();g.fillStyle='#c08a52';g.beginPath();g.ellipse(x+8,y+11.8,7,2.6,0,0,6.3);g.fill();}
      else drawIcon(g,3,x,y+2);
      const f=p.moving?((p.prog>>3)+(p.stepN||0))&1:0;
      drawChar(g,30,p.dir,f,x,y-6-(p.surf?2:0));
      if(!p.moving&&m.t[p.y*m.W+p.x]===T.TALL)g.drawImage(ts,T.TALL*16*K,10*K,16*K,6*K,x,y+10,16,6);
      continue;
    }
    if(o.hide)continue;
    const x=o.x*16+(o.ox||0)-camx,y=o.y*16+(o.oy||0)-camy;
    if(x<-32||y<-32||x>LW+16||y>LH+16)continue;
    if(o.k==='item')drawIcon(g,0,x,y);
    else if(o.k==='starter')drawIcon(g,1,x,y-3);
    else if(o.k==='legend'){drawIcon(g,3,x-4,y+2,24,18);g.drawImage(monCanvas(o.sp,false,false),x-8,y-18+Math.sin(G.t/20)*1.5,32,32);}
    else{
      const water=m.t[o.y*m.W+o.x]===T.WATER;
      if(water)drawChar(g,o.spr,o.dir,0,x,y-2,12);
      else{drawIcon(g,3,x,y+2);drawChar(g,o.spr,o.dir,(o.ox||o.oy)?(G.t>>3)&1:0,x,y-6);}
      if(o.alert)drawIcon(g,2,x,y-22);
    }
  }
}
function drawWorldUI(){
  const m=G.map;if(!m)return;
  for(const b of m.blds){
    if(!BLD_MARK[b.kind])continue;
    const x=(b.x+2)*16-G.camx+8,y=b.y*16-G.camy+9;
    if(x<-20||y<-20||x>LW+20||y>LH+20)continue;
    ctx.fillStyle='rgba(20,16,32,0.55)';ctx.beginPath();ctx.ellipse(x,y+7,9,9,0,0,6.3);ctx.fill();
    tx(BLD_MARK[b.kind],x,y,'#fff',12,'center');
  }
  if(G.banner&&G.banner.t>0&&!UI.length){
    const a=Math.min(1,G.banner.t/20);ctx.globalAlpha=a;
    setFont(10);const w=Math.max(70,ctx.measureText(G.banner.text).width+20);
    win(4,4,w,22);tx(G.banner.text,14,9,'#2a2233',10);ctx.globalAlpha=1;
  }
}

/* ---------- タイトル ---------- */
let titleMons=null;
function drawTitlePix(){
  const g=wctx;
  const gr=g.createLinearGradient(0,0,0,LH);gr.addColorStop(0,'#2a4a8a');gr.addColorStop(0.6,'#6aa0d8');gr.addColorStop(1,'#bfe6ff');
  g.fillStyle=gr;g.fillRect(0,0,LW,LH);
  g.fillStyle='rgba(255,255,255,0.85)';for(let i=0;i<34;i++){const x=(i*73+G.t/8)%LW,y=(i*37)%96;g.beginPath();g.arc(x,y,0.35+(i%3)*0.2,0,6.3);g.fill();}
  g.fillStyle='#4a9a5a';g.beginPath();g.ellipse(120,214,190,60,0,0,6.3);g.fill();
  g.fillStyle='#3a8a4a';g.beginPath();g.ellipse(40,220,120,50,0,0,6.3);g.fill();
  if(!titleMons){const r=RNG('title'+((Date.now()/60000)|0));titleMons=STARTERS.map(id=>id);for(let i=0;i<3;i++)titleMons.push(FAMS[5+r.int(250)].ids.slice(-1)[0]);}
  titleMons.forEach((id,i)=>{const x=(i*46+G.t/3)%(LW+60)-50,y=142+((i*17)%14)+Math.sin(G.t/12+i)*2;g.drawImage(monCanvas(id,false,false),x,y,40,40);});
}
function drawTitleUI(){
  ctx.lineJoin='round';
  setFont(26);ctx.textAlign='center';ctx.textBaseline='top';ctx.strokeStyle='#22324e';ctx.lineWidth=5;ctx.strokeText('タマモノ見聞録',120,34);
  tx('タマモノ見聞録',120,34,'#fff3c4',26,'center');
  tx('― むすびの大陸 ―',120,68,'#fff',11,'center');
  tx('全'+N_SPECIES+'種のタマモノと 縁を結ぶ旅',120,86,'#e8f0ff',8,'center');
  tx('ver '+VERSION,LW-4,LH-10,'rgba(255,255,255,0.6)',7,'right');
}
async function titleFlow(){
  G.scene='title';G.fade=0;
  for(;;){
    const sv=loadSave();
    const opts=sv?['つづきから','はじめから']:['はじめから'];
    const c=await menu(opts,{x:74,y:108,w:92,cancel:false});
    if(opts[c]==='つづきから'){S=sv;if(!S.opts)S.opts={snd:1,fast:0};await fadeTo(1,250);startFromSave();await fadeTo(0,250);return;}
    if(sv&&!(await confirmYN('いまの きろくは 上書きすると 消えます。はじめから 始めますか？')))continue;
    await newGame();return;
  }
}
async function newGame(){
  await fadeTo(1,300);
  S=newSave('アオイ');SND=true;
  const bg=pushBG(()=>{ctx.fillStyle='#141020';ctx.fillRect(0,0,LW,LH);drawMonUI(STARTERS[(G.t>>7)%5],false,88,40,64);});
  G.fade=0;
  await msg('ここは アマツ大陸。');
  await msg('人は むかしから ふしぎな 生きもの 「タマモノ」と 縁を 結び、ともに くらしてきた。');
  await msg('きょうは きみが はじめての タマモノと 出会う日。…きみの 名前を 教えて ください。');
  let name='アオイ';
  try{const n=window.prompt('あなたの なまえ（6文字まで）','アオイ');if(n&&n.trim())name=n.trim().slice(0,6);}catch(e){}
  S.name=name;
  await msg(name+'。いい 名前だね。それでは、旅の はじまりだ！');
  await fadeTo(1,300);popW(bg);
  const h=homeSpot();S.heal=h;G.scene='world';loadMap(h.map,h.x,h.y,2);
  await fadeTo(0,300);
  G.busy=true;
  await msg('かあさん「'+name+'、おはよう！ ヤドリギ博士が 研究所で まっているわよ。屋根に 「研」と 書いてある 建物よ。」');
  await msg('（十字パッドか 画面を なぞって 移動。Aで 話す・しらべる。Bを おしながらで 走る。MENUで メニュー）');
  G.busy=false;
  saveGame();
}

/* ---------- 起動 ---------- */
window.addEventListener('load',()=>{
  cv=document.getElementById('cv');ctx=cv.getContext('2d');
  wctx=ctx;
  setupInput();resize();window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.scene==='world'&&!G.busy)saveGame();});
  requestAnimationFrame(loop);
  titleFlow();
});

</script>

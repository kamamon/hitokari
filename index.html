function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function RNG(seed){
  let a=(typeof seed==='string'?hashStr(seed):seed)>>>0;
  const f=function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  f.int=n=>Math.floor(f()*n);
  f.range=(lo,hi)=>lo+Math.floor(f()*(hi-lo+1));
  f.pick=arr=>arr[Math.floor(f()*arr.length)];
  f.chance=p=>f()<p;
  f.shuffle=arr=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;};
  f.weighted=ws=>{let s=0;for(const w of ws)s+=w;let r=f()*s;for(let i=0;i<ws.length;i++){r-=ws[i];if(r<0)return i;}return ws.length-1;};
  return f;
}

function parseEff(s){
  const out=[];
  for(const tk of s.split(',')){
    if(!tk)continue;
    let m;
    if((m=/^(brn|par|psn|slp|frz|cnf|flinch)(\d+)?$/.exec(tk)))out.push({k:'st',st:m[1],ch:m[2]?+m[2]:100});
    else if((m=/^(self|foe):(atk|def|spa|spd|spe|acc|eva)([+-]\d)(?:@(\d+))?$/.exec(tk)))out.push({k:'stage',who:m[1],stat:m[2],n:+m[3],ch:m[4]?+m[4]:100});
    else if((m=/^fixed(\d+)$/.exec(tk)))out.push({k:'fixed',n:+m[1]});
    else if((m=/^wx:(\w+)$/.exec(tk)))out.push({k:'wx',w:m[1]});
    else if((m=/^wall:(p|s)$/.exec(tk)))out.push({k:'wall',c:m[1]==='s'?1:0});
    else out.push({k:tk});
  }
  return out;
}

  for(const e of m.eff){
    if(e.k==='st')o.push((e.ch<100?e.ch+'%で ':'')+SJ[e.st]);

  m.t=t2;const TD=[3,2,1,0];
  for(const o of m.objs){const x=o.x;o.x=o.y;o.y=x;if(o.dir!=null)o.dir=TD[o.dir];}
  const s2={};for(const k in m.signs){const p=k.split(',');s2[p[1]+','+p[0]]=m.signs[k];}m.signs=s2;
}
function neighborCell(cell,d){return cellAt(cell.fx+DX[d],cell.fy+DY[d]);}
function routeSign(cell){
  const dn=['北','東','南','西'];let s=cell.name;
  for(let d=0;d<4;d++)if(cell.ex[d]){const n=neighborCell(cell,d);if(n)s+='\n'+dn[d]+'：'+n.name;}
  return s;
}
function occupied(m,x,y){for(const o of m.objs)if(o.x===x&&o.y===y)return true;return false;}

/* ---------- 街道（連結セル） ---------- */
function genRoute(cell){
  const r=RNG('map'+cell.key),sea=cell.kind==='sea',cave=cell.pal==='cave';
  const WALL=sea?T.WATER:cave?T.ROCK:T.TREE,FL=cave?T.CFLOOR:T.GRASS,PT=cave?T.CFLOOR:T.PATH;
  const m=newMap(cell.key,cell,MW,MH,WALL),t=m.t;
  const set=(x,y,v)=>{if(x>=0&&y>=0&&x<MW&&y<MH)t[y*MW+x]=v;};
  const get=(x,y)=>t[y*MW+x];
  const px=new Int8Array(MH).fill(15);
  let tid=0,iid=0;
  if(sea){
    for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(x<2||x>29)t[y*MW+x]=T.ROCK;
    for(let y=0;y<4;y++)for(let x=12;x<=19;x++){set(x,y,T.SAND);set(x,MH-1-y,T.SAND);}
    for(let i=0;i<10;i++){const cx=r.range(4,27),cy=r.range(6,25);if(cx>=11&&cx<=20)continue;blobFill(m,cx,cy,r.range(1,2),1,(x,y)=>{if(x<11||x>20)set(x,y,T.ROCK);});}
    for(let i=0;i<3;i++){
      const cx=r.chance(0.5)?r.range(5,8):r.range(23,26),cy=r.range(7,24);
      blobFill(m,cx,cy,2,2,(x,y)=>set(x,y,T.SAND));
      m.objs.push({k:'item',iid:iid++,x:cx,y:cy,item:itemFor(r,cell.prog,i===0)});
    }
    for(const y of [r.range(7,10),r.range(14,17),r.range(21,24)]){
      const left=r.chance(0.5),o=genTrainer(r,cell,tid++,{swim:true,los:5});
      o.x=left?12:19;o.y=y;o.dir=left?1:3;set(o.x,o.y,T.WATER);m.objs.push(o);
    }
  }else{
    const jogs=[r.range(5,7),r.range(11,13),r.range(20,22),r.range(26,28)],tg=[r.range(6,24),r.range(6,24),r.range(6,24),15];
    let x=15;
    for(let y=0;y<MH;y++){
      const j=jogs.indexOf(y);
      if(j>=0){
        const nx=tg[j],lo=Math.min(x,nx),hi=Math.max(x,nx);
        for(let xx=lo-1;xx<=hi+2;xx++){if(get(xx,y-1)===WALL)set(xx,y-1,FL);set(xx,y,FL);}
        for(let xx=lo;xx<=hi+1;xx++)set(xx,y,PT);
        x=nx;
      }else{for(let d=-1;d<=2;d++)set(x+d,y,FL);set(x,y,PT);set(x+1,y,PT);}
      px[y]=x;
    }
    // 広場と草むら
    for(let i=0,n=r.range(4,6);i<n;i++){
      const y=r.range(3,28);if(Math.abs(y-16)<4)continue;
      const sd=r.chance(0.5)?-1:1,cx=clamp(px[y]+sd*r.range(3,6)+(sd>0?1:0),4,27),rx=r.range(2,4),ry=r.range(2,3),tall=!cave&&r.chance(0.8);
      for(let xx=Math.min(cx,px[y]);xx<=Math.max(cx,px[y]);xx++)if(get(xx,y)===WALL)set(xx,y,FL);
      blobFill(m,cx,y,rx,ry,(xx,yy)=>{if(Math.abs(yy-16)<2)return;const v=get(xx,yy);if(v===WALL||v===FL)set(xx,yy,tall&&r.chance(0.8)?T.TALL:FL);});
      m.blobs.push([cx,y,rx,ry]);
    }
    if(!cave)for(const y0 of [r.range(2,3),r.range(8,9),r.range(23,24)]){
      for(let yy=y0;yy<y0+3;yy++){if(jogs.indexOf(yy)>=0||jogs.indexOf(yy+1)>=0||Math.abs(yy-16)<2)continue;for(let d=-1;d<=2;d++)set(px[yy]+d,yy,T.TALL);}
    }
    if(!cave)for(let i=0;i<14;i++){const xx=r.range(2,29),yy=r.range(2,29);if(get(xx,yy)===T.GRASS)set(xx,yy,T.FLOWER);}
    // 池
    if(m.blobs.length&&r.chance(0.45)){const b=r.pick(m.blobs);if(Math.abs(b[0]-px[b[1]])>=4){for(let yy=b[1]-1;yy<=b[1];yy++)for(let xx=b[0]-1;xx<=b[0];xx++)if(Math.abs(yy-16)>=2)set(xx,yy,T.WATER);}}
    // 関所
    const g=cell.gate,gx=px[16];
    if(g){
      for(let xx=0;xx<MW;xx++)if(!SOLID[get(xx,16)])set(xx,16,cave?T.ROCK:T.FENCE);
      set(gx,16,PT);
      if(g.type==='guard'){const pid=g.k===9?88:98;m.objs.push({k:'npc',role:'guard',need:g.k,x:gx,y:16,dir:0,pid,spr:pSpr(pid)});}
      else if(g.type==='story'){const pid=storyPid(g.sid);m.objs.push({k:'npc',role:'story',sid:g.sid,x:gx,y:16,dir:0,pid,spr:pSpr(pid)});}
      else set(gx,16,g.type==='shrub'?T.SHRUB:g.type==='crack'?T.CRACK:T.BOULDER);
    }
    // トレーナー
    const rows=[];for(let y=4;y<=27;y++)if(px[y-1]===px[y]&&px[y+1]===px[y]&&Math.abs(y-16)>=2&&jogs.indexOf(y+1)<0)rows.push(y);
    r.shuffle(rows);const used=[];
    const nT=cell.prog<1?1:r.range(2,4);
    for(const y of rows){
      if(used.length>=nT)break;if(used.some(u=>Math.abs(u-y)<3))continue;used.push(y);
      const left=r.chance(0.5),o=genTrainer(r,cell,tid++,{});
      o.x=left?px[y]-1:px[y]+2;o.y=y;o.dir=left?1:3;set(o.x,o.y,FL);m.objs.push(o);
    }
    // 道具
    for(const b of m.blobs){
      if(iid>=(cell.branch?3:2))break;
      const xx=b[0]+(b[0]<px[b[1]]?-(b[2]-1):(b[2]-1)),yy=b[1];
      if(Math.abs(xx-px[yy])<3||xx<2||xx>29||get(xx,yy)===T.WATER||occupied(m,xx,yy))continue;
      set(xx,yy,FL);m.objs.push({k:'item',iid:iid++,x:xx,y:yy,item:itemFor(r,cell.prog,false)});
    }
    const sx=px[2]-2;set(sx,2,T.SIGN);m.signs[sx+',2']=routeSign(cell);
  }
  m.exits=[1,0,1,0];
  if(!cell.vert){transposeMap(m);m.exits=[0,1,0,1];}
  m.enc={rate:8};
  return m;
}

/* ---------- 原野・洞くつ・ダンジョンの階 ---------- */
function ladderPos(cell,f){const r=RNG('lad'+cell.key+':'+f);return{x:r.range(4,26),y:r.range(4,26)};}
function downPos(cell,f){
  const u=ladderPos(cell,f),r=RNG('ladd'+cell.key+':'+f);
  let x=clamp(30-u.x+r.range(-3,3),4,26),y=clamp(30-u.y+r.range(-3,3),4,26);
  if(Math.abs(x-u.x)+Math.abs(y-u.y)<9){x=(u.x+11)%23+4;y=(u.y+9)%23+4;}
  return{x,y};
}
const floorType=(cell,f)=>(cell.kind==='dung'&&f===cell.nF-1&&cell.style!=='road')?'hall':'cave';
const floorId=(cell,f)=>cell.key+(f?':f'+f:'');
function genWild(cell,o){
  o=o||{};const f=o.f||0,id=floorId(cell,f),r=RNG('map'+id),cave=cell.pal==='cave';
  const WALL=cave?T.ROCK:T.TREE,FL=cave?T.CFLOOR:T.GRASS,PT=cave?T.CFLOOR:T.PATH;
  const m=newMap(id,cell,MW,MH,WALL),t=m.t,br=carver(m,FL,PT,WALL);
  const exits=o.exits||cell.ex;m.exits=exits.slice();
  let tid=0,iid=0,any=false;const tspots=[];
  for(let d=0;d<4;d++){
    if(!exits[d])continue;any=true;
    const a=r.range(3,5),b=r.range(9,11),nu=r.range(7,23);
    const P=[[15,0],[15,a],[nu,a],[nu,b],[15,b],[15,14]].map(p=>AT[d](p[0],p[1]));
    for(let i=0;i<P.length-1;i++)carveLine(br,P[i][0],P[i][1],P[i+1][0],P[i+1][1]);
    const q=AT[d](nu,(a+b)>>1);tspots.push(d%2===0?{x:q[0]-1,y:q[1],dir:1}:{x:q[0],y:q[1]-1,dir:2});
  }
  if(any)for(let y=12;y<=19;y++)for(let x=12;x<=19;x++)if(t[y*MW+x]===WALL)t[y*MW+x]=FL;
  // はしごをつなぐ
  const lads=o.ladders||[],keys=[];
  if(lads.length>1)keys.push([lads[1].x,lads[1].y]);
  if(any)keys.push([15,15]);
  if(lads.length)keys.push([lads[0].x,lads[0].y]);
  if(!any&&lads.length===1)keys.push([r.range(6,24),r.range(6,24)]);
  for(let i=0;i<keys.length-1;i++){
    const A=keys[i],B=keys[i+1],Wp=[r.range(4,26),r.range(4,26)];
    for(const seg of [[A,Wp],[Wp,B]]){const p=seg[0],q=seg[1];
      if(r.chance(0.5)){carveLine(br,p[0],p[1],q[0],p[1]);carveLine(br,q[0],p[1],q[0],q[1]);}
      else{carveLine(br,p[0],p[1],p[0],q[1]);carveLine(br,p[0],q[1],q[0],q[1]);}
      tspots.push({x:Wp[0],y:Wp[1]-1,dir:2});
    }
  }
  // 広場・草むら・行き止まり
  const fl=[];for(let y=3;y<29;y++)for(let x=3;x<29;x++){const v=t[y*MW+x];if(v===FL||v===PT)fl.push([x,y]);}
  if(fl.length)for(let i=0,n=r.range(5,8);i<n;i++){
    const an=r.pick(fl),cx=clamp(an[0]+r.range(-5,5),4,27),cy=clamp(an[1]+r.range(-5,5),4,27),rx=r.range(2,4),ry=r.range(2,3),tall=!cave&&r.chance(0.85);
    let x=an[0],y=an[1];while(x!==cx||y!==cy){if(x!==cx)x+=Math.sign(cx-x);else y+=Math.sign(cy-y);if(t[y*MW+x]===WALL)t[y*MW+x]=FL;}
    blobFill(m,cx,cy,rx,ry,(xx,yy)=>{const j=yy*MW+xx;if(t[j]===WALL||t[j]===FL)t[j]=tall&&r.chance(0.8)?T.TALL:FL;});
    m.blobs.push([cx,cy,rx,ry]);
  }
  if(!cave){
    for(let i=0;i<5;i++){const an=r.pick(fl);for(let yy=an[1]-1;yy<=an[1]+1;yy++)for(let xx=an[0]-1;xx<=an[0]+2;xx++){
      if(xx<3||yy<3||xx>28||yy>28||(xx>=12&&xx<=19&&yy>=12&&yy<=19))continue;const j=yy*MW+xx;if(t[j]===FL||t[j]===PT)t[j]=T.TALL;}}
    for(let i=0;i<14;i++){const xx=r.range(2,29),yy=r.range(2,29);if(t[yy*MW+xx]===T.GRASS)t[yy*MW+xx]=T.FLOWER;}
    if(m.blobs.length&&r.chance(0.5)){const b=m.blobs[m.blobs.length-1];for(let yy=b[1]-1;yy<=b[1];yy++)for(let xx=b[0]-1;xx<=b[0];xx++){const j=yy*MW+xx;if(t[j]===FL||t[j]===T.TALL)t[j]=T.WATER;}}
  }
  for(const L of lads){t[L.y*MW+L.x]=T.LADDER;m.warps[L.x+','+L.y]=L.to;}
  // トレーナー
  r.shuffle(tspots);
  const nT=Math.min(tspots.length,o.nT!=null?o.nT:r.range(2,3));
  for(let i=0;i<nT;i++){
    const s=tspots[i];if(s.x<1||s.y<1||s.x>30||s.y>30||occupied(m,s.x,s.y))continue;
    const j=s.y*MW+s.x;if(t[j]===T.LADDER||SOLID[t[j]])continue;
    const grunt=o.grunt||(cell.main>=5&&cell.main<49&&cell.kind==='wild'&&i===0);
    const tr=genTrainer(r,cell,tid++,{grunt,elite:o.elite,bonus:(o.bonus||0)});
    tr.x=s.x;tr.y=s.y;tr.dir=s.dir;m.objs.push(tr);
  }
  // 道具
  for(const b of m.blobs){
    if(iid>=(o.nI!=null?o.nI:2))break;
    const j=b[1]*MW+b[0];if(SOLID[t[j]]||t[j]===T.LADDER||occupied(m,b[0],b[1]))continue;
    const rich=cell.kind==='dung'&&iid===0;
    m.objs.push({k:'item',iid:iid++,x:b[0],y:b[1],item:itemFor(r,cell.prog,rich)});
  }
  if(any&&!cave&&f===0){const j=11*MW+11;if(t[j]===WALL||t[j]===FL){t[j]=T.SIGN;m.signs['11,11']=routeSign(cell);}}
  m.enc={rate:cave?14:8,bonus:f};
  return m;
}
function genFloor(cell,f){
  const last=cell.nF-1;
  if(floorType(cell,f)==='hall')return genHall(cell,f);
  const ex=[0,0,0,0];
  for(let d=0;d<4;d++){if(!cell.ex[d])continue;if(cell.onward===d){if(f===last)ex[d]=1;}else if(f===0)ex[d]=1;}
  const lad=[];
  if(f<last){const u=ladderPos(cell,f),dst=floorType(cell,f+1)==='hall'?hallLadder(cell):downPos(cell,f+1);lad.push({x:u.x,y:u.y,to:{map:floorId(cell,f+1),x:dst.x,y:dst.y}});}
  if(f>0){const dn=downPos(cell,f),u=ladderPos(cell,f-1);lad.push({x:dn.x,y:dn.y,to:{map:floorId(cell,f-1),x:u.x,y:u.y}});}
  const road=cell.style==='road';
  return genWild(cell,{f,exits:ex,ladders:lad,elite:road,grunt:cell.style==='shrine',nT:road?3:2,nI:2,bonus:f});
}
const hallLadder=cell=>({x:15,y:cell.onward===2?4:27});
function genHall(cell,f){
  const id=floorId(cell,f),m=newMap(id,cell,MW,MH,T.ROCK),flip=cell.onward===2;
  m.pal='cave';
  const set=(x,y,v)=>{m.t[(flip?MH-1-y:y)*MW+x]=v;};
  const Y=y=>flip?MH-1-y:y;
  for(let y=4;y<=28;y++)for(let x=11;x<=20;x++)set(x,y,T.CFLOOR);
  for(let y=9;y<=26;y++){set(15,y,T.RUG);set(16,y,T.RUG);}
  for(let x=14;x<=17;x++)set(x,5,T.ALTAR);
  set(11,4,T.STATUE);set(20,4,T.STATUE);set(11,28,T.STATUE);set(20,28,T.STATUE);
  set(15,27,T.LADDER);const u=ladderPos(cell,f-1);m.warps['15,'+Y(27)]={map:floorId(cell,f-1),x:u.x,y:u.y};
  const spots=[[15,7],[12,7],[19,7]];

    if(sp!==SP_OWARI){const pid=LEG_GUIDE[sp];m.objs.push({k:'npc',role:'guide',leg:sp,x:s[0]+2,y:Y(s[1]+1),dir:3,pid,spr:pSpr(pid)});}      // 守護獣の案内人
  });
  if(cell.style==='shrine'){

    m.objs.push({k:'npc',role:'story',sid:'boss',x:15,y:Y(14),dir:flip?0:2,pid:65,spr:pSpr(65)});

    else{
      const X=x=>d===1?x:31-x;
      for(let y=7;y<=8;y++)for(let x=21;x<=25;x++)m.t[y*MW+X(x)]=T.CFLOOR;
      for(let y=7;y<=16;y++)for(let x=24;x<=25;x++)m.t[y*MW+X(x)]=T.CFLOOR;
      for(let y=15;y<=16;y++)for(let x=24;x<=31;x++)m.t[y*MW+X(x)]=T.CFLOOR;
    }
    m.exits[d]=1;
  }else{
    const r=RNG('hall'+id);
    m.objs.push({k:'item',iid:0,x:19,y:Y(24),item:itemFor(r,cell.prog,true)});
    m.objs.push({k:'item',iid:1,x:12,y:Y(24),item:r.pick(['fuda3','heal3','revive','candy'])});
  }

}

/* ---------- 町 ---------- */
function townBuildings(cell){
  const r=RNG('bld'+cell.key),kinds=['heal'];
  if(cell.size==='league')kinds.push('shop','league');
  else{
    if(cell.size!=='village'||cell.main===0||r.chance(0.5))kinds.push('shop');
    if(cell.gym)kinds.push('gym');
    if(cell.special)for(const s of cell.special)kinds.push(s);
    const n=cell.size==='village'?r.range(2,3):cell.size==='town'?r.range(4,5):r.range(6,8);
    for(let i=0;i<n;i++)kinds.push('house');
  }
  return kinds.map((k,i)=>({slot:i,x:SLOTS[i][0],y:SLOTS[i][1],kind:k}));
}
const ROOF_OF={house:T.ROOF,heal:T.ROOF_H,shop:T.ROOF_S,gym:T.ROOF_G,lab:T.ROOF_X,home:T.ROOF,league:T.ROOF_X};
function healSpot(cell){const b=townBuildings(cell)[0];return{map:cell.key,x:b.x+2,y:b.y+4};}
function genTown(cell){

  for(let d=0;d<4;d++)if(cell.ex[d])for(let v=0;v<4;v++){const p=AT[d](15,v);for(let a=0;a<2;a++)for(let b=0;b<2;b++)set(p[0]+a,p[1]+b,T.PATH);}

const MAPCACHE=new Map();
function getMap(id){
  let m=MAPCACHE.get(id);if(m)return m;
  if(id.startsWith('a:'))m=generateExpansionMap(id);
  else if(id[0]==='l'&&id[1]==='g')m=genLeague(+id.slice(2));
  else{
    const p=id.split(':'),cell=CELLS[p[0]];
    if(p[1]&&p[1][0]==='b')m=genInterior(cell,+p[1].slice(1));
    else{
      const f=p[1]?+p[1].slice(1):0;
      if(cell.kind==='town')m=genTown(cell);
      else if(cell.kind==='dung')m=genFloor(cell,f);
      else if(cell.node)m=genWild(cell,{});
      else m=genRoute(cell);
    }
  }
  if(!m)throw Error('unknown map '+id);decorateExpansionMap(m);applyIndividualFieldDesign(m);
  MAPCACHE.set(id,m);
  if(MAPCACHE.size>24)MAPCACHE.delete(MAPCACHE.keys().next().value);
  return m;
}

function setupInput(){
  const KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',z:'a',Enter:'a',' ':'a',x:'b',Escape:'b',Backspace:'b',m:'m',c:'c',Shift:'m'};
  window.addEventListener('keydown',e=>{if(e.target&&['INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName))return;const k=KM[e.key];if(!k)return;e.preventDefault();initAudio();if(e.repeat)return;if(k==='m'||k==='c')press(k);else setHeld(k,1);});
  window.addEventListener('keyup',e=>{const k=KM[e.key];if(!k||k==='m'||k==='c')return;setHeld(k,0);});
  const dirs=['up','right','down','left'];
  const setDir=d=>{for(let i=0;i<4;i++)setHeld(dirs[i],i===d?1:0);};
  // 十字パッド（円のどこを触っても方向が決まる。指をすべらせて方向転換できる）
  const pad=document.getElementById('dpad'),knob=document.getElementById('knob');
  let padId=null;
  const padMove=e=>{
    const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),dist=Math.hypot(dx,dy);
    const lim=r.width*0.3,kx=dist>lim?dx/dist*lim:dx,ky=dist>lim?dy/dist*lim:dy;
    knob.style.transform='translate('+kx+'px,'+ky+'px)';
    if(dist<r.width*0.09){setDir(-1);return;}
    setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));
  };
  pad.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId);}catch(_){}padMove(e);});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===padId){e.preventDefault();padMove(e);}});
  const padUp=e=>{if(e.pointerId===padId){padId=null;setDir(-1);knob.style.transform='';}};
  pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);pad.addEventListener('lostpointercapture',padUp);
  const btn=(id,k)=>{const el=document.getElementById(id);
    el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();el.classList.add('on');if(k==='m'||k==='c')press(k);else setHeld(k,1);});
    const up=e=>{el.classList.remove('on');if(k!=='m'&&k!=='c')setHeld(k,0);};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);};
  btn('bA','a');btn('bB','b');btn('bM','m');btn('bC','c');
  // 画面：タップ=決定、なぞる=移動
  let sw=null;
  cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();sw={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{
    if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
    if(Math.hypot(dx,dy)>16){sw.moved=true;setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));}
    else if(sw.moved)setDir(-1);
  });
  const swUp=e=>{if(!sw||e.pointerId!==sw.id)return;if(sw.moved)setDir(-1);else{press('a');}sw=null;};
  cv.addEventListener('pointerup',swUp);const swCancel=e=>{if(sw&&e.pointerId===sw.id){sw=null;setDir(-1);}};cv.addEventListener('pointercancel',swCancel);cv.addEventListener('lostpointercapture',swCancel);
  const resetHeld=()=>{padId=null;sw=null;knob.style.transform='';for(const k in held)setHeld(k,0);pressQ.length=0;document.querySelectorAll('.btn.on').forEach(e=>e.classList.remove('on'));};
  window.addEventListener('blur',resetHeld);document.addEventListener('visibilitychange',()=>{if(document.hidden)resetHeld();});
  document.addEventListener('touchmove',e=>{if(!e.target.closest||!e.target.closest('#io'))e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('gesturestart',e=>e.preventDefault());
}

function step(){
  G.t++;inputTick();fxTick();if((G.t&3)===0)audioTick();if((G.t&31)===0)syncBikeBtn();
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];if(t.step)t.step();if(--t.n<=0){timers.splice(i,1);t.res();}}
  const top=UI[UI.length-1];
  if(top){let k;while((k=pressQ.shift())){const w=UI[UI.length-1];if(w&&w.key)w.key(k);}const w2=UI[UI.length-1];if(w2&&w2.update)w2.update();}
  if(G.scene==='world')worldTick(!top&&!G.busy);
  else if(G.scene==='title'&&!top)pressQ.length=0;
  if(!UI.length&&(G.busy||G.scene==='battle'))pressQ.length=0;
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.globalAlpha=1;ctx.fillStyle='#181420';ctx.fillRect(0,0,LW,LH);
  if(G.scene==='world'){drawWorldPix();drawWorldUI();}
  else if(G.scene==='battle'){drawBattlePix();drawBattleUI();}
  else{drawTitlePix();drawTitleUI();}

  if(G.fade>0){ctx.fillStyle='rgba(16,12,24,'+G.fade+')';ctx.fillRect(0,0,LW,LH);}
}
let lastTs=0,acc=0;
function loop(ts){
  if(!lastTs)lastTs=ts;acc+=Math.min(120,ts-lastTs);lastTs=ts;
  try{
    let n=0;while(acc>=16.6&&n<6){for(let i=0;i<G.turbo;i++)step();acc-=16.67;n++;}
    render();
  }catch(e){console.error(e);ctx.setTransform(K,0,0,K,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  requestAnimationFrame(loop);
}

const SINK='#3b2f3f';

function atlas(cols,rows,cw,ch,draw){
  const c=document.createElement('canvas');c.width=cols*cw*K;c.height=rows*ch*K;const g=c.getContext('2d');
  for(let r=0;r<rows;r++)for(let i=0;i<cols;i++){g.save();g.setTransform(K,0,0,K,i*cw*K,r*ch*K);g.beginPath();g.rect(0,0,cw,ch);g.clip();g.lineCap='round';g.lineJoin='round';draw(g,i,r);g.restore();}

}
function blit(g,c,i,r,x,y){const w=c.cw*K,h=c.ch*K;g.drawImage(c,i*w,r*h,w,h,x,y,c.cw,c.ch);}
// セル塗り：ペン線→ベタ→右下に影
function celP(g,mk,base,shade,iw,ox,oy){
  const p=new Path2D();mk(p);

/* ---------- ふちがゆらぐマス（道・砂・水・岩） ---------- */
const EC=[[0,0],[16,0],[16,16],[0,16]],ED=[[1,0],[0,1],[-1,0],[0,-1]],EN=[[0,1],[-1,0],[0,-1],[1,0]];
function edgeShape(mask,seed,ins,amp,r){
  const q=RNG(seed),fill=new Path2D(),line=new Path2D(),pts=[],I=typeof ins==='number'?[ins,ins,ins,ins]:ins;
  const con=s=>(mask>>s)&1,pt=(s,t,d)=>[EC[s][0]+ED[s][0]*t+EN[s][0]*d,EC[s][1]+ED[s][1]*t+EN[s][1]*d];
  let first=true,open=false;
  const go=a=>{if(first){fill.moveTo(a[0],a[1]);first=false;}else fill.lineTo(a[0],a[1]);};
  for(let s=0;s<4;s++){
    const pv=(s+3)%4,nx=(s+1)%4;
    if(con(s)){if(con(pv))go(EC[s]);open=false;continue;}
    const t0=con(pv)?0:I[pv]+r,t1=con(nx)?16:16-I[nx]-r,n=4,W=[];
    for(let k=0;k<=n;k++)W.push(pt(s,t0+(t1-t0)*k/n,(k===0||k===n)?I[s]:I[s]+(q()-0.5)*2*amp));
    go(W[0]);if(!open){line.moveTo(W[0][0],W[0][1]);open=true;}
    for(let k=1;k<n;k++){const m=k===n-1?W[n]:[(W[k][0]+W[k+1][0])/2,(W[k][1]+W[k+1][1])/2];fill.quadraticCurveTo(W[k][0],W[k][1],m[0],m[1]);line.quadraticCurveTo(W[k][0],W[k][1],m[0],m[1]);pts.push([m[0],m[1],s]);}
    if(!con(nx)){const c=pt(s,16-I[nx],I[s]),e=pt(nx,I[s]+r,I[nx]);fill.quadraticCurveTo(c[0],c[1],e[0],e[1]);line.quadraticCurveTo(c[0],c[1],e[0],e[1]);}
  }
  fill.closePath();
  return{fill,line,pts};
}

const GVW=[0,0,7,7,0,1,1,2,7,3,4,5,6,1,0,2];
function mkGround(P){

    if(v===6){for(let i=0;i<2;i++){const x=4+q()*8,y=4+q()*8;g.fillStyle='#fffdf0';for(let k=0;k<4;k++){g.beginPath();g.arc(x+Math.cos(k*1.571)*0.5,y+Math.sin(k*1.571)*0.5,0.36,0,6.3);g.fill();}g.fillStyle='#f4c53a';g.beginPath();g.arc(x,y,0.26,0,6.3);g.fill();}}

function mkEdge(P,kind,part){      // part: なし=ふつう 'mask'=形だけ（模様をかぶせる用） 'rim'=ふちだけ
  const sand=kind==='sand',col=sand?P.sand:P.path,col2=sand?P.sand2:P.path2,I=sand?1.8:2.2;

function battleEnv(o){

function aiPick(B){
  const f=bmon(B,1),me=bmon(B,0),list=[];
  f.mv.forEach((v,i)=>{if(v.pp>0)list.push(i);});
  if(!list.length)return -1;
  if(B.wild&&!B.o.smart)return pick(list);
  const fast=effStat(B,1,5)>=effStat(B,0,5),hp=f.hp/maxHP(f),ab=abilOf(me),ty=SP[me.sp].types;
  let best=list[0],bs=-Infinity;
  for(const i of list){
    const m=MOVES[f.mv[i].id];let score=0;
    const acc=m.acc===0?1:clamp(m.acc*accMul(B.fs.acc-B.ps.eva)*(abilOf(f)===14?1.2:1)/100,0,1);
    if(m.pow>0){
      let eff=m.type<0?1:typeEff(m.type,ty);
      if((m.type===8&&ab===2)||(m.type===2&&ab===9)||(m.type===3&&ab===10)||(m.type===1&&ab===11))eff=0;
      if(eff>0){
        const fix=m.eff.find(e=>e.k==='fixed');
        let d=fix?fix.n:m.has('level')?f.lv:m.has('halve')?Math.max(1,me.hp/2):calcDamage(B,1,m,false,eff,92);
        if(m.has('multi'))d*=3;if(m.has('twice'))d*=2;
        score=HitokariUpgrade.damageScore(d,me.hp,acc,m.prio,fast);
        if(m.has('rech')&&d<me.hp)score*=0.62;
        if(m.has('boom')&&hp>0.3)score*=0.12;
        if(m.has('drain')&&hp<0.6)score+=12;
      }
    }else{
      for(const e of m.eff){
        let v=0;
        if(e.k==='st'){
          if(e.st==='cnf')v=B.ps.conf?0:28;
          else if(!me.st&&ab!==18&&!(e.st==='brn'&&ty.includes(1))&&!(e.st==='frz'&&ty.includes(5))&&!(e.st==='psn'&&(ty.includes(7)||ty.includes(16))))v=e.st==='slp'?42:27;
        }else if(e.k==='stage'){const st=e.who==='self'?B.fs:B.ps,x=st[e.stat];v=(e.n>0&&x>=6||e.n<0&&x<=-6)?0:Math.max(0,30-Math.abs(x)*7)*(hp<0.3?0.3:1);}
        else if(e.k==='heal')v=hp<0.45?72:hp<0.65?38:0;
        else if(e.k==='protect')v=B.fs.protN?1:B.weather||B.ps.seed||me.st==='psn'||me.st==='brn'?22:5;
        else if(e.k==='seed')v=B.ps.seed||ty.includes(4)?0:32;
        else if(e.k==='wx')v=B.weather===e.w?0:12;
        else if(e.k==='wall')v=B.wall[1][e.c]>0?0:22;
        else if(e.k==='haze')v=['atk','spa','spe','def','spd','eva','acc'].some(k=>B.ps[k]-B.fs[k]>=3)?35:0;
        else if(e.k==='belly')v=hp>0.75&&B.fs.atk<3?22:0;
        else if(e.k==='cure')v=f.st?48:0;
        else if(e.k==='rest')v=hp<0.3&&abilOf(f)!==18?56:0;
        else if(e.k==='split')v=f.hp*2<me.hp?54:0;
        else if(e.k==='focus')v=B.fs.focus?0:16;
        score+=v;
      }
      score*=acc;
    }
    score*=0.94+Math.random()*0.12;
    if(score>bs){bs=score;best=i;}
  }
  return best;
}

async function giveExp(B){

  }

async function useItem(id,opt){
  const it=ITEMS[id],B=opt.battle;
  const consume=()=>{S.bag[id]--;if(S.bag[id]<=0)delete S.bag[id];};
  if(it.k==='seal'){if(!B||!B.wild){await msg('野生の アニマとの バトル中に 使おう。');return null;}return{t:'seal',id};}
  if(it.k==='tool'){await msg(it.d);return null;}
  if(it.k==='camp'){
    if(B){await msg('バトル中は 使えない。');return null;}
    if(!S.party.some(m=>m.hp<maxHP(m)||m.st)){await msg('みんな 元気だ。');return null;}
    consume();sfx('heal');await fadeTo(0.6,300);
    for(const m of S.party){if(it.v>=1)healMon(m);else if(m.hp>0)m.hp=Math.min(maxHP(m),m.hp+Math.ceil(maxHP(m)*it.v));}
    await fadeTo(0,300);await msg(it.v>=1?'テントで ゆっくり 休んだ。みんな すっかり 元気に なった！':'ひと休みした。みんなの HPが 回復した！');return true;
  }
  if(it.k==='repel'){if(S.repel>0){await msg('まだ 前の 道具が 効いている。');return null;}S.repel=it.v;consume();await msg(it.n+'を 使った。先頭の 元気な 相棒より 弱い 野生のアニマが 出なくなる。');return true;}
  if(it.k==='rope'){
    if(G.map.id.slice(0,2)==='lg'){await msg('ここでは 使えない！');return null;}
    if(!(await confirmYN('最後に 休んだ 診療所まで もどりますか？')))return null;
    consume();await warpTo(S.heal);return'close';
  }
  if(it.k==='key'){
    if(id==='k_fly'){const r=await flyStart();return r?'close':null;}
    if(id==='k_map'){await mapScreen();return null;}
    if(id==='k_rod'){await msg('水辺に むかって Aボタンを おすと 釣りが できる。');return null;}
    if(it.use==='scan'){const c=G.map&&(G.map.advEnc||G.map.cell),L=c?[].concat(c.land||[],c.water||[]):[];if(!L.length){await msg('この あたりに アニマの 足あとは ない。');return null;}
      await msg('足あとを 読みとった。この あたりに すむのは…\n'+L.map(f=>{const id=FAMS[f].ids[0];return S.seen[id]?SP[id].name:'？？？';}).join('、')+'。');return null;}
    await msg(it.d);return null;
  }
  const pi=await partyPick({title:it.n+'を だれに 使う？',note:it.k==='tm'?(m=>canLearnTM(m,it.v)?(m.mv.some(v=>v.id===it.v)?'おぼえている':'おぼえられる'):'おぼえられない'):null});
  if(pi<0)return null;
  const m=S.party[pi],n=monName(m);let text=null;
  if(it.k==='heal'){if(m.hp>0&&m.hp<maxHP(m)){const b=m.hp;m.hp=Math.min(maxHP(m),m.hp+it.v);text=n+'の HPが '+(m.hp-b)+' 回復した！';}}
  else if(it.k==='cure'){if(m.hp>0&&m.st&&(it.v==='all'||m.st===it.v)){m.st=null;m.sc=0;text=n+'の 状態異常が 治った！';}}
  else if(it.k==='revive'){if(m.hp<=0){m.hp=it.v?maxHP(m):Math.floor(maxHP(m)/2);m.st=null;text=n+'は 元気を とりもどした！';}}
  else if(it.k==='held'){
    if(B){await msg('バトル中は 持たせられない。');return null;}
    consume();if(m.item)bagAdd(m.item);const old=m.item;m.item=id;sfx('ok');await msg(n+'に '+it.n+'を 持たせた。'+(old?'（'+ITEMS[old].n+'は もちものに もどした）':''));return true;
  }else if(it.k==='evo'){
    const sp=SP[m.sp];
    if(B){await msg('バトル中は 使えない。');return null;}
    if(!sp.next||!sp.types.some(t=>it.v.indexOf(t)>=0)){await msg(n+'には 使っても 効果が ないよ。');return null;}
    if(m.lv<sp.evoLv-8){await msg(n+'は まだ 進化の 準備が できていない。（Lv'+(sp.evoLv-8)+'から 使える）');return null;}
    consume();await evolveMon(m);return true;
  }

  }

function passable(x,y){
  const m=G.map;if(x<0||y<0||x>=m.W||y>=m.H)return false;
  if(G.pl.fly)return true;      // 空の上は どこでも通れる（降りられるのは 歩ける所だけ）
  const v=m.t[y*m.W+x];
  if(!expansionPass(m,G.pl.x,G.pl.y,x,y,G.pl))return false;
  if(v===T.WATER)return G.pl.surf&&!objAt(x,y);
  if(SOLID[v])return false;
  return!objAt(x,y);
}
let bumpT=0;
function tryMove(d){
  const p=G.pl,m=G.map,nx=p.x+DX[d],ny=p.y+DY[d];
  if(nx<0||ny<0||nx>=m.W||ny>=m.H){
    const lat=d%2===0?p.x:p.y;
    if(!m.indoor&&m.exits[d]&&(p.fly||lat===15||lat===16))run(()=>edgeMove(d));      // 空からは 道が つながっている方向なら どこからでも
    else if(G.t-bumpT>20){bumpT=G.t;sfx('bump');}
    return;
  }
  if(!passable(nx,ny)){if(G.t-bumpT>20){bumpT=G.t;sfx('bump');}return;}
  p.moving=true;p.spd=p.fly?(held.b?8:16/3):riding()?16/3:held.b?4:2;p.prog=0;if(!p.fly){folStart();p.ledgeJump=expansionLedge(G.map,p.x,p.y,nx,ny)?1:0;}
}
function worldTick(canInput){

  if(p.moving){p.idle=0;p.prog+=p.spd;if(p.prog>=15.99){p.prog=0;p.moving=false;p.x+=DX[p.dir];p.y+=DY[p.dir];p.stepN=(p.stepN||0)+1;p.ledgeJump=0;onStep();}if(p.moving||!canInput||G.busy)return;}
  else p.idle++;
  if(!canInput)return;
  let k,tap=-1;while((k=pressQ.shift())){if(k==='a'){interact();return;}if(k==='m'){run(openMenu);return;}if(k==='c'){if(S.bag.k_bike&&!p.fly)run(toggleBike);return;}const ti=['up','right','down','left'].indexOf(k);if(ti>=0)tap=ti;}
  let d=held.up?0:held.right?1:held.down?2:held.left?3:-1;

  if(p.dir!==d){p.dir=d;if(p.idle>2){p.turn=5;return;}}

function seenBy(){

  }

  const inb=fx>=0&&fy>=0&&fx<m.W&&fy<m.H,v=inb?m.t[fy*m.W+fx]:-1;

  if(folVisible()&&FOL.x===fx&&FOL.y===fy){run(folTalk);return;}
  if(v===T.SIGN){const s=m.signs[fx+','+fy];if(s)run(()=>msg(s));return;}
  if(v===T.SHRUB||v===T.CRACK||v===T.BOULDER){run(()=>useTool(v,fx,fy));return;}
  if(v===T.WATER&&!p.surf){run(waterAct);return;}
  if(v===T.PC){run(pcMenu);return;}
  if(v===T.SHELF){run(()=>msg('むずかしそうな 本が ぎっしり ならんでいる。'));return;}

  if(v===T.ALTAR){run(()=>msg(m.id==='lg6'?'歴代の チャンピオンの 名が きざまれている。':'古い 祭壇だ。ふしぎな 気配を 感じる…。'));return;}

function isValidGameSave(d){
  if(!HitokariUpgrade.validSave(d,id=>Number.isInteger(id)&&!!SP[id],id=>Number.isInteger(id)&&!!MOVES[id],PARTY_MAX))return false;
  if(!(/^lg[1-6]$/.test(d.map)||validExpansionMapId(d.map)||Object.prototype.hasOwnProperty.call(CELLS,d.map.split(':')[0])))return false;
  const n=d.upgrade&&d.upgrade.nursery;if(n===undefined)return true;
  if(!n||!Array.isArray(n.parents)||n.parents.length>2||!Number.isInteger(n.pairSteps)||n.pairSteps<0||n.pairSteps>HitokariUpgrade.EGG_READY)return false;
  if(n.parents.some(p=>!p||!Number.isInteger(p.steps)||p.steps<0||p.steps>20000||!p.mon))return false;
  if(n.egg!==null&&(!n.egg||!n.egg.mon||typeof n.egg.held!=='boolean'||!Number.isInteger(n.egg.walk)||n.egg.walk<0||n.egg.walk>HitokariUpgrade.EGG_HATCH))return false;
  const extra=n.parents.map(p=>p.mon);if(n.egg)extra.push(n.egg.mon);
  return HitokariUpgrade.validSave({...d,box:(d.box||[]).concat(extra)},id=>Number.isInteger(id)&&!!SP[id],id=>Number.isInteger(id)&&!!MOVES[id],PARTY_MAX);
}
function persistGameSave(d){
  if(!isValidGameSave(d))return false;
  try{
    const raw=JSON.stringify(d),old=localStorage.getItem(SAVE_KEY);
    if(old&&old!==raw){try{if(isValidGameSave(JSON.parse(old)))localStorage.setItem(BACKUP_KEY,old);}catch(e){console.warn('backup',e);}}
    localStorage.setItem(SAVE_KEY,raw);return true;

}

function nurseryCompatible(n){if(n.parents.length!==2)return false;const a=famOf(SP[n.parents[0].mon.sp]),b=famOf(SP[n.parents[1].mon.sp]);return a.id===b.id&&!a.legend&&!a.one;}
function makeNurseryEgg(a,b){const f=famOf(SP[a.sp]);const m=makeMon(f.ids[0],5,{nat:chance(0.5)?pick([a.nat,b.nat]):ri(25),ability:chance(0.6)?abilOf(pick([a,b])):undefined});m.iv=HitokariUpgrade.inheritIV(a.iv,b.iv);healMon(m);return m;}
function nurseryAdvance(){if(!S.flags.dex)return;const n=nurseryFor(),ok=nurseryCompatible(n);HitokariUpgrade.tickNursery(n,ok);if(ok&&!n.egg&&n.pairSteps>=HitokariUpgrade.EGG_READY){n.egg={mon:makeNurseryEgg(n.parents[0].mon,n.parents[1].mon),held:false,walk:0};n.pairSteps=0;}}
async function hatchNurseryEgg(){
  const n=nurseryFor(),egg=n.egg;if(!egg||!egg.held||egg.walk<HitokariUpgrade.EGG_HATCH)return;
  sfx('get');await msg('……おや？ たまごが ゆれている！');
  const bg=pushBG(()=>{screenBG('新しい いのち');const m=egg.mon;win(50,30,140,110,'#e8f0f8');drawMonUI(m.sp,m.shiny,72,34,96);});
  await msg(SP[egg.mon.sp].name+'が たまごから かえった！');popW(bg);await addMon(egg.mon,true);n.egg=null;saveGame();
}
async function nurseryMenu(){
  if(badgeCount()<2){await msg('バッジを 2個 集めたら 育成牧場を 利用できる。');return;}
  if(G.map.id.slice(0,2)==='lg'||G.pl.fly){await msg('ここからは 育成牧場に 連絡できない。');return;}
  const n=nurseryFor();
  for(;;){
    const c=await menu(['預けた 相棒・たまご','牧場から 相棒を 預ける','相棒を 牧場に 戻す','たまごを 受け取る','つかいかた','もどる'],{x:8,y:30,w:224,title:'育成牧場',bg:()=>screenBG()});
    if(c<0||c===5)return;
    if(c===0){
      const names=n.parents.map(p=>monName(p.mon)+' '+p.steps+'EXP').join('、')||'なし';
      const state=n.egg?(n.egg.held?'孵化まで あと '+(HitokariUpgrade.EGG_HATCH-n.egg.walk)+'歩':'受取可能'):nurseryCompatible(n)?'発見まで あと '+(HitokariUpgrade.EGG_READY-n.pairSteps)+'歩':'まだ なし';
      await msg('預けた 相棒 '+n.parents.length+'/2\n'+names);await msg('たまご：'+state);
    }else if(c===1){
      if(n.parents.length>=2){await msg('2匹までしか 預けられない。');continue;}
      const i=await boxPick('どの 相棒を 預ける？');if(i<0)continue;
      const m=S.box[i],f=famOf(SP[m.sp]);if(f.legend||f.one){await msg('この アニマは 育成牧場で つがいに できない。');continue;}
      if(n.parents.length&&famOf(SP[n.parents[0].mon.sp]).id!==f.id){await msg('同じ 進化系統の 相棒を 選んでね。');continue;}
      if(!(await confirmYN(monName(m)+'を 育成牧場に 預けますか？')))continue;
      n.parents.push({mon:S.box.splice(i,1)[0],steps:0});n.pairSteps=0;saveGame();await msg('大切に おあずかりします。');
    }else if(c===2){
      if(!n.parents.length){await msg('預けている 相棒は いない。');continue;}
      const i=await menu(n.parents.map(p=>({label:monName(p.mon),right:p.steps+'EXP'})),{x:8,y:45,w:224,title:'引き取る 相棒',bg:()=>screenBG()});if(i<0)continue;
      const p=n.parents[i],m=p.mon,old=m.lv;m.exp=Math.max(m.exp,Math.min(expFor(SP[m.sp],100),m.exp+p.steps));
      while(m.lv<100&&m.exp>=expFor(SP[m.sp],m.lv+1)){m.lv++;HitokariUpgrade.bond(m,1);for(const [lv,id] of famOf(SP[m.sp]).learn)if(lv===m.lv&&m.mv.length<4&&!m.mv.some(v=>v.id===id))m.mv.push({id,pp:MOVES[id].pp});}
      n.parents.splice(i,1);n.pairSteps=0;healMon(m);S.box.push(m);saveGame();await msg(monName(m)+'は 牧場に 戻った。'+(old!==m.lv?' Lv'+old+' → '+m.lv:''));
    }else if(c===3){
      if(!n.egg){await msg('まだ たまごは 見つかっていない。');continue;}
      if(n.egg.held){await msg('もう たまごを 持っている。');continue;}
      n.egg.held=true;saveGame();await msg('たまごを 受け取った！ 512歩 ほど 旅をしよう。');
    }else{
      await msg('同じ 進化系統の 2匹を あずかり牧場から 預けると、256歩で たまごが 見つかる。');await msg('受け取った たまごは 512歩で かえる。親から 能力や 性格、特性を 受けつぐことが ある。');await msg('預けた 相棒には 1歩ごとに 1EXP。進化は しない。技は 空きがあるときだけ 覚える。');
    }
  }
}
const hiddenCache=new WeakMap();
function hiddenSpot(m,x,y){
  if(m.indoor||!m.cell)return false;
  if(!hiddenCache.has(m)){const cells=[];for(let j=2;j<m.H-2;j++)for(let i=2;i<m.W-2;i++)if(m.t[j*m.W+i]===T.FLOWER&&!m.warps[i+','+j]&&[0,1,2,3].some(d=>!SOLID[m.t[(j+DY[d])*m.W+i+DX[d]]]&&m.t[(j+DY[d])*m.W+i+DX[d]]!==T.WATER))cells.push([i,j]);hiddenCache.set(m,cells.length?RNG('hidden:'+m.id).pick(cells):null);}
  const p=hiddenCache.get(m);return !!p&&p[0]===x&&p[1]===y;
}
async function collectHidden(m){
  const p=HitokariUpgrade.progress(S);if(p.hidden[m.id]){await msg('花が 風に ゆれている。');return;}
  const id=RNG('hidden-item:'+m.id).pick(['heal1','fuda','repel','I0026']);p.hidden[m.id]=1;bagAdd(id);sfx('get');await msg('花の かげに '+ITEMS[id].n+'が あった！');saveGame();
}
async function facilityMenu(){
  if(!S.flags.champ)return;
  if(facilityActive)return;
  const p=HitokariUpgrade.progress(S);
  await msg('巡環修練場　単戦の塔\nLv50に そろえた 3匹で 3連戦。戦闘ごとの 回復は なし。');
  await msg('道具の使用・経験値・賞金は なし。終了後、参加者の 手持ちは 元に 戻る。最高連覇 '+p.best+'。');
  if(S.party.length<3){await msg('参加には 手持ちが 3匹 必要。');return;}
  const picked=[];
  while(picked.length<3){const i=await menu(S.party.map((m,i)=>({label:monName(m),right:'Lv'+m.lv,dis:picked.includes(i)})),{x:8,y:35,w:224,title:(picked.length+1)+'匹目を 選ぶ',bg:()=>screenBG()});if(i<0)return;picked.push(i);}
  if(!(await confirmYN('この 3匹で 修練を はじめますか？')))return;
  const real=S.party,seen=Object.assign({},S.seen),speaker=SPEAKER;
  let won=false,completed=false,seed='facility:'+p.streak+':'+p.clears;
  facilityActive=true;
  try{
    S.party=picked.map(i=>{const a=JSON.parse(JSON.stringify(real[i]));a.lv=50;a.exp=expFor(SP[a.sp],50);healMon(a);return a;});
    for(let round=0;round<3;round++){
      const r=RNG(seed+':'+round),c=famCand(50,null),used=new Set(),team=[];
      while(team.length<3){const available=c.filter(f=>!used.has(f.id));if(!available.length)break;const f=r.pick(available);used.add(f.id);team.push({sp:formAt(f,50),lv:50});}
      await msg('修練　第'+(round+1)+'戦／3');
      const result=await battle({facility:true,trainer:{name:'修練官 '+(round+1),team:mkTeam(team,Math.min(31,24+round*3+p.streak)),money:0,spr:pSpr(60+round)}});
      if(result!=='win'){completed=true;break;}
      if(round===2){won=true;completed=true;}
    }
  }finally{
    S.party=real;S.seen=seen;facilityActive=false;SPEAKER=speaker;
    if(BT){BT=null;fxClear();UI.length=0;G.scene='world';G.fade=0;}
    folReset();
  }
  if(completed){const result=HitokariUpgrade.facilityResult(S,won);await msg(won?'3連戦を 制覇！　連続優勝 '+result.streak+'回！':'修練 終了。つぎは もっと さきへ！');saveGame();}
}
